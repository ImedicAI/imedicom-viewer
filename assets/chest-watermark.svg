<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 980" role="img" aria-label="Marca de agua torácica radiográfica sintética">
  <defs>
    <radialGradient id="thoraxGlow" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#e5edf1" stop-opacity=".22"/>
      <stop offset=".58" stop-color="#a6bac4" stop-opacity=".10"/>
      <stop offset="1" stop-color="#4f6874" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lungL" cx="56%" cy="43%" r="71%">
      <stop offset="0" stop-color="#03080b" stop-opacity=".82"/>
      <stop offset=".72" stop-color="#111c23" stop-opacity=".56"/>
      <stop offset="1" stop-color="#314650" stop-opacity=".08"/>
    </radialGradient>
    <radialGradient id="lungR" cx="44%" cy="43%" r="71%">
      <stop offset="0" stop-color="#03080b" stop-opacity=".82"/>
      <stop offset=".72" stop-color="#111c23" stop-opacity=".56"/>
      <stop offset="1" stop-color="#314650" stop-opacity=".08"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f0f4f6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#aebfc7" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="mediastinum" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b9c9d0" stop-opacity=".07"/>
      <stop offset=".5" stop-color="#e4ecef" stop-opacity=".20"/>
      <stop offset="1" stop-color="#b9c9d0" stop-opacity=".07"/>
    </linearGradient>
    <filter id="soft8"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="boneGlow"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>

  <rect width="820" height="980" fill="none"/>
  <ellipse cx="410" cy="475" rx="335" ry="405" fill="url(#thoraxGlow)" filter="url(#soft8)"/>

  <!-- Soft-tissue thoracic envelope -->
  <path d="M188 172 C245 111 322 89 410 91 C498 89 575 111 632 172 C688 232 711 345 699 492 C689 616 649 756 581 834 C527 896 477 918 410 920 C343 918 293 896 239 834 C171 756 131 616 121 492 C109 345 132 232 188 172Z" fill="#c5d3d9" fill-opacity=".055" filter="url(#soft8)"/>

