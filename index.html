<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>imeDICOM — Visor DICOM</title>
<link rel="stylesheet" href="viewer-premium.css">
<link rel="stylesheet" href="workstation-restoration.css">
<link rel="stylesheet" href="workstation-refinements-v2.css">
<link rel="stylesheet" href="workstation-corrections-v3.css?v=20260814-1">
</head>
<body>
<header class="appbar" id="ime-appbar">
  <div class="brand">
    <div>
      <div class="brand-name"><span class="ime">ime</span><span class="dicom">DICOM</span></div>
      <div class="brand-sub">Visor radiográfico DICOM</div>
    </div>
  </div>
  <nav class="nav" aria-label="Navegación principal">
    <button class="active" type="button">Visor</button>
  </nav>
  <nav class="appbar-tools" aria-label="Utilidades del visor">
    <button type="button" class="appbar-tool" title="Diseño" aria-label="Diseño"><span class="appbar-tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M12 5v14M4 10h8"/></svg></span><span>Diseño</span></button>
    <button type="button" class="appbar-tool" title="Ayuda" aria-label="Ayuda"><span class="appbar-tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9.8 9.2a2.4 2.4 0 0 1 4.6 1c0 1.7-2.4 2.1-2.4 4M12 17.3h.01"/></svg></span><span>Ayuda</span></button>
    <button type="button" class="appbar-tool" title="Ajustes" aria-label="Ajustes"><span class="appbar-tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><path d="M19 12a7 7 0 0 0-.1-1.1l2-1.5-2-3.4-2.4 1a7.5 7.5 0 0 0-1.9-1.1L14.3 3h-4.6l-.3 2.9A7.5 7.5 0 0 0 7.5 7L5.1 6l-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.1l-2 1.5 2 3.4 2.4-1a7.5 7.5 0 0 0 1.9 1.1l.3 2.9h4.6l.3-2.9a7.5 7.5 0 0 0 1.9-1.1l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1.1Z"/></svg></span><span>Ajustes</span></button>
  </nav>
</header>
<main id="viewerMount"><div id="viewerBoot">Inicializando visor DICOM…</div></main>
<script src="dicom-core.js"></script>
<script src="viewer-dicom-data.js"></script>
<script src="viewer-tools.js"></script>
<script src="viewer-render.js"></script>
<script src="viewer-export.js"></script>
<script src="viewer-ui.js"></script>
<script src="viewer-runtime.js"></script>
<script src="viewer-access.js"></script>
<script src="viewer-load.js"></script>
<script src="viewer-viewport.js"></script>
<script src="viewer-annotation-interaction.js"></script>
<script src="viewer-loader.js"></script>
<script>
(function loadWorkstationAfterViewer(){
  if(!document.documentElement.dataset.viewerIntegration){
    setTimeout(loadWorkstationAfterViewer,50);
    return;
  }
  if(document.documentElement.dataset.workstationBundleLoading==='true') return;
  document.documentElement.dataset.workstationBundleLoading='true';
  function load(src,marker){
    return new Promise((resolve,reject)=>{
      if(marker&&document.querySelector('script['+marker+']')){resolve();return;}
      const s=document.createElement('script');s.src=src;
      if(marker){const pair=marker.split('=');s.setAttribute(pair[0],pair[1].replace(/^"|"$/g,''));}
      s.onload=resolve;s.onerror=reject;document.body.appendChild(s);
    });
  }
  (async()=>{
    try{
      await load('workstation-restoration.js','data-workstation-restoration="true"');
      await load('workstation-utilities.js','data-workstation-utilities="true"');
      await load('workstation-refinements-v2.js?v=20260814-1','data-workstation-v2="true"');
      await load('workstation-refinements-v2-fix.js?v=20260814-1','data-workstation-v2-fix="true"');
      await load('workstation-refinements-v2-finalize.js?v=20260814-1','data-workstation-v2-finalize="true"');
      await load('workstation-corrections-v3.js?v=20260814-1','data-workstation-v3="true"');
      document.documentElement.dataset.workstationBundle='v3-20260814';
    }catch(err){
      console.error('imeDICOM: no se pudo completar la capa de workstation',err);
    }
  })();
})();
</script>
</body>
</html>
