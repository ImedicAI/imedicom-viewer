<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>imeDICOM — Visor DICOM</title>
<style>
:root{color-scheme:dark;--bg:#071019;--bar:#09131d;--panel:#0e1923;--line:#20303d;--accent:#23c9c1;--text:#e7edf2;--muted:#8796a5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
body{display:grid;grid-template-rows:64px 1fr}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #182733;background:linear-gradient(180deg,#0b1721 0%,#09131c 100%);box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:20}
.brand{display:flex;align-items:center;gap:13px;min-width:260px}.mark{width:38px;height:38px;position:relative}.mark:before{content:"";position:absolute;left:5px;top:3px;width:23px;height:27px;border-left:3px solid #e8eef2;border-bottom:3px solid #e8eef2;transform:skew(-22deg) rotate(-45deg);opacity:.95}.brand-name{font-size:19px;font-weight:650;letter-spacing:.1px}.brand-name .ime{color:#e8eef2}.brand-name .dicom{color:var(--accent)}.brand-sub{font-size:10px;color:#a7b4bf;margin-top:1px}
.topnav{display:flex;align-items:center;gap:27px;font-size:13px;color:#b7c2cb}.topnav button{appearance:none;border:0;background:transparent;color:inherit;padding:21px 2px 18px;cursor:pointer;border-bottom:2px solid transparent;font:inherit}.topnav button.active{color:var(--accent);border-bottom-color:var(--accent)}.topnav button:hover{color:#fff}.utilities{display:flex;gap:17px;align-items:center;color:#a8b6c2;font-size:18px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#182633;border:1px solid #2a3c4a;font-size:12px}
.viewer-frame{width:100%;height:100%;border:0;display:block;background:#071019}
@media(max-width:900px){body{grid-template-rows:52px 1fr}.appbar{padding:0 12px}.brand{min-width:0}.brand-sub,.topnav button:not(.active){display:none}.topnav{gap:12px}.utilities{gap:10px}}
</style>
</head>
<body>
<header class="appbar">
  <div class="brand"><div class="mark" aria-hidden="true"></div><div><div class="brand-name"><span class="ime">ime</span><span class="dicom">DICOM</span></div><div class="brand-sub">Visor DICOM para imagen médica</div></div></div>
  <nav class="topnav" aria-label="Navegación principal"><button class="active">▦&nbsp; Diseño</button><button>▤&nbsp; Series</button><button>◉&nbsp; Cine</button><button>▣&nbsp; Captura</button></nav>
  <div class="utilities"><span title="Brillo">☼</span><span title="Ayuda">?</span><span class="avatar">DR</span></div>
</header>
<iframe id="viewerFrame" class="viewer-frame" src="legacy-viewer.html" title="Visor imeDICOM"></iframe>
<script>
(function(){
  const frame=document.getElementById('viewerFrame');
  frame.addEventListener('load',()=>{
    let d;try{d=frame.contentDocument||frame.contentWindow.document}catch(e){return}
    if(!d||!d.head)return;
    const style=d.createElement('style');
    style.id='premium-v2-overrides';
    style.textContent=`
      :root{--bg:#071019!important;--panel:#0e1923!important;--panel-alt:#121f2a!important;--border:#22323f!important;--accent:#23c9c1!important;--accent-dim:#159d98!important;--text:#e7edf2!important;--text-muted:#8292a1!important}
      html,body{background:#071019!important}
      #dv-root{background:radial-gradient(circle at 52% 35%,#0c1720 0,#071019 58%,#050c12 100%)!important;padding:10px 12px 14px!important;gap:11px!important;min-height:100vh!important}
      .dv-header-logo,.dv-header-logo-vert{display:none!important}
      .dv-hero-row{margin:0!important;gap:10px!important}
      .dv-panel{background:linear-gradient(180deg,#101c26 0%,#0d1821 100%)!important;border:1px solid #21323f!important;border-radius:8px!important;box-shadow:0 8px 22px rgba(0,0,0,.14)!important}
      .dv-side-by-side{gap:10px!important;align-items:stretch!important}
      #dv-quad-imagen{padding:0!important;background:#04090d!important;border-color:#1f353f!important;box-shadow:0 0 0 1px rgba(35,201,193,.35)!important;overflow:hidden!important}
      #dv-quad-herramientas{flex:0 0 258px!important;max-width:258px!important;padding:14px!important;background:#0f1b25!important}
      #dv-quad-herramientas h3{font-size:12px!important;letter-spacing:.7px!important;text-transform:uppercase!important;color:#9fb1bf!important;margin:0 0 13px!important}
      #dv-quad-herramientas .dv-btn{background:#101d27!important;border:1px solid #2a3a47!important;color:#e6edf2!important;border-radius:5px!important;box-shadow:none!important;padding:9px 11px!important}
      #dv-quad-herramientas .dv-btn:hover{border-color:#3b6570!important;background:#132630!important}
      #dv-quad-herramientas .dv-btn.active,#dv-quad-herramientas .dv-btn[aria-pressed="true"]{border-color:#23c9c1!important;color:#23c9c1!important;background:rgba(35,201,193,.10)!important}
      .dv-tools-compact .dv-tool-grid{gap:7px!important}
      #dv-viewer-wrap{border:0!important;border-radius:7px!important;background:#020609!important;box-shadow:inset 0 0 70px rgba(0,0,0,.36)!important}
      #dv-viewer-wrap::before{background:radial-gradient(circle at center,transparent 42%,rgba(1,7,11,.34) 100%)!important}
      .dv-vslider-col{opacity:.55!important;transition:opacity .2s}.dv-vslider-col:hover{opacity:1!important}
      .dv-btn{border-radius:6px!important;transition:background .15s,border-color .15s,color .15s!important}
      .dv-btn.primary{background:linear-gradient(90deg,#159c98,#24c5bd)!important;border-color:#24c5bd!important;color:#071113!important;font-weight:700!important}
      .dv-select{background:#101d27!important;border-color:#293a47!important;border-radius:6px!important;color:#e7edf2!important}
      .dv-drag-handle{opacity:.25!important}
      #dv-empty{inset:0!important;width:100%!important;height:100%!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;text-align:center!important;color:#e9eef2!important;font-family:'IBM Plex Sans',sans-serif!important;line-height:1.35!important;pointer-events:none!important}
      #dv-empty .premium-upload-ring{width:92px;height:92px;border:1.5px dashed #9caab5;border-radius:50%;display:grid;place-items:center;margin-bottom:18px;background:rgba(7,16,25,.22);font-size:38px;color:#ecf2f5}
      #dv-empty .premium-title{font-size:23px;font-weight:650;letter-spacing:-.2px;margin-bottom:8px}
      #dv-empty .premium-copy{font-size:14px;color:#c2ccd4;line-height:1.55}
      #dv-empty .premium-demo{margin-top:17px;border:1px solid #3a4c58;background:#111d27;color:#e8eef2;border-radius:6px;padding:10px 15px;font-size:13px;display:inline-flex;gap:8px;align-items:center;pointer-events:auto}
      @media(max-width:1100px){#dv-quad-herramientas{flex-basis:220px!important;max-width:220px!important}}
    `;
    d.head.appendChild(style);

    const empty=d.getElementById('dv-empty');
    if(empty){
      empty.innerHTML='<div class="premium-upload-ring">⇧</div><div class="premium-title">Cargue un estudio DICOM</div><div class="premium-copy">Arrastra y suelta archivos DICOM aquí<br>o usa el botón de carga en el panel izquierdo.</div><button type="button" class="premium-demo" id="premium-demo-btn"><span>▱</span> Abrir estudio de ejemplo</button>';
      const demo=d.getElementById('premium-demo-btn');
      if(demo){demo.addEventListener('click',(ev)=>{ev.stopPropagation();const input=d.querySelector('input[type="file"]');if(input)input.click();});}
    }
  });
})();
</script>
</body>
</html>
