<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>imeDICOM — Visor DICOM</title>
<style id="shell-base">
:root{color-scheme:dark;--bg:#061018;--bar:#09141d;--line:#1d2c37;--accent:#25c9c0;--text:#e8eef2;--muted:#8fa0ae}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
body{display:grid;grid-template-rows:58px minmax(0,1fr)}
.appbar{display:grid;grid-template-columns:260px 1fr 200px;align-items:center;padding:0 18px;border-bottom:1px solid #172631;background:linear-gradient(180deg,#0b1720,#08121a);box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:10020;position:relative}
.brand{display:flex;align-items:center;gap:11px}.brand-badge{width:34px;height:34px;border:1px solid #29414c;border-radius:8px;display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:14px;background:#0d1b24}.brand-name{font-weight:720;font-size:18px;letter-spacing:.1px}.brand-name .ime{color:#f0f4f6}.brand-name .dicom{color:var(--accent)}.brand-sub{font-size:10px;color:#8495a3;margin-top:1px}
.nav{display:flex;justify-content:center;align-items:stretch;height:100%;gap:24px}.nav button{border:0;background:none;color:#9dabb6;font:inherit;font-size:12.5px;padding:0 4px;border-bottom:2px solid transparent}.nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
.utils{display:flex;justify-content:flex-end;gap:10px;align-items:center}.utility{width:31px;height:31px;border:1px solid #263846;background:#0f1b25;color:#a9b6bf;border-radius:7px;display:grid;place-items:center;font-size:13px}.avatar{border-radius:50%}
#viewerMount{min-height:0;overflow:hidden;position:relative;background:#061018}
#viewerBoot{position:absolute;inset:0;display:grid;place-items:center;color:#9fb0bc;font-size:13px;background:#061018;z-index:2}
@media(max-width:900px){body{grid-template-rows:52px minmax(0,1fr)}.appbar{grid-template-columns:1fr auto;padding:0 10px}.nav{display:none}.brand-sub{display:none}}
</style>
</head>
<body>
<header class="appbar" id="ime-appbar">
  <div class="brand"><div class="brand-badge">iD</div><div><div class="brand-name"><span class="ime">ime</span><span class="dicom">DICOM</span></div><div class="brand-sub">Radiology Dark Premium</div></div></div>
  <nav class="nav"><button class="active">Diseño</button><button>Series</button><button>Cine</button><button>Captura</button></nav>
  <div class="utils"><div class="utility" title="Brillo">☼</div><div class="utility" title="Ayuda">?</div><div class="utility avatar">DR</div></div>
</header>
<main id="viewerMount"><div id="viewerBoot">Inicializando visor DICOM…</div></main>
<script>
(async function(){
  const mount=document.getElementById('viewerMount');
  const shellBase=document.getElementById('shell-base');

  function addPremiumStyle(){
    const old=document.getElementById('premium-direct-overrides');
    if(old) old.remove();
    const s=document.createElement('style');
    s.id='premium-direct-overrides';
    s.textContent=`
      html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#061018!important}
      body{display:grid!important;grid-template-rows:58px minmax(0,1fr)!important;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif!important;color:#e8eef2!important}
      #ime-appbar{display:grid!important;grid-template-columns:260px 1fr 200px!important;align-items:center!important;height:58px!important;min-height:58px!important;padding:0 18px!important;margin:0!important;position:relative!important;inset:auto!important;background:linear-gradient(180deg,#0b1720,#08121a)!important;border-bottom:1px solid #172631!important;z-index:10020!important}
      #viewerMount{display:block!important;min-height:0!important;height:100%!important;overflow:hidden!important;position:relative!important;background:#061018!important}
      #viewerMount>#dv-lock-screen,#viewerMount>#dv-fullscreen-controls,#viewerMount>#dv-root{position:absolute}
      #viewerMount>#dv-root{inset:0!important;width:100%!important;height:100%!important;min-height:0!important;overflow:auto!important;padding:10px!important;background:radial-gradient(circle at 52% 42%,#0a151d 0,#061018 58%,#040b10 100%)!important}
      :root{--bg:#061018!important;--panel:#0d1821!important;--panel-alt:#111e28!important;--border:#21323f!important;--accent:#25c9c0!important;--accent-dim:#159a95!important;--text:#e8eef2!important;--text-muted:#81909d!important}
      .dv-header-logo,.dv-header-logo-vert{display:none!important}.dv-drag-handle{display:none!important}
      .dv-body{display:grid!important;grid-template-columns:276px minmax(0,1fr)!important;gap:10px!important;align-items:stretch!important;min-height:100%!important}
      .dv-left-col{width:auto!important;min-width:0!important;display:flex!important;flex-direction:column!important;gap:10px!important}.dv-main-col{min-width:0!important;display:block!important}
      .dv-side-by-side{display:grid!important;grid-template-columns:minmax(0,1fr) 252px!important;gap:10px!important;align-items:stretch!important;height:100%!important}
      .dv-panel{background:linear-gradient(180deg,#101b24,#0d1720)!important;border:1px solid #1f303c!important;border-radius:8px!important;box-shadow:none!important}.dv-left-col .dv-panel{padding:13px!important}
      .dv-left-col h3,#dv-quad-herramientas h3{font-size:11px!important;text-transform:uppercase!important;letter-spacing:.75px!important;color:#9aabb7!important;margin:0 0 11px!important;font-weight:650!important}
      #dv-quad-imagen{padding:0!important;background:#020609!important;border:1px solid #26505a!important;box-shadow:0 0 0 1px rgba(37,201,192,.15)!important;overflow:hidden!important;min-height:calc(100vh - 78px)!important}
      #dv-quad-herramientas{width:auto!important;max-width:none!important;min-width:0!important;padding:13px!important;background:#0d1821!important;overflow:auto!important}
      #dv-quad-herramientas .dv-controls{margin-top:7px!important}#dv-quad-herramientas .dv-tool-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}#dv-quad-herramientas .dv-tool-grid:first-of-type{grid-template-columns:repeat(4,minmax(0,1fr))!important}
      #dv-quad-herramientas .dv-btn{width:100%!important;min-width:0!important;background:#111e28!important;border:1px solid #293b47!important;color:#e7edf1!important;border-radius:6px!important;padding:9px 8px!important;font-size:12px!important;box-shadow:none!important}#dv-quad-herramientas .dv-btn:hover{background:#142631!important;border-color:#3c6870!important}
      #dv-quad-herramientas .dv-btn.dv-tool-active,#dv-quad-herramientas .dv-btn.active,#dv-quad-herramientas .dv-btn[aria-pressed="true"]{background:rgba(37,201,192,.11)!important;border-color:#25c9c0!important;color:#38d7ce!important}
      #dv-quad-herramientas .dv-flyout-wrap,#dv-quad-herramientas .dv-color-picker{width:100%!important}.dv-tool-unit{height:auto!important}.dv-tool-unit-main{width:100%!important;height:auto!important}.dv-tool-unit-arrow{height:100%!important}
      .dv-btn{border-radius:6px!important;box-shadow:none!important}.dv-btn.primary{background:linear-gradient(90deg,#169c97,#25c9c0)!important;border-color:#25c9c0!important;color:#061113!important;font-weight:750!important}.dv-btn.secondary{background:#111e28!important;border-color:#293b47!important;color:#e5ebef!important}.dv-select{background:#101c26!important;border-color:#293b47!important;border-radius:6px!important;color:#e6edf1!important}
      #dv-viewer-wrap{border:0!important;border-radius:7px!important;background:#010407!important;box-shadow:inset 0 0 80px rgba(0,0,0,.38)!important}#dv-viewer-wrap::before{background:radial-gradient(circle at center,transparent 50%,rgba(0,5,8,.32) 100%)!important}.dv-vslider-col{opacity:.46!important;transition:opacity .15s}.dv-vslider-col:hover{opacity:1!important}
      #dv-empty{inset:0!important;width:100%!important;height:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;flex-direction:column!important;text-align:center!important;color:#eef3f5!important;pointer-events:none!important}#dv-empty .premium-ring{width:92px;height:92px;border-radius:50%;border:1.5px dashed #9aa9b4;display:grid;place-items:center;font-size:36px;color:#eef3f5;margin-bottom:18px;background:rgba(7,16,24,.22)}#dv-empty .premium-title{font-size:23px;font-weight:680;margin-bottom:8px;letter-spacing:-.2px}#dv-empty .premium-copy{font-size:13.5px;color:#bcc7cf;line-height:1.55}#dv-empty .premium-demo{pointer-events:auto;margin-top:17px;padding:10px 14px;border-radius:6px;border:1px solid #394b57;background:#111e28;color:#e8eef2;font-size:12.5px}
      .premium-section{font-size:10px!important;letter-spacing:.8px!important;text-transform:uppercase!important;color:#72828e!important;margin:12px 0 5px!important;grid-column:1/-1!important}
      @media(max-width:1150px){.dv-body{grid-template-columns:235px minmax(0,1fr)!important}.dv-side-by-side{grid-template-columns:minmax(0,1fr) 220px!important}}
      @media(max-width:900px){body{grid-template-rows:52px minmax(0,1fr)!important}#ime-appbar{height:52px!important;min-height:52px!important;grid-template-columns:1fr auto!important;padding:0 10px!important}.dv-body{display:block!important}.dv-left-col{margin-bottom:8px!important}.dv-side-by-side{display:block!important}#dv-quad-herramientas{margin-top:8px!important}}
    `;
    document.head.appendChild(s);
  }

  function applyPremiumDom(){
    const empty=document.getElementById('dv-empty');
    if(empty){
      empty.innerHTML='<div class="premium-ring">⇧</div><div class="premium-title">Cargue un estudio DICOM</div><div class="premium-copy">Arrastra y suelta archivos DICOM aquí<br>o usa el botón de carga en el panel izquierdo.</div><button type="button" class="premium-demo" id="premium-demo">▱&nbsp; Abrir estudio de ejemplo</button>';
      const demo=document.getElementById('premium-demo');
      if(demo) demo.addEventListener('click',e=>{e.stopPropagation();const input=document.querySelector('input[type=file]');if(input)input.click()});
    }
    const tools=document.getElementById('dv-quad-herramientas');
    if(tools){
      const makeLabel=(text,before)=>{if(!before||before.previousElementSibling?.classList?.contains('premium-section'))return;const x=document.createElement('div');x.className='premium-section';x.textContent=text;before.parentNode.insertBefore(x,before)};
      makeLabel('Marcadores',tools.querySelector('.dv-controls'));
      const transform=document.getElementById('dv-transform-opener');if(transform)makeLabel('Transformar',transform.closest('.dv-controls'));
      const arrow=document.getElementById('dv-tool-arrow');if(arrow)makeLabel('Medición y anotación',arrow.closest('.dv-controls'));
      const bone=document.getElementById('dv-profile-bone');if(bone)makeLabel('Preset',bone.closest('.dv-controls'));
    }
  }

  async function executeScripts(scripts){
    for(const source of scripts){
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        for(const a of source.attributes) if(a.name!=='src') s.setAttribute(a.name,a.value);
        if(source.src){s.src=source.getAttribute('src');s.onload=resolve;s.onerror=()=>{console.warn('No se pudo cargar',s.src);resolve();};document.body.appendChild(s);}
        else {s.textContent=source.textContent;document.body.appendChild(s);resolve();}
      });
    }
  }

  try{
    const response=await fetch('legacy-viewer.html',{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const html=await response.text();
    const parsed=new DOMParser().parseFromString(html,'text/html');
    const scripts=[...parsed.querySelectorAll('script')];
    scripts.forEach(s=>s.remove());

    const legacyHeadNodes=[...parsed.head.querySelectorAll('style,link[rel="stylesheet"]')];
    for(const node of legacyHeadNodes){
      const clone=node.cloneNode(true);
      document.head.insertBefore(clone,shellBase);
    }

    mount.innerHTML=parsed.body.innerHTML;
    addPremiumStyle();
    await executeScripts(scripts);
    applyPremiumDom();
    document.documentElement.dataset.viewerIntegration='direct-dom';
    console.info('imeDICOM: visor montado en DOM directo, sin iframe');
  }catch(err){
    console.error(err);
    mount.innerHTML='<div style="height:100%;display:grid;place-items:center;padding:32px;text-align:center;color:#d8e2e8;background:#061018"><div><div style="font-size:18px;font-weight:700;margin-bottom:8px">No se pudo inicializar el visor</div><div style="font-size:13px;color:#91a2af">Recarga la página. La versión de respaldo permanece disponible en legacy-viewer.html.</div></div></div>';
  }
})();
</script>
</body>
</html>
