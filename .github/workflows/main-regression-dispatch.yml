name: Main full regression dispatch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validated regression workflows on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          repo="${GITHUB_REPOSITORY}"
          workflows=(
            runtime-validation.yml
            ui-controls-validation.yml
            tools-validation.yml
            export-validation.yml
            regression-validation.yml
            session-folder-fullscreen-validation.yml
            large-matrix-performance.yml
            workstation-restoration-validation.yml
          )
          for workflow in "${workflows[@]}"; do
            echo "Dispatching ${workflow} on main"
            gh workflow run "$workflow" --repo "$repo" --ref main
          done
