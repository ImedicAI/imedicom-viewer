name: Split legacy source

on:
  workflow_dispatch:
  push:
    branches:
      - redesign/radiology-dark-premium
    paths:
      - viewer-source.html
      - .github/workflows/split-legacy-source.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split source into shell and script bundle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path('viewer-source.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\b[^>]*>.*?</script\s*>', src, flags=re.I|re.S)
          if len(scripts) < 2:
              raise SystemExit(f'Unexpected script count: {len(scripts)}')
          shell = re.sub(r'<script\b[^>]*>.*?</script\s*>', '', src, flags=re.I|re.S)
          Path('viewer-shell.html').write_text(shell, encoding='utf-8')
          Path('viewer-legacy-scripts.html').write_text('\n'.join(scripts)+'\n', encoding='utf-8')
          print('source bytes', len(src.encode()))
          print('shell bytes', len(shell.encode()))
          print('script blocks', len(scripts))
          print('scripts bytes', len(('\n'.join(scripts)).encode()))
          PY
      - name: Commit generated split
        shell: bash
        run: |
          if git diff --quiet -- viewer-shell.html viewer-legacy-scripts.html 2>/dev/null && \
             git ls-files --error-unmatch viewer-shell.html viewer-legacy-scripts.html >/dev/null 2>&1; then
            echo 'Generated files already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer-shell.html viewer-legacy-scripts.html
          git commit -m 'build: generate split viewer shell and legacy scripts'
          git push origin HEAD:redesign/radiology-dark-premium
