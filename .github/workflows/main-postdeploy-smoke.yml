name: Main post-deploy smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production assets
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f viewer-shell.html
          test -f workstation-restoration.css
          test -f workstation-restoration.js
          test -f workstation-utilities.js
          test -f workstation-refinements-v2.css
          test -f workstation-refinements-v2.js
          test -f viewer-watermark.webp
          grep -q 'workstation-refinements-v2.css' index.html
          grep -q 'workstation-refinements-v2.js' index.html
          grep -q 'viewer-loader.js' index.html
          ! grep -q 'viewer-source.html' viewer-loader.js
          node --check viewer-ui.js
          node --check viewer-loader.js
          node --check workstation-restoration.js
          node --check workstation-utilities.js
          node --check workstation-refinements-v2.js

      - name: Find Chromium
        id: browser
        shell: bash
        run: |
          set -e
          for b in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$b" >/dev/null 2>&1; then
              echo "bin=$(command -v "$b")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1

      - name: Build unlocked production smoke page
        shell: bash
        run: |
          mkdir -p tests
          cat > tests/main-smoke.js <<'JS'
          (async()=>{
            const wait=ms=>new Promise(r=>setTimeout(r,ms));
            const result=document.createElement('div');
            result.id='ime-main-smoke-result';
            result.style.display='none';
            document.body.appendChild(result);
            const finish=(s,d)=>{result.dataset.status=s;result.textContent=JSON.stringify(d||{});document.documentElement.dataset.mainSmoke=s;};
            const until=async(fn,label)=>{for(let i=0;i<180;i++){const v=fn();if(v)return v;await wait(100);}throw new Error('timeout_'+label);};
            try{
              await until(()=>document.documentElement.dataset.viewerIntegration,'viewer');
              const root=document.getElementById('dv-root');
              const lock=document.getElementById('dv-lock-screen');
              if(!root) throw new Error('root_missing');
              root.classList.remove('dv-locked');
              if(lock) lock.classList.add('dv-hidden');
              await until(()=>document.getElementById('dv-tool-crop')&&document.getElementById('premium-layout-opener'),'v2_controls');

              for(const id of ['dv-viewer-wrap','dv-quad-herramientas','premium-study-status','premium-layout-opener','v2-res-wrap','v2-measure-top','v2-measure-second','v2-measure-bottom']){
                if(!document.getElementById(id)) throw new Error('missing_'+id);
              }
              if(document.querySelector('.premium-bottom-dock')) throw new Error('old_bottom_dock_present');
              if(document.getElementById('dv-clear-annotations')) throw new Error('old_clear_button_present');
              const markers=[...document.querySelectorAll('#dv-quad-herramientas .premium-marker-row .dv-marker-btn')];
              if(markers.length!==4) throw new Error('marker_count_'+markers.length);
              if(document.querySelector('#premium-transform-grid .premium-refine-label')) throw new Error('transform_text_still_present');
              if(document.querySelectorAll('#v2-measure-top .v2-measure-button').length!==3) throw new Error('measure_top_count');
              if(document.querySelectorAll('#v2-measure-second .v2-measure-button').length!==2) throw new Error('measure_second_count');
              if(document.querySelectorAll('#v2-measure-bottom .v2-measure-button').length!==2) throw new Error('measure_bottom_count');
              if(document.getElementById('dv-wlww-reset')?.textContent.trim()!=='RESET') throw new Error('reset_word');

              const view=document.getElementById('dv-view-opener');
              view.click(); await wait(80);
              const viewMenu=document.getElementById('dv-view-dropdown');
              if(!viewMenu||!viewMenu.classList.contains('open')) throw new Error('view_menu_not_open');
              if(viewMenu.querySelectorAll('.dv-btn').length!==2) throw new Error('view_menu_options_'+viewMenu.querySelectorAll('.dv-btn').length);
              if(document.getElementById('dv-toggle-measurements')||document.getElementById('dv-show-tags')) throw new Error('crossed_view_options_present');
              view.click();

              const resArrow=document.getElementById('v2-res-arrow');
              resArrow.click(); await wait(20);
              const resMenu=document.getElementById('v2-res-menu');
              if(!resMenu.classList.contains('open')) throw new Error('res_menu_not_open');
              resMenu.querySelector('[data-res="4"]').click();
              if(document.getElementById('dv-res').value!=='4') throw new Error('resolution_not_4k');

              const watermark=document.querySelector('.premium-empty-watermark');
              if(!watermark?.classList.contains('v2-full-watermark')) throw new Error('watermark_not_full');
              const layoutMenu=document.getElementById('premium-layout-dropdown');
              if(layoutMenu.querySelectorAll('button[data-layout]').length!==4) throw new Error('layout_options');

              window.imeDicomWorkstation.setMultiLayout(4); await wait(80);
              if(document.querySelectorAll('#premium-multiview .premium-multiview-cell').length!==4) throw new Error('multiview_cells');
              window.imeDicomWorkstation.setMultiLayout(1); await wait(50);

              const canvas=document.getElementById('dv-canvas');
              canvas.width=240; canvas.height=180; canvas.style.display='block'; canvas.style.width='240px'; canvas.style.height='180px';
              const ctx=canvas.getContext('2d');ctx.fillStyle='#777';ctx.fillRect(0,0,240,180);ctx.fillStyle='#ddd';ctx.fillRect(40,30,140,100);
              const wrap=document.getElementById('dv-viewer-wrap');
              document.getElementById('dv-tool-crop').click(); await wait(20);
              const cr=canvas.getBoundingClientRect();
              const sx=cr.left+30,sy=cr.top+25,ex=cr.left+170,ey=cr.top+125;
              wrap.dispatchEvent(new MouseEvent('mousedown',{bubbles:true,cancelable:true,button:0,clientX:sx,clientY:sy}));
              wrap.dispatchEvent(new MouseEvent('mousemove',{bubbles:true,cancelable:true,button:0,clientX:ex,clientY:ey}));
              wrap.dispatchEvent(new MouseEvent('mouseup',{bubbles:true,cancelable:true,button:0,clientX:ex,clientY:ey}));
              await wait(50);
              if(!document.getElementById('v2-main-crop-layer')) throw new Error('crop_layer_missing');
              if(canvas.style.visibility!=='hidden') throw new Error('crop_original_not_hidden');
              document.getElementById('dv-wlww-reset').click(); await wait(20);
              if(document.getElementById('v2-main-crop-layer')) throw new Error('crop_reset_failed');
              if(canvas.style.visibility!=='visible') throw new Error('crop_original_not_restored');

              finish('pass',{markers:4,viewMenu:2,layouts:4,resolution4k:true,crop:true,watermark:true,measureGrid:'3-2-2'});
            }catch(err){finish('fail',{error:err.message});}
          })();
          JS
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          Path('main-smoke.html').write_text(s.replace('</body>','<script src="tests/main-smoke.js"></script>\n</body>'))
          PY

      - name: Start static server
        run: |
          python3 -m http.server 8080 >server-main-smoke.log 2>&1 &
          sleep 2

      - name: Exercise production DOM
        shell: bash
        env:
          CHROME: ${{ steps.browser.outputs.bin }}
        run: |
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=24000 --window-size=1600,1000 \
            --dump-dom --screenshot=main-workstation.png \
            http://127.0.0.1:8080/main-smoke.html > dom-main-smoke.html 2> chrome-main-smoke.log || true
          grep -q 'data-main-smoke="pass"' dom-main-smoke.html
          grep -q '"crop":true' dom-main-smoke.html
          grep -q '"viewMenu":2' dom-main-smoke.html
          grep -q '"resolution4k":true' dom-main-smoke.html
          if grep -q 'data-main-smoke="fail"' dom-main-smoke.html; then
            grep 'ime-main-smoke-result' dom-main-smoke.html >&2 || true
            exit 1
          fi

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-postdeploy-smoke
          path: |
            main-workstation.png
            dom-main-smoke.html
            chrome-main-smoke.log
            server-main-smoke.log
