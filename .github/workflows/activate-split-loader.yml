name: Activate split loader

on:
  workflow_dispatch:
  push:
    branches:
      - redesign/radiology-dark-premium
    paths:
      - viewer-shell.html
      - viewer-legacy-scripts.html
      - .github/workflows/activate-split-loader.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loader to use split artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('viewer-loader.js')
          text=p.read_text(encoding='utf-8')
          old="""    const response=await fetch('viewer-source.html',{cache:'no-store'});\n    if(!response.ok) throw new Error('HTTP '+response.status);\n    const html=await response.text();\n    const parsed=new DOMParser().parseFromString(html,'text/html');\n    const scripts=[...parsed.querySelectorAll('script')];\n    scripts.forEach(s=>s.remove());\n\n    for(const node of [...parsed.head.querySelectorAll('style,link[rel=\"stylesheet\"]')]){\n      const clone=node.cloneNode(true);\n      clone.dataset.viewerBaseStyle='true';\n      document.head.appendChild(clone);\n    }\n\n    mount.innerHTML=parsed.body.innerHTML;\n    await executeScripts(scripts);\n"""
          new="""    const [shellResponse,scriptsResponse]=await Promise.all([\n      fetch('viewer-shell.html',{cache:'no-store'}),\n      fetch('viewer-legacy-scripts.html',{cache:'no-store'})\n    ]);\n    if(!shellResponse.ok) throw new Error('viewer-shell HTTP '+shellResponse.status);\n    if(!scriptsResponse.ok) throw new Error('viewer-legacy-scripts HTTP '+scriptsResponse.status);\n    const shellHtml=await shellResponse.text();\n    const scriptsHtml=await scriptsResponse.text();\n    const parsedShell=new DOMParser().parseFromString(shellHtml,'text/html');\n    const parsedScripts=new DOMParser().parseFromString(scriptsHtml,'text/html');\n    const scripts=[...parsedScripts.querySelectorAll('script')];\n\n    for(const node of [...parsedShell.head.querySelectorAll('style,link[rel=\"stylesheet\"]')]){\n      const clone=node.cloneNode(true);\n      clone.dataset.viewerBaseStyle='true';\n      document.head.appendChild(clone);\n    }\n\n    mount.innerHTML=parsedShell.body.innerHTML;\n    await executeScripts(scripts);\n"""
          if old not in text:
              if "fetch('viewer-shell.html'" in text:
                  print('Loader already patched')
              else:
                  raise SystemExit('Expected viewer-source loader block not found')
          else:
              text=text.replace(old,new,1)
          text=text.replace("direct-dom-modular-source-data-ui-runtime-access-load-viewport-annotation-hit-extracted","split-shell-modular-data-ui-runtime-access-load-viewport-annotation-hit-extracted")
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit loader patch
        shell: bash
        run: |
          if git diff --quiet -- viewer-loader.js; then
            echo 'No loader changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add viewer-loader.js
          git commit -m 'refactor: load split viewer shell and legacy scripts'
          git push origin HEAD:redesign/radiology-dark-premium
