name: Export validation

on:
  push:
    branches: [redesign/radiology-dark-premium, ui/workstation-premium-restoration]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find Chromium
        id: browser
        shell: bash
        run: |
          for b in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$b" >/dev/null 2>&1; then echo "bin=$(command -v "$b")" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          exit 1
      - name: Build fixture and export harness
        shell: bash
        run: |
          mkdir -p tests
          python3 - <<'PY'
          import struct, pathlib
          out=bytearray(128)+b'DICM'
          def even(b,p=b' '): return b if len(b)%2==0 else b+p
          def elem(g,e,vr,v):
              global out
              if isinstance(v,str): v=even(v.encode('ascii'),b'\0' if vr=='UI' else b' ')
              elif isinstance(v,int): v=struct.pack('<H',v)
              if vr in ('OB','OW','OF','SQ','UT','UN','OD','OL','UC','UR'):
                  out.extend(struct.pack('<HH2sH',g,e,vr.encode(),0)); out.extend(struct.pack('<I',len(v)))
              else: out.extend(struct.pack('<HH2sH',g,e,vr.encode(),len(v)))
              out.extend(v)
          elem(0x0002,0x0010,'UI','1.2.840.10008.1.2.1')
          elem(0x0008,0x0020,'DA','20260812'); elem(0x0008,0x0030,'TM','171500')
          elem(0x0008,0x0060,'CS','DX'); elem(0x0008,0x0080,'LO','IMEDICA TEST')
          elem(0x0010,0x0010,'PN','EXPORT^CONTROL'); elem(0x0010,0x0020,'LO','EXP-001'); elem(0x0010,0x0030,'DA','19800101')
          elem(0x0018,0x0015,'CS','CHEST'); elem(0x0018,0x5101,'CS','AP')
          elem(0x0028,0x0002,'US',1); elem(0x0028,0x0004,'CS','MONOCHROME2'); elem(0x0028,0x0010,'US',6); elem(0x0028,0x0011,'US',8)
          elem(0x0028,0x0030,'DS','0.20\\0.20'); elem(0x0028,0x0100,'US',8); elem(0x0028,0x0101,'US',8); elem(0x0028,0x0102,'US',7); elem(0x0028,0x0103,'US',0)
          elem(0x0028,0x1050,'DS','128'); elem(0x0028,0x1051,'DS','256'); elem(0x0028,0x1052,'DS','0'); elem(0x0028,0x1053,'DS','1')
          pixels=bytes([0,16,32,48,64,80,96,112,32,48,64,80,96,112,128,144,64,80,96,112,128,144,160,176,96,112,128,144,160,176,192,208,128,144,160,176,192,208,224,240,144,160,176,192,208,224,240,255])
          elem(0x7fe0,0x0010,'OB',pixels)
          pathlib.Path('tests/export.dcm').write_bytes(out)
          PY

          cat > tests/export-test.js <<'JS'
          (function(){
            const result=document.createElement('div'); result.id='ime-export-result'; result.style.display='none'; document.body.appendChild(result);
            const stage=s=>{result.dataset.stage=s;};
            const finish=(s,d)=>{result.dataset.status=s;result.textContent=JSON.stringify(d||{});document.documentElement.dataset.exportValidation=s;};
            const wait=ms=>new Promise(r=>setTimeout(r,ms));
            async function bytesOf(blob){return new Uint8Array(await blob.arrayBuffer());}
            async function pngSize(blob){
              const b=await bytesOf(blob);
              if(b.length<24||b[0]!==137||b[1]!==80||b[2]!==78||b[3]!==71) throw new Error('png_signature');
              const dv=new DataView(b.buffer,b.byteOffset,b.byteLength); return [dv.getUint32(16),dv.getUint32(20)];
            }
            async function jpgSize(blob){
              const b=await bytesOf(blob); if(b[0]!==0xFF||b[1]!==0xD8) throw new Error('jpg_signature');
              let i=2;
              while(i+8<b.length){
                if(b[i]!==0xFF){i++;continue;}
                const marker=b[i+1]; i+=2;
                if(marker===0xD8||marker===0xD9) continue;
                if(i+1>=b.length) break;
                const len=(b[i]<<8)|b[i+1];
                if([0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF].includes(marker)){
                  return [(b[i+5]<<8)|b[i+6],(b[i+3]<<8)|b[i+4]];
                }
                if(len<2) break; i+=len;
              }
              throw new Error('jpg_sof_missing');
            }
            async function blobHeader(blob,n){
              const b=new Uint8Array(await blob.slice(0,n).arrayBuffer()); return Array.from(b).map(x=>String.fromCharCode(x)).join('');
            }
            window.addEventListener('imeDicom:file-error',e=>finish('fail',{error:e.detail?.error||'file-error'}),{once:true});
            window.addEventListener('imeDicom:file-loaded',async e=>{
              try{
                stage('loaded');
                const f=e.detail.entry, ex=window.imeDicomExport, render=window.imeDicomRender;
                if(!f||!ex||!render) throw new Error('missing_runtime');
                f.annotations=f.annotations||[];
                f.annotations.push({type:'arrow',x1:.15,y1:.20,x2:.70,y2:.65,color:'#FF3B30'});
                const deps={windowToCanvas:render.windowToCanvas,drawOverlay:render.drawOverlay,drawAnnotations:render.drawAnnotations};
                const c=ex.buildExportCanvas(f,2,deps); stage('canvas');
                if(c.width!==16||c.height!==12) throw new Error('export_canvas_dimensions_'+c.width+'x'+c.height);
                const pix=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
                let mn=255,mx=0; for(let i=0;i<pix.length;i+=4){mn=Math.min(mn,pix[i]);mx=Math.max(mx,pix[i]);}
                if(!(mx>mn)) throw new Error('export_canvas_uniform');

                const expectedName='EXPORT EXP-001';
                const built=ex.buildUniqueFilename(f,[f]);
                if(built!==expectedName) throw new Error('filename_'+built);
                const sanitized=ex.sanitizeFilenamePart('A/B:C*D?E');
                if(sanitized!=='A_B_C_D_E') throw new Error('sanitize_'+sanitized);

                const captured={};
                const saver=kind=>async(blob,filename)=>{captured[kind]={blob,filename};return true;};
                await ex.downloadCanvasAsPng(c,expectedName+'.png',saver('png')); stage('png');
                await ex.downloadCanvasAsJpg(c,expectedName+'.jpg',saver('jpg')); stage('jpg');
                if(!captured.png||captured.png.filename!==expectedName+'.png'||captured.png.blob.type!=='image/png'||captured.png.blob.size<50) throw new Error('png_blob');
                if(!captured.jpg||captured.jpg.filename!==expectedName+'.jpg'||captured.jpg.blob.type!=='image/jpeg'||captured.jpg.blob.size<50) throw new Error('jpg_blob');
                const pSize=await pngSize(captured.png.blob), jSize=await jpgSize(captured.jpg.blob); stage('image-headers');
                if(pSize[0]!==16||pSize[1]!==12) throw new Error('png_dimensions_'+pSize);
                if(jSize[0]!==16||jSize[1]!==12) throw new Error('jpg_dimensions_'+jSize);

                if(window.__dvPdfFailed||!window.jspdf) throw new Error('jspdf_unavailable_in_normal_test');
                await ex.downloadCanvasAsPdf(c,expectedName+'.pdf',saver('pdf')); stage('pdf');
                if(!captured.pdf||captured.pdf.filename!==expectedName+'.pdf'||captured.pdf.blob.size<100) throw new Error('pdf_blob');
                const pdfHeader=await blobHeader(captured.pdf.blob,5);
                if(pdfHeader!=='%PDF-') throw new Error('pdf_header_'+pdfHeader);

                const prevFail=window.__dvPdfFailed; window.__dvPdfFailed=true;
                let fallbackError='';
                try{await ex.downloadCanvasAsPdf(c,'blocked.pdf',saver('blocked'));}catch(err){fallbackError=err.message||String(err);}
                window.__dvPdfFailed=prevFail;
                if(!fallbackError.includes('generador de PDF')) throw new Error('pdf_fallback_not_controlled');
                stage('fallback');

                finish('pass',{canvas:[c.width,c.height],filename:built,png:{size:captured.png.blob.size,dimensions:pSize},jpg:{size:captured.jpg.blob.size,dimensions:jSize},pdf:{size:captured.pdf.blob.size,header:pdfHeader},fallback:true});
              }catch(err){finish('fail',{stage:result.dataset.stage||'',error:err.message});}
            },{once:true});
            (async()=>{
              for(let i=0;i<120;i++){
                const input=document.getElementById('dv-file-input');
                if(input&&document.documentElement.dataset.viewerIntegration){
                  const blob=await (await fetch('tests/export.dcm')).blob(); const file=new File([blob],'export.dcm',{type:'application/dicom'}); const dt=new DataTransfer(); dt.items.add(file); input.files=dt.files; input.dispatchEvent(new Event('change',{bubbles:true})); return;
                }
                await wait(100);
              }
              finish('fail',{error:'viewer_not_ready'});
            })();
          })();
          JS
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(); Path('export-test.html').write_text(s.replace('</body>','<script src="tests/export-test.js"></script>\n</body>'))
          PY
      - name: Start server
        run: python3 -m http.server 8080 >server.log 2>&1 &
      - name: Exercise export pipeline
        env:
          CHROME: ${{ steps.browser.outputs.bin }}
        shell: bash
        run: |
          sleep 2
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=18000 --dump-dom http://127.0.0.1:8080/export-test.html > dom-export.html 2> chrome-export.log || true
          grep -q 'data-export-validation="pass"' dom-export.html
          grep -q '"header":"%PDF-"' dom-export.html
          grep -q '"fallback":true' dom-export.html
          if grep -q 'data-export-validation="fail"' dom-export.html; then grep 'ime-export-result' dom-export.html >&2 || true; exit 1; fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-validation
          path: |
            dom-export.html
            chrome-export.log
            tests/export.dcm
