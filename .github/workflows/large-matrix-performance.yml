name: Large matrix performance

on:
  push:
    branches:
      - redesign/radiology-dark-premium
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find Chromium
        id: browser
        shell: bash
        run: |
          set -e
          for b in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$b" >/dev/null 2>&1; then echo "bin=$(command -v "$b")" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          exit 1

      - name: Build 2660x2180 12-bit MONOCHROME1 fixture and benchmark
        shell: bash
        run: |
          mkdir -p tests
          python3 - <<'PY'
          import struct, pathlib, array
          out=bytearray(128)+b'DICM'
          def even(b,p=b' '): return b if len(b)%2==0 else b+p
          def elem(g,e,vr,v):
              if isinstance(v,str): v=even(v.encode('ascii'),b'\0' if vr=='UI' else b' ')
              elif isinstance(v,int): v=struct.pack('<H',v)
              if vr in ('OB','OW','OF','SQ','UT','UN','OD','OL','UC','UR'):
                  out.extend(struct.pack('<HH2sH',g,e,vr.encode(),0)); out.extend(struct.pack('<I',len(v)))
              else: out.extend(struct.pack('<HH2sH',g,e,vr.encode(),len(v)))
              out.extend(v)
          elem(0x0002,0x0010,'UI','1.2.840.10008.1.2.1')
          elem(0x0008,0x0060,'CS','CR'); elem(0x0018,0x0015,'CS','THORAX'); elem(0x0018,0x5101,'CS','PA')
          rows,cols=2660,2180
          elem(0x0028,0x0002,'US',1); elem(0x0028,0x0004,'CS','MONOCHROME1')
          elem(0x0028,0x0010,'US',rows); elem(0x0028,0x0011,'US',cols)
          elem(0x0018,0x1164,'DS','0.160003\\0.160114')
          elem(0x0028,0x0100,'US',16); elem(0x0028,0x0101,'US',12); elem(0x0028,0x0102,'US',11); elem(0x0028,0x0103,'US',0)
          elem(0x0028,0x1050,'DS','2048'); elem(0x0028,0x1051,'DS','4095')
          pix=array.array('H', ((x*13 + y*7) % 3000 for y in range(rows) for x in range(cols)))
          elem(0x7fe0,0x0010,'OW',pix.tobytes())
          pathlib.Path('tests/large.dcm').write_bytes(out)
          print('bytes',len(out))
          PY

          cat > performance-test.html <<'HTML'
          <!doctype html><html><body>
          <div id="result">pending</div>
          <script src="dicom-core.js"></script><script src="viewer-dicom-data.js"></script><script src="viewer-render.js"></script>
          <script>
          (async()=>{
            const r=document.getElementById('result');
            try{
              const t0=performance.now();
              const ab=await (await fetch('tests/large.dcm')).arrayBuffer();
              const tFetch=performance.now();
              const ds=window.imeDicomCore.dicomParser.parseDicom(new Uint8Array(ab));
              const tParse=performance.now();
              const px=window.imeDicomData.extractPixel(ds);
              const tExtract=performance.now();
              const f={pixel:px,rotation:90,flipH:true,flipV:false,invert:false,annotations:[]};
              const c1=window.imeDicomRender.renderBaseImage(f,1);
              const tRender1=performance.now();
              const c2=window.imeDicomRender.renderBaseImage(f,1);
              const tCached=performance.now();
              px.windowCenter+=50;
              const c3=window.imeDicomRender.renderBaseImage(f,1);
              const tRender2=performance.now();
              const detail={bytes:ab.byteLength,rows:px.rows,cols:px.cols,w:c1.width,h:c1.height,
                fetchMs:+(tFetch-t0).toFixed(1),parseMs:+(tParse-tFetch).toFixed(1),extractMs:+(tExtract-tParse).toFixed(1),
                firstRenderMs:+(tRender1-tExtract).toFixed(1),cachedRenderMs:+(tCached-tRender1).toFixed(1),wwWlRerenderMs:+(tRender2-tCached).toFixed(1),
                mmPerPixel:px.mmPerPixel};
              r.dataset.status='pass'; r.textContent=JSON.stringify(detail); document.documentElement.dataset.performance='pass';
            }catch(e){r.dataset.status='fail';r.textContent=e.stack||e.message;document.documentElement.dataset.performance='fail';}
          })();
          </script></body></html>
          HTML

      - name: Start server
        run: |
          python3 -m http.server 8080 >server.log 2>&1 &
          sleep 2

      - name: Run benchmark
        env:
          CHROME: ${{ steps.browser.outputs.bin }}
        shell: bash
        run: |
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=60000 --dump-dom http://127.0.0.1:8080/performance-test.html > performance-dom.html 2>chrome-performance.log || true
          grep -q 'data-performance="pass"' performance-dom.html
          grep 'id="result"' performance-dom.html

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: large-matrix-performance
          path: |
            performance-dom.html
            chrome-performance.log
            server.log
