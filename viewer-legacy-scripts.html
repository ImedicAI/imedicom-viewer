  let activeTextCommit = null; // commit() del input de texto abierto actualmente, si hay uno

  function openTextInput(e, fx, fy, editingAnn){
    // Si ya habia un input de texto abierto (p.ej. el usuario no llego a
    // hacer clic en la imagen para confirmarlo), se confirma primero para
    // no perder lo que habia escrito.
    if (activeTextCommit) {
      const prevCommit = activeTextCommit;
      activeTextCommit = null;
      prevCommit();
    }
    const prevInput = document.getElementById('dv-text-input');
    if (prevInput) prevInput.remove();

    const wrapRect = viewerWrap.getBoundingClientRect();
    const left = e.clientX - wrapRect.left;
    const top = e.clientY - wrapRect.top;

    // Si se esta editando un texto existente, precarga sus valores en los
    // controles de la barra (color y negrita) y en el campo.
    if (editingAnn) {
      currentTextColor = editingAnn.color || '#3FD0C0';
      colorSwatch.style.background = currentTextColor;
      boldActive = !!editingAnn.bold;
      boldBtn.classList.toggle('dv-tool-active', boldActive);
      currentFontFamily = editingAnn.fontFamily || 'Arial, sans-serif';
      currentFontStyle = editingAnn.italic ? 'italic' : 'normal';
      document.querySelectorAll('.dv-font-option').forEach(b => {
        b.classList.toggle('dv-tool-active', b.dataset.font === currentFontStyle && b.dataset.family === currentFontFamily);
      });
    }

    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'dv-text-input';
    input.placeholder = 'Escribe aquí…';
    input.value = editingAnn ? editingAnn.text : '';
    input.style.left = left + 'px';
    input.style.top = top + 'px';
    input.style.color = currentTextColor;
    viewerWrap.appendChild(input);

    // Ya no hay boton "OK": el texto se confirma con un clic en cualquier
    // parte de la imagen (ver el listener en modo "captura" sobre
    // viewerWrap, mas abajo), o presionando Enter. Escape cancela.
    let committed = false;
    const commit = () => {
      if (committed) return;
      committed = true;
      activeTextCommit = null;
      const text = input.value.trim();
      if (text && state.activeIndex >= 0) {
        const f = state.files[state.activeIndex];
        f.annotations = f.annotations || [];
        pushUndo(f);
        const props = {
          framed: false,
          bold: boldActive,
          fontFamily: currentFontFamily,
          italic: currentFontStyle === 'italic',
          color: currentTextColor
        };
        if (editingAnn) {
          Object.assign(editingAnn, props, { text });
          delete editingAnn._editing;
        } else {
          f.annotations.push(Object.assign({ type: 'text', x: fx, y: fy }, props, { text }));
        }
        draw(f, 1);
      } else if (!text && editingAnn && state.activeIndex >= 0) {
        // si borraste todo el texto al editar, se elimina la anotacion
        const f = state.files[state.activeIndex];
        pushUndo(f);
        const idx = f.annotations.indexOf(editingAnn);
        if (idx >= 0) { f.annotations.splice(idx,1); draw(f,1); }
      }
      // La herramienta de texto se apaga sola despues de confirmar: antes
      // se quedaba "armada" y el siguiente clic en la imagen (aunque fuera
      // solo para cerrar el cuadro anterior) abria un cuadro nuevo sin
      // querer. Ahora hace falta volver a tocar el icono "T" para el
      // siguiente texto, como se pidio.
      if (currentTool === 'text') {
        currentTool = 'none';
        textBtn.classList.remove('dv-tool-active');
        canvas.style.cursor = 'default';
      }
      input.remove();
    };
    activeTextCommit = commit;
    input.addEventListener('keydown', (ev) => {
      ev.stopPropagation();
      if (ev.key === 'Enter') commit();
      if (ev.key === 'Escape') {
        committed = true;
        activeTextCommit = null;
        if (editingAnn) { delete editingAnn._editing; draw(state.files[state.activeIndex], 1); }
        if (currentTool === 'text') {
          currentTool = 'none';
          textBtn.classList.remove('dv-tool-active');
          canvas.style.cursor = 'default';
        }
        input.remove();
      }
    });
    setTimeout(() => { input.focus(); input.select(); }, 0);
  }

  // Confirma el texto en edicion con un clic en CUALQUIER parte de la
  // imagen (ya no hace falta un boton "OK"). Se usa fase de captura para
  // que esto se resuelva ANTES que el propio mousedown del canvas -- y se
  // detiene la propagacion del evento (stopPropagation) para que ese MISMO
  // clic no dispare TAMBIEN la accion normal del canvas (abrir un texto
  // nuevo si la herramienta de texto seguia activa, o colocar otro
  // marcador D/I/LD/LI si esa herramienta seguia activa: eran exactamente
  // los dos bugs reportados -- un texto nuevo se abria solo, o una letra
  // se duplicaba, en el mismo clic que se uso para cerrar/confirmar).
  viewerWrap.addEventListener('mousedown', (e) => {
    if (activeTextCommit && e.target.id !== 'dv-text-input') {
      e.stopPropagation();
      const commitFn = activeTextCommit;
      activeTextCommit = null;
      commitFn();
    }
  }, true);

  // ---- Deshacer / Rehacer (hasta 10 pasos cada uno) ----
  // Antes de CUALQUIER cambio en las anotaciones (crear, borrar, editar, mover)
  // se guarda una copia del estado anterior. Al hacer algo nuevo (no al deshacer/
  // rehacer) se limpia el historial de "rehacer", como es estandar.
  function pushUndo(f){
    f.undoStack = f.undoStack || [];
    f.undoStack.push(JSON.parse(JSON.stringify(f.annotations || [])));
    if (f.undoStack.length > 10) f.undoStack.shift();
    f.redoStack = [];
  }
  document.getElementById('dv-undo').addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    if (!f.undoStack || !f.undoStack.length) return;
    f.redoStack = f.redoStack || [];
    f.redoStack.push(JSON.parse(JSON.stringify(f.annotations || [])));
    if (f.redoStack.length > 10) f.redoStack.shift();
    f.annotations = f.undoStack.pop();
    draw(f, 1);
  });
  document.getElementById('dv-redo').addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    if (!f.redoStack || !f.redoStack.length) return;
    f.undoStack = f.undoStack || [];
    f.undoStack.push(JSON.parse(JSON.stringify(f.annotations || [])));
    if (f.undoStack.length > 10) f.undoStack.shift();
    f.annotations = f.redoStack.pop();
    draw(f, 1);
  });

  // ---- Arrastrar anotaciones de texto existentes ----
  let draggingAnn = null; // referencia a la anotacion que se esta moviendo
  let dragGrabOffset = { fx: 0, fy: 0 };

  function textAnnotationBounds(a){
    // Calcula el rectangulo (en pixeles del canvas visible) que ocupa una
    // anotacion de texto, usando la misma fuente/tamaño con que se dibuja.
    const w = canvas.width, h = canvas.height;
    const baseFontSize = w*0.022;
    const fontSize = a.big ? baseFontSize*1.6 : baseFontSize;
    const weight = a.bold ? 'bold ' : '';
    const style = a.italic ? 'italic ' : '';
    const family = a.fontFamily || 'Arial, sans-serif';
    const measureCtx = canvas.getContext('2d');
    measureCtx.font = style + weight + fontSize + 'px ' + family;
    const tw = measureCtx.measureText(a.text).width;
    const pad = fontSize*0.35;
    const x = a.x*w, y = a.y*h;
    return { x: x-pad, y: y-pad, w: tw+pad*2, h: fontSize*1.25+pad*2 };
  }

  function hitTestText(mx, my){
    const f = state.files[state.activeIndex];
    if (!f || !f.annotations) return -1;
    for (let i=f.annotations.length-1; i>=0; i--){
      const a = f.annotations[i];
      if (a.type !== 'text') continue;
      const b = textAnnotationBounds(a);
      const grow = b.h*0.25; // un poco de margen extra para que sea facil "agarrarlo"
      if (mx >= b.x-grow && mx <= b.x+b.w+grow && my >= b.y-grow && my <= b.y+b.h+grow) return i;
    }
    return -1;
  }

  function distToSegment(px, py, x1, y1, x2, y2){
    const dx = x2-x1, dy = y2-y1;
    const lenSq = dx*dx + dy*dy;
    let t = lenSq === 0 ? 0 : ((px-x1)*dx + (py-y1)*dy) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t*dx, cy = y1 + t*dy;
    return Math.hypot(px-cx, py-cy);
  }

  function hitTestAnnotation(mx, my){
    // Devuelve el indice de la anotacion (texto o flecha) bajo el punto dado.
    const f = state.files[state.activeIndex];
    if (!f || !f.annotations) return -1;
    const textIdx = hitTestText(mx, my);
    if (textIdx >= 0) return textIdx;
    const w = canvas.width, h = canvas.height;
    for (let i=f.annotations.length-1; i>=0; i--){
      const a = f.annotations[i];
      if (a.type !== 'arrow') continue;
      const d = distToSegment(mx, my, a.x1*w, a.y1*h, a.x2*w, a.y2*h);
      if (d < Math.max(10, w*0.012)) return i;
    }
    return -1;
  }

  // Detecta si el punto cae sobre el ORIGEN, la PUNTA, o el CUERPO de una
  // flecha existente, para poder arrastrar cada parte por separado (redirigir
  // la punta, mover el origen, o desplazar la flecha entera).
  function hitTestArrowHandle(mx, my){
    const f = state.files[state.activeIndex];
    if (!f || !f.annotations) return null;
    const w = canvas.width, h = canvas.height;
    const handleR = Math.max(10, w*0.014);
    for (let i=f.annotations.length-1; i>=0; i--){
      const a = f.annotations[i];
      if (a.type !== 'arrow') continue;
      const x1=a.x1*w, y1=a.y1*h, x2=a.x2*w, y2=a.y2*h;
      if (Math.hypot(mx-x2, my-y2) < handleR) return { ann: a, mode: 'end' };
      if (Math.hypot(mx-x1, my-y1) < handleR) return { ann: a, mode: 'start' };
      if (distToSegment(mx, my, x1, y1, x2, y2) < Math.max(8, w*0.01)) return { ann: a, mode: 'whole' };
    }
    return null;
  }

  // Clic derecho sobre una flecha o texto = borrarlo individualmente (sin
  // afectar las demas anotaciones), en vez de tener que borrar todo de una vez.
  // Doble clic sobre un texto existente = editarlo (precarga el texto y sus
  // estilos actuales en el mismo campo flotante).
  canvas.addEventListener('dblclick', (e) => {
    if (state.activeIndex < 0) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX-rect.left)*(canvas.width/rect.width);
    const my = (e.clientY-rect.top)*(canvas.height/rect.height);
    const idx = hitTestText(mx, my);
    if (idx >= 0) {
      const f = state.files[state.activeIndex];
      const a = f.annotations[idx];
      a._editing = true; // se oculta mientras se edita, para no superponerse con el input
      draw(f, 1);
      openTextInput(e, a.x, a.y, a);
      return;
    }
    const arrowHit = hitTestArrowHandle(mx, my);
    if (arrowHit) {
      openColorPicker(e, arrowHit.ann);
      return;
    }
    // Doble clic sobre una zona VACIA (sin texto ni flecha debajo) y sin
    // herramienta de dibujo activa = volver a 100% de zoom, para no tener
    // que devolver la ruedita del mouse manualmente hasta el tamano
    // original. No hace nada si el doble clic cayo sobre una anotacion
    // (ya se maneja arriba) o si hay una herramienta de dibujo activa.
    if (currentTool === 'none' && zoomLevel !== 1) {
      zoomLevel = 1;
      applyZoom();
      viewerWrap.scrollLeft = 0;
      viewerWrap.scrollTop = 0;
    }
  });

  // Mini selector de color flotante (para cambiar el color de una flecha ya
  // dibujada, sin tener que borrarla y rehacerla).
  function openColorPicker(e, ann){
    const prev = document.getElementById('dv-color-picker');
    if (prev) prev.remove();
    const wrapRect = viewerWrap.getBoundingClientRect();
    const box = document.createElement('div');
    box.id = 'dv-color-picker';
    box.style.position = 'absolute';
    box.style.left = (e.clientX - wrapRect.left) + 'px';
    box.style.top = (e.clientY - wrapRect.top) + 'px';
    box.style.zIndex = '22';
    box.style.display = 'flex';
    box.style.gap = '4px';
    box.style.background = '#0D1218';
    box.style.border = '1.5px solid var(--accent)';
    box.style.borderRadius = '4px';
    box.style.padding = '5px';
    const colors = ['#111111','#FFFFFF','#FF3B30','#FFEE00','#3FD0C0'];
    colors.forEach(c => {
      const sw = document.createElement('button');
      sw.style.width = '18px'; sw.style.height = '18px';
      sw.style.borderRadius = '3px';
      sw.style.border = '1px solid #444';
      sw.style.background = c;
      sw.style.cursor = 'pointer';
      sw.addEventListener('mousedown', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        const f = state.files[state.activeIndex];
        pushUndo(f);
        ann.color = c;
        draw(f, 1);
        box.remove();
      });
      box.appendChild(sw);
    });
    viewerWrap.appendChild(box);
    setTimeout(() => {
      document.addEventListener('mousedown', function onOutside(ev){
        if (!box.contains(ev.target)) { box.remove(); document.removeEventListener('mousedown', onOutside); }
      });
    }, 0);
  }

  canvas.addEventListener('contextmenu', (e) => {
    if (state.activeIndex < 0) return;
    e.preventDefault();
    if (suppressNextContextDelete) { suppressNextContextDelete = false; return; }
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX-rect.left)*(canvas.width/rect.width);
    const my = (e.clientY-rect.top)*(canvas.height/rect.height);
    const idx = hitTestAnnotation(mx, my);
    if (idx >= 0) {
      const f = state.files[state.activeIndex];
      pushUndo(f);
      f.annotations.splice(idx, 1);
      draw(f, 1);
    }
  });

  let draggingArrow = null; // { ann, mode: 'start'|'end'|'whole', offset1, offset2 }

  canvas.addEventListener('mousemove', (e) => {
    if (state.activeIndex < 0) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX-rect.left)*(canvas.width/rect.width);
    const my = (e.clientY-rect.top)*(canvas.height/rect.height);
    const fx = mx/canvas.width, fy = my/canvas.height;

    if (draggingAnn) {
      draggingAnn.x = fx - dragGrabOffset.fx;
      draggingAnn.y = fy - dragGrabOffset.fy;
      draw(state.files[state.activeIndex], 1, true);
      return;
    }
    if (draggingArrow) {
      const { ann, mode } = draggingArrow;
      if (mode === 'end') { ann.x2 = fx; ann.y2 = fy; }
      else if (mode === 'start') { ann.x1 = fx; ann.y1 = fy; }
      else if (mode === 'whole') {
        ann.x1 = fx + draggingArrow.offset1.dx; ann.y1 = fy + draggingArrow.offset1.dy;
        ann.x2 = fx + draggingArrow.offset2.dx; ann.y2 = fy + draggingArrow.offset2.dy;
      }
      draw(state.files[state.activeIndex], 1, true);
      return;
    }
    if ((currentTool === 'arrow' || currentTool === 'length') && dragStart) {
      // Vista previa en vivo mientras se arrastra: antes la flecha/regla
      // recien aparecia al soltar el mouse, sin ningun indicio del trazo
      // mientras se iba extendiendo. Se redibuja la base (sin recalcular
      // layout, igual que al arrastrar anotaciones) y se traza encima una
      // linea temporal que seguira siendo reemplazada por la anotacion
      // definitiva al soltar el clic.
      const f = state.files[state.activeIndex];
      draw(f, 1, true);
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const x1 = dragStart.fx*w, y1 = dragStart.fy*h, x2 = fx*w, y2 = fy*h;
      ctx.save();
      if (currentTool === 'length') {
        // Estilo identico al de la anotacion final (rojo fijo, mas fina)
        // para que no "salte" de color/grosor justo al soltar el clic.
        ctx.strokeStyle = '#FF3B30';
        ctx.fillStyle = '#FF3B30';
        ctx.lineWidth = Math.max(2, w*0.0035) * 0.7;
      } else {
        ctx.strokeStyle = currentTextColor;
        ctx.fillStyle = currentTextColor;
        ctx.lineWidth = Math.max(2, w*0.0035);
      }
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      if (currentTool === 'arrow') {
        const angle = Math.atan2(y2-y1, x2-x1);
        const headLen = w*0.022;
        ctx.beginPath();
        ctx.moveTo(x2,y2);
        ctx.lineTo(x2 - headLen*Math.cos(angle-Math.PI/6), y2 - headLen*Math.sin(angle-Math.PI/6));
        ctx.lineTo(x2 - headLen*Math.cos(angle+Math.PI/6), y2 - headLen*Math.sin(angle+Math.PI/6));
        ctx.closePath();
        ctx.fill();
      } else {
        const ang = Math.atan2(y2-y1, x2-x1);
        const tick = w*0.006;
        ctx.lineWidth = Math.max(1, ctx.lineWidth*0.55);
        [[x1,y1],[x2,y2]].forEach(([px,py]) => {
          ctx.beginPath();
          ctx.moveTo(px + tick*Math.cos(ang+Math.PI/2), py + tick*Math.sin(ang+Math.PI/2));
          ctx.lineTo(px - tick*Math.cos(ang+Math.PI/2), py - tick*Math.sin(ang+Math.PI/2));
          ctx.stroke();
        });
        // Lectura en vivo de la distancia mientras se arrastra, igual
        // que quedara al soltar -- asi el usuario ve el numero crecer/
        // achicarse en tiempo real, no solo al terminar el trazo.
        const distPix = Math.hypot(x2-x1, y2-y1);
        const mmPerPixel = f.pixel && f.pixel.mmPerPixel;
        const liveLabel = (mmPerPixel && !isNaN(mmPerPixel))
          ? (distPix*mmPerPixel/10).toFixed(2) + ' cm'
          : Math.round(distPix) + ' px';
        const liveFontSize = w*0.022*0.85;
        ctx.font = liveFontSize + 'px "IBM Plex Mono", monospace';
        ctx.textAlign = (x2 >= x1) ? 'left' : 'right';
        ctx.textBaseline = 'middle';
        const labelOffset = w*0.014 * (x2 >= x1 ? 1 : -1);
        ctx.lineWidth = 3; ctx.strokeStyle = '#000';
        ctx.strokeText(liveLabel, x2 + labelOffset, y2);
        ctx.fillStyle = '#FF3B30';
        ctx.fillText(liveLabel, x2 + labelOffset, y2);
      }
      ctx.restore();
      return;
    }
    if (currentTool === 'angle' && pendingPoints.length > 0 && pendingPoints.length < 3) {
      // Vista previa dinamica mientras se arma el angulo:
      // - Tras el 1er clic (punto A): se ve la extension de la linea hacia
      //   el cursor, todavia sin vertice definido.
      // - Tras el 2do clic (vertice): se ve el segundo rayo formandose
      //   desde el vertice hacia el cursor, con los grados en vivo entre
      //   ambos rayos, actualizandose en cada movimiento del mouse.
      const f = state.files[state.activeIndex];
      draw(f, 1, true);
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.save();
      ctx.strokeStyle = currentTextColor;
      ctx.fillStyle = currentTextColor;
      ctx.lineWidth = Math.max(1.5, w*0.0022);
      ctx.setLineDash([w*0.006, w*0.005]); // punteada = todavia no confirmada
      if (pendingPoints.length === 1) {
        const p0 = pendingPoints[0];
        ctx.beginPath();
        ctx.moveTo(p0.fx*w, p0.fy*h);
        ctx.lineTo(mx, my);
        ctx.stroke();
      } else {
        const p0 = pendingPoints[0], vertex = pendingPoints[1];
        ctx.beginPath();
        ctx.moveTo(vertex.fx*w, vertex.fy*h);
        ctx.lineTo(mx, my);
        ctx.stroke();
        ctx.setLineDash([]);
        const liveAngle = angleAtVertex(vertex, p0, { fx, fy }, w, h);
        const fontSize = w*0.022;
        ctx.font = fontSize*0.9 + 'px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const label = liveAngle.toFixed(1) + '°';
        const vx = vertex.fx*w, vy = vertex.fy*h;
        const ax = p0.fx*w, ay = p0.fy*h;
        const labelPos = angleBisectorLabelPos(vx, vy, ax, ay, mx, my, w);
        ctx.lineWidth = 3; ctx.strokeStyle = '#000';
        ctx.strokeText(label, labelPos.x, labelPos.y);
        ctx.fillStyle = currentTextColor;
        ctx.fillText(label, labelPos.x, labelPos.y);
      }
      ctx.restore();
      drawPendingPoints();
      return;
    }
    const hitIdx = hitTestText(mx, my);
    if (hitIdx >= 0) {
      canvas.style.cursor = 'move';
      return;
    }
    const arrowHit = hitTestArrowHandle(mx, my);
    if (arrowHit) {
      canvas.style.cursor = arrowHit.mode === 'whole' ? 'move' : 'crosshair';
      return;
    }
    // Ventaneo con clic izquierdo SOSTENIDO (clasico: se presiona, se
    // arrastra, se suelta) cuando hay zoom aplicado -- ver el mousedown
    // mas abajo, que decide si el gesto es un CLIC (activa/desactiva el
    // modo interactivo) o un ARRASTRE (ventanea) segun si hay movimiento.
    if (leftWindowDrag) {
      const dx = e.clientX - leftWindowDrag.startX, dy = e.clientY - leftWindowDrag.startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) leftWindowDrag.moved = true;
      if (leftWindowDrag.moved && state.activeIndex >= 0) {
        const f = state.files[state.activeIndex];
        const p = f.pixel;
        if (p) {
          const sensitivity = Math.max(p.origWindowWidth || p.windowWidth, 10) / 300;
          p.windowWidth = Math.max(1, leftWindowDrag.startWidth + dx * sensitivity);
          p.windowCenter = leftWindowDrag.startCenter - dy * sensitivity;
          wlSlider.value = Math.round(p.windowCenter);
          wwSlider.value = Math.round(p.windowWidth);
          wlVal.textContent = Math.round(p.windowCenter);
          wwVal.textContent = Math.round(p.windowWidth);
          updateLiveReadout(p);
          draw(f, 1, true);
        }
      }
      canvas.style.cursor = 'ns-resize';
      return;
    }
    canvas.style.cursor = currentTool === 'none' ? 'default' : 'crosshair';
  });

  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 2) return; // el clic derecho lo maneja el pan/borrado, no esto
    if (state.activeIndex < 0) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX-rect.left)*(canvas.width/rect.width);
    const my = (e.clientY-rect.top)*(canvas.height/rect.height);
    const hitIdx = hitTestText(mx, my);
    if (hitIdx >= 0) {
      // Prioridad: si el clic cae sobre un texto existente, se arrastra en vez
      // de crear una anotacion nueva, sin importar la herramienta activa.
      const f = state.files[state.activeIndex];
      pushUndo(f); // se guarda ANTES de mover, para poder deshacer el arrastre
      const a = f.annotations[hitIdx];
      draggingAnn = a;
      dragGrabOffset = { fx: (mx/canvas.width) - a.x, fy: (my/canvas.height) - a.y };
      return;
    }
    const arrowHit = hitTestArrowHandle(mx, my);
    if (arrowHit) {
      // Prioridad tambien sobre flechas existentes: redirigir la punta, mover
      // el origen, o desplazar toda la flecha, sin importar la herramienta activa.
      const f = state.files[state.activeIndex];
      pushUndo(f);
      const fx = mx/canvas.width, fy = my/canvas.height;
      draggingArrow = { ann: arrowHit.ann, mode: arrowHit.mode };
      if (arrowHit.mode === 'whole') {
        draggingArrow.offset1 = { dx: arrowHit.ann.x1 - fx, dy: arrowHit.ann.y1 - fy };
        draggingArrow.offset2 = { dx: arrowHit.ann.x2 - fx, dy: arrowHit.ann.y2 - fy };
      }
      return;
    }
    if (currentTool === 'none') {
      // Un clic SIN arrastre enciende/apaga el modo interactivo (zoom con
      // rueda) -- se registra el punto de partida para distinguirlo de un
      // arrastre en el mouseup. Si ademas hay zoom aplicado, se prepara
      // TAMBIEN un posible ventaneo por arrastre (clic sostenido): si el
      // mouse se mueve mas de un umbral antes de soltar, el gesto se
      // interpreta como ventaneo (no como el interruptor de arriba).
      pendingToggleStart = { x: e.clientX, y: e.clientY };
      if (zoomLevel > 1 && state.activeIndex >= 0 && state.files[state.activeIndex].pixel) {
        const f = state.files[state.activeIndex];
        leftWindowDrag = {
          startX: e.clientX, startY: e.clientY,
          startCenter: f.pixel.windowCenter, startWidth: f.pixel.windowWidth,
          moved: false
        };
        updateLiveReadout(f.pixel);
      }
      return;
    }
    const { fx, fy } = canvasFraction(e);
    if (currentTool === 'arrow') {
      dragStart = { fx, fy };
    } else if (currentTool === 'length') {
      dragStart = { fx, fy };
    } else if (currentTool === 'angle' || currentTool === 'cobb') {
      pendingPoints.push({ fx, fy });
      const needed = currentTool === 'angle' ? 3 : 4;
      const f = state.files[state.activeIndex];
      if (pendingPoints.length >= needed) {
        f.annotations = f.annotations || [];
        pushUndo(f);
        if (currentTool === 'angle') {
          // Orden de clics tal como lo usa el usuario: 1) punto A (primer
          // rayo) 2) vertice del angulo 3) punto B (segundo rayo). El
          // objeto guardado sigue usando las claves vertex/a/b como antes,
          // solo cambia que ordenPoints[1] (el segundo clic) es el vertice.
          f.annotations.push({ type: 'angle', a: pendingPoints[0], vertex: pendingPoints[1], b: pendingPoints[2], color: currentTextColor });
        } else {
          f.annotations.push({ type: 'cobb', p1: pendingPoints[0], p2: pendingPoints[1], p3: pendingPoints[2], p4: pendingPoints[3], color: currentTextColor });
        }
        pendingPoints = [];
      }
      draw(f, 1);
      drawPendingPoints();
    } else if (currentTool === 'text') {
      openTextInput(e, fx, fy);
    } else if (currentTool === 'marker' && activeMarker) {
      const f = state.files[state.activeIndex];
      f.annotations = f.annotations || [];
      pushUndo(f);
      f.annotations.push({
        type: 'text', x: fx, y: fy, text: activeMarker,
        bold: true, big: true, thick: true,
        fontFamily: '"IBM Plex Mono", monospace',
        color: currentTextColor
      });
      draw(f, 1);
    }
  });
  canvas.addEventListener('mouseup', (e) => {
    if (draggingAnn) { draggingAnn = null; return; }
    if (draggingArrow) { draggingArrow = null; return; }
    if (pendingToggleStart) {
      const dx = e.clientX - pendingToggleStart.x, dy = e.clientY - pendingToggleStart.y;
      pendingToggleStart = null;
      const wasWindowing = !!(leftWindowDrag && leftWindowDrag.moved);
      leftWindowDrag = null;
      // Solo un CLIC (sin arrastre, y sin que se haya ventaneado) alterna
      // el modo interactivo. Si hubo arrastre y se ventaneo, el gesto ya
      // cumplio su proposito (ajustar WL/WW) y no debe ademas apagar/
      // encender el zoom con rueda.
      if (!wasWindowing && Math.abs(dx) < 4 && Math.abs(dy) < 4) {
        setInteractionActive(!interactionActive);
      }
      return;
    }
    if (currentTool === 'arrow' && dragStart && state.activeIndex >= 0) {
      const { fx, fy } = canvasFraction(e);
      const f = state.files[state.activeIndex];
      f.annotations = f.annotations || [];
      // evita crear flechas de largo cero por un simple clic sin arrastre
      if (Math.abs(fx-dragStart.fx) > 0.005 || Math.abs(fy-dragStart.fy) > 0.005) {
        pushUndo(f);
        f.annotations.push({ type: 'arrow', x1: dragStart.fx, y1: dragStart.fy, x2: fx, y2: fy, color: currentTextColor });
        draw(f, 1);
      }
      dragStart = null;
    } else if (currentTool === 'length' && dragStart && state.activeIndex >= 0) {
      const { fx, fy } = canvasFraction(e);
      const f = state.files[state.activeIndex];
      f.annotations = f.annotations || [];
      if (Math.abs(fx-dragStart.fx) > 0.005 || Math.abs(fy-dragStart.fy) > 0.005) {
        pushUndo(f);
        f.annotations.push({ type: 'length', x1: dragStart.fx, y1: dragStart.fy, x2: fx, y2: fy, color: currentTextColor });
        draw(f, 1);
      }
      dragStart = null;
    }
  });

  // Dibuja puntitos temporales (sin persistir en f.annotations) mientras se
  // completa una herramienta de clics multiples (Angulo/Cobb), para que el
  // usuario vea donde ya hizo clic antes de terminar la medicion.
  function drawPendingPoints(){
    if (!pendingPoints.length) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    ctx.save();
    ctx.fillStyle = currentTextColor;
    ctx.strokeStyle = currentTextColor;
    ctx.lineWidth = Math.max(1.5, w*0.0018);
    pendingPoints.forEach((p, i) => {
      const x = p.fx*w, y = p.fy*h;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(4, w*0.004), 0, Math.PI*2);
      ctx.fill();
      if (i > 0 && (currentTool === 'cobb' ? (i===1 || i===3) : true)) {
        const prev = pendingPoints[i-1];
        // Para Cobb, solo se conecta el punto 1-2 y 3-4 (2 lineas
        // independientes, no una polilinea continua entre todos los puntos).
        if (currentTool !== 'cobb' || i === 1 || i === 3) {
          ctx.beginPath();
          ctx.moveTo(prev.fx*w, prev.fy*h);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
      }
    });
    ctx.restore();
  }

  // Angulo (en grados) en el vertice, entre los rayos vertice->a y vertice->b.
  // Convierte de fraccion (0-1) a pixeles reales (w,h) antes de calcular,
  // para que el angulo sea correcto incluso si el canvas no es cuadrado.
  function angleAtVertex(vertex, a, b, w, h){
    const v1 = { x: (a.fx-vertex.fx)*w, y: (a.fy-vertex.fy)*h };
    const v2 = { x: (b.fx-vertex.fx)*w, y: (b.fy-vertex.fy)*h };
    const dot = v1.x*v2.x + v1.y*v2.y;
    const mag1 = Math.hypot(v1.x,v1.y), mag2 = Math.hypot(v2.x,v2.y);
    if (mag1===0 || mag2===0) return 0;
    const cos = Math.max(-1, Math.min(1, dot/(mag1*mag2)));
    return Math.acos(cos) * 180/Math.PI;
  }

  // Calcula donde poner la etiqueta de grados: sobre la bisectriz del
  // angulo (la direccion "a medio camino" entre los dos rayos), a una
  // distancia fija del vertice. Asi la etiqueta siempre cae en el espacio
  // libre DENTRO del angulo, sin importar si este se abre hacia arriba,
  // abajo, o a un costado -- con un offset fijo (ej. siempre arriba-
  // derecha) la etiqueta terminaba cruzando uno de los rayos cuando el
  // angulo apuntaba en cierta direccion.
  function angleBisectorLabelPos(vx, vy, ax, ay, bx, by, w){
    const v1x = ax-vx, v1y = ay-vy, v1mag = Math.hypot(v1x,v1y) || 1;
    const v2x = bx-vx, v2y = by-vy, v2mag = Math.hypot(v2x,v2y) || 1;
    let bisX = v1x/v1mag + v2x/v2mag, bisY = v1y/v1mag + v2y/v2mag;
    let bisMag = Math.hypot(bisX, bisY);
    if (bisMag < 0.0001) {
      // Los dos rayos son casi opuestos (angulo ~180 grados) -- no hay
      // bisectriz clara, se usa la perpendicular del primer rayo como
      // direccion de respaldo.
      bisX = -v1y/v1mag; bisY = v1x/v1mag; bisMag = 1;
    }
    const dist = w*0.045;
    return { x: vx + (bisX/bisMag)*dist, y: vy + (bisY/bisMag)*dist };
  }

  // Angulo de Cobb: angulo AGUDO entre dos lineas independientes (no
  // comparten vertice), tal como se mide clinicamente entre el platillo
  // superior de la vertebra mas inclinada y el platillo inferior de la otra.
  // Se toma el angulo agudo (<=90) entre las dos rectas, sin importar en que
  // direccion se hizo cada clic.
  function cobbAngleBetweenLines(p1, p2, p3, p4, w, h){
    const v1 = { x: (p2.fx-p1.fx)*w, y: (p2.fy-p1.fy)*h };
    const v2 = { x: (p4.fx-p3.fx)*w, y: (p4.fy-p3.fy)*h };
    const dot = v1.x*v2.x + v1.y*v2.y;
    const mag1 = Math.hypot(v1.x,v1.y), mag2 = Math.hypot(v2.x,v2.y);
    if (mag1===0 || mag2===0) return 0;
    const cos = Math.max(-1, Math.min(1, dot/(mag1*mag2)));
    let deg = Math.acos(cos) * 180/Math.PI;
    if (deg > 90) deg = 180 - deg;
    return deg;
  }

  document.getElementById('dv-clear-annotations').addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    pushUndo(f);
    f.annotations = [];
    draw(f, 1);
  });

  // Dibuja las anotaciones (flechas y textos) sobre el canvas ya renderizado.
  // Las coordenadas se guardan como fraccion (0-1) del canvas, para que escalen
  // correctamente sin importar la resolucion de exportacion.
  function drawAnnotations(ctx, f){
    const list = f.annotations || [];
    if (!list.length) return;
    const w = ctx.canvas.width, h = ctx.canvas.height;
    const lineW = Math.max(2, w*0.0035);
    const fontSize = w*0.022;
    list.forEach(a => {
      if (a._editing) return; // oculto mientras se edita en el campo flotante
      if (a.type === 'arrow') {
        const x1=a.x1*w, y1=a.y1*h, x2=a.x2*w, y2=a.y2*h;
        const color = a.color || '#FF3B30';
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = lineW;
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        const angle = Math.atan2(y2-y1, x2-x1);
        const headLen = w*0.022;
        ctx.beginPath();
        ctx.moveTo(x2,y2);
        ctx.lineTo(x2 - headLen*Math.cos(angle-Math.PI/6), y2 - headLen*Math.sin(angle-Math.PI/6));
        ctx.lineTo(x2 - headLen*Math.cos(angle+Math.PI/6), y2 - headLen*Math.sin(angle+Math.PI/6));
        ctx.closePath();
        ctx.fill();
      } else if (a.type === 'length') {
        const x1=a.x1*w, y1=a.y1*h, x2=a.x2*w, y2=a.y2*h;
        // Color fijo en rojo (no usa el selector de color T/N/color del
        // panel) -- una medicion debe destacar siempre igual, sin depender
        // de que color estaba activo al momento de trazarla.
        const color = '#FF3B30';
        const measureLineW = lineW * 0.7; // 30% mas fina que el resto de anotaciones
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = measureLineW;
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        // Marcas perpendiculares en los extremos (como una regla). Se dibujan
        // mas finas y cortas que la linea principal -- un tope grueso del
        // mismo ancho que la linea se ve pesado/tosco; el estandar de
        // referencia (RadiAnt) usa una crucecita liviana apenas visible.
        const ang = Math.atan2(y2-y1, x2-x1);
        const tick = w*0.006;
        ctx.lineWidth = Math.max(1, measureLineW*0.55);
        [[x1,y1],[x2,y2]].forEach(([px,py]) => {
          ctx.beginPath();
          ctx.moveTo(px + tick*Math.cos(ang+Math.PI/2), py + tick*Math.sin(ang+Math.PI/2));
          ctx.lineTo(px - tick*Math.cos(ang+Math.PI/2), py - tick*Math.sin(ang+Math.PI/2));
          ctx.stroke();
        });
        ctx.lineWidth = measureLineW;
        const dxPix = (a.x2-a.x1)*w, dyPix = (a.y2-a.y1)*h;
        const distPix = Math.hypot(dxPix, dyPix);
        const mmPerPixel = f.pixel && f.pixel.mmPerPixel;
        const label = (mmPerPixel && !isNaN(mmPerPixel))
          ? (distPix*mmPerPixel/10).toFixed(2) + ' cm'
          : Math.round(distPix) + ' px';
        // La etiqueta se ancla al extremo final (x2,y2) en vez del punto
        // medio de la linea -- con varias mediciones cruzandose, los
        // numeros centrados terminan superpuestos unos sobre otros; en el
        // extremo cada uno tiene mas espacio propio para no chocar.
        ctx.font = fontSize*0.85 + 'px "IBM Plex Mono", monospace';
        ctx.textAlign = (x2 >= x1) ? 'left' : 'right';
        ctx.textBaseline = 'middle';
        const labelOffset = w*0.014 * (x2 >= x1 ? 1 : -1);
        const labelX = x2 + labelOffset, labelY = y2;
        ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
        ctx.strokeText(label, labelX, labelY);
        ctx.fillStyle = color;
        ctx.fillText(label, labelX, labelY);
      } else if (a.type === 'angle') {
        const color = a.color || '#FF3B30';
        const vx=a.vertex.fx*w, vy=a.vertex.fy*h;
        const ax=a.a.fx*w, ay=a.a.fy*h;
        const bx=a.b.fx*w, by=a.b.fy*h;
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lineW;
        ctx.beginPath(); ctx.moveTo(vx,vy); ctx.lineTo(ax,ay); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(vx,vy); ctx.lineTo(bx,by); ctx.stroke();
        const angleDeg = angleAtVertex(a.vertex, a.a, a.b, w, h);
        // La etiqueta se coloca sobre la BISECTRIZ del angulo (a medio camino
        // entre los dos rayos), no en un offset fijo hacia arriba-derecha --
        // con un offset fijo, cuando el angulo se abre hacia arriba (vertice
        // abajo) la etiqueta terminaba cayendo justo encima de uno de los
        // rayos. La bisectriz garantiza que quede siempre en el espacio
        // libre "adentro" del angulo, sin cruzar ninguna linea.
        const labelPos = angleBisectorLabelPos(vx, vy, ax, ay, bx, by, w);
        ctx.font = fontSize*0.85 + 'px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const label = angleDeg.toFixed(1) + '°';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
        ctx.strokeText(label, labelPos.x, labelPos.y);
        ctx.fillStyle = color;
        ctx.fillText(label, labelPos.x, labelPos.y);
      } else if (a.type === 'cobb') {
        const color = a.color || '#FF3B30';
        const p1={x:a.p1.fx*w,y:a.p1.fy*h}, p2={x:a.p2.fx*w,y:a.p2.fy*h};
        const p3={x:a.p3.fx*w,y:a.p3.fy*h}, p4={x:a.p4.fx*w,y:a.p4.fy*h};
        ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lineW;
        ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y); ctx.stroke();
        const cobbDeg = cobbAngleBetweenLines(a.p1,a.p2,a.p3,a.p4,w,h);
        const label = 'Cobb: ' + cobbDeg.toFixed(1) + '°';
        const labelX = (p1.x+p2.x+p3.x+p4.x)/4, labelY = (p1.y+p2.y+p3.y+p4.y)/4;
        ctx.font = fontSize*0.9 + 'px "IBM Plex Mono", monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
        ctx.strokeText(label, labelX, labelY);
        ctx.fillStyle = color;
        ctx.fillText(label, labelX, labelY);
      } else if (a.type === 'text') {
        const weight = a.bold ? 'bold ' : '';
        const style = a.italic ? 'italic ' : '';
        const family = a.fontFamily || 'Arial, sans-serif';
        const color = a.color || '#FF3B30';
        const thisFontSize = a.big ? fontSize*1.6 : fontSize;
        ctx.font = style + weight + thisFontSize + 'px ' + family;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillStyle = color;
        const x=a.x*w, y=a.y*h;
        if (a.framed) {
          const metrics = ctx.measureText(a.text);
          const pad = thisFontSize*0.35;
          ctx.strokeStyle = color;
          ctx.lineWidth = Math.max(1.5, w*0.0018);
          ctx.strokeRect(x-pad, y-pad, metrics.width+pad*2, thisFontSize*1.25+pad*2);
        }
        if (a.thick) {
          // trazo grueso real (no solo negrita fina): se re-dibuja el contorno
          // del texto con el mismo color para engrosarlo visiblemente.
          ctx.lineWidth = thisFontSize*0.06;
          ctx.strokeStyle = color;
          ctx.strokeText(a.text, x, y);
        }
        ctx.fillText(a.text, x, y);
      }
    });
  }

  function updateMetaPanel(f){
    const m = f.meta;
    metaEl.innerHTML = '';
    // Los campos siguen siendo editables (por si el equipo grabo mal un dato
    // o hay un error de tipeo). Los que se graban sobre la imagen exportada
    // (nombre, ID, fecha nacimiento, fecha/hora de estudio, institucion) se
    // actualizan en vivo tambien en la exportacion al editarlos aqui.
    //
    // Paciente queda en su propia fila completa (nombre puede ser largo).
    // El resto se compacta: ID y F.N con el label DENTRO del mismo
    // cuadrante; Modalidad/Vista/Estudio comparten un cuadrante en 3
    // segmentos; Fecha estudio (F.E) e Institucion comparten uno en 2.
    let compactIdx = 0;
    function makeCompactField(label, key, value, placeholder, flexGrow){
      compactIdx++;
      const field = document.createElement('div');
      field.className = 'dv-meta-compact-field';
      if (flexGrow !== undefined) field.style.flex = flexGrow + ' 1 0';
      field.innerHTML = '<span class="dv-meta-compact-field-label">'+label+'</span>' +
        '<input type="text" value="'+(value||'').replace(/"/g,'&quot;')+'"' +
        (placeholder ? ' placeholder="'+placeholder+'"' : '') + '>';
      const inputEl = field.querySelector('input');
      inputEl.addEventListener('input', (e) => {
        m[key] = e.target.value;
        draw(f, 1);
      });
      return field;
    }
    // Paciente: fila completa, label arriba (nombre puede ser largo)
    const pacienteRow = document.createElement('div');
    pacienteRow.className = 'dv-meta-row';
    pacienteRow.innerHTML = '<div class="dv-meta-label">Paciente</div>' +
      '<div class="dv-meta-value"><input type="text" id="dv-meta-paciente" value="'+(m.patientName||'').replace(/"/g,'&quot;')+'"></div>';
    metaEl.appendChild(pacienteRow);
    document.getElementById('dv-meta-paciente').addEventListener('input', (e) => {
      m.patientName = e.target.value;
      draw(f, 1);
    });

    // ID / F.N (fecha nacimiento): un solo cuadrante, 2 segmentos
    const idFnRow = document.createElement('div');
    idFnRow.className = 'dv-meta-compact-row';
    idFnRow.appendChild(makeCompactField('ID', 'patientId', m.patientId));
    idFnRow.appendChild(makeCompactField('F.N', 'birthDate', m.birthDate));
    metaEl.appendChild(idFnRow);

    // F.E (fecha estudio) / Estudio: un cuadrante, 2 segmentos (antes aca
    // estaban Modalidad y Vista; se intercambiaron de fila con F.E).
    const feEstRow = document.createElement('div');
    feEstRow.className = 'dv-meta-compact-row';
    feEstRow.appendChild(makeCompactField('F.E', 'studyDateTimeDisplay', m.studyDateTimeDisplay));
    feEstRow.appendChild(makeCompactField('ESTUDIO', 'studyDesc', m.studyDesc));
    metaEl.appendChild(feEstRow);

    // Modalidad / Vista / Institucion: un cuadrante, 3 segmentos (antes
    // aca estaba F.E, que se movio arriba junto con Estudio).
    const modVistaInstRow = document.createElement('div');
    modVistaInstRow.className = 'dv-meta-compact-row';
    modVistaInstRow.appendChild(makeCompactField('MOD', 'modality', m.modality, null, 0.6));
    modVistaInstRow.appendChild(makeCompactField('VISTA', 'viewPosition', m.viewPosition, null, 0.6));
    modVistaInstRow.appendChild(makeCompactField('INST', 'institution', m.institution, 'Sin institución', 1.8));
    metaEl.appendChild(modVistaInstRow);

    if (!m.isFrontal) {
      const side = m.convexitySide;
      const txt = side === 'left' ? 'Izquierda — bloque arriba-izquierda' :
                  side === 'right' ? 'Derecha — bloque arriba-derecha' :
                  'No se pudo determinar — overlay omitido';
      const row = document.createElement('div');
      row.className = 'dv-meta-row';
      row.innerHTML = '<div class="dv-meta-label">Convexidad detectada</div><div class="dv-meta-value">'+txt+'</div>';
      metaEl.appendChild(row);
    }
    wlVal.textContent = Math.round(f.pixel.windowCenter);
    wwVal.textContent = Math.round(f.pixel.windowWidth);
  }

  // La imagen "base" (windowing + rotacion + espejo ya aplicados) es cara
  // de generar: recorre TODOS los pixeles de la imagen nativa (puede ser
  // varios millones en una radiografia). Antes se recalculaba desde cero
  // en cada llamada -- incluido cada frame de mousemove al arrastrar una
  // flecha, un texto o una letra, donde la imagen en si NO cambio, solo se
  // movio una anotacion encima. Eso era la causa real del arrastre lento.
  // Ahora se cachea por archivo+escala, y solo se regenera si cambio algo
  // que realmente afecta la imagen (WL/WW, rotacion, espejo, inversion).
  function renderBaseImage(f, scale){
    const p = f.pixel;
    const rotation = ((f.rotation||0)%360+360)%360;
    const key = [p.windowCenter, p.windowWidth, rotation, !!f.flipH, !!f.flipV, !!f.invert, scale].join('|');
    f._baseCacheByScale = f._baseCacheByScale || {};
    const cached = f._baseCacheByScale[scale];
    if (cached && cached.key === key) return cached.canvas;

    const w = p.cols, h = p.rows;
    const rotated90 = rotation===90 || rotation===270;
    const outW = (rotated90 ? h : w) * scale;
    const outH = (rotated90 ? w : h) * scale;

    const workCanvas = document.createElement('canvas');
    workCanvas.width = outW; workCanvas.height = outH;
    const ctx = workCanvas.getContext('2d');
    const imgData = ctx.createImageData(w, h);

    if (p.samplesPerPixel === 3) {
      for (let i=0, px=0; px < w*h; px++, i+=4) {
        let r,g,b;
        if (p.planarConfig === 1) {
          r = p.raw[px]; g = p.raw[w*h+px]; b = p.raw[2*w*h+px];
        } else {
          r = p.raw[px*3]; g = p.raw[px*3+1]; b = p.raw[px*3+2];
        }
        if (f.invert) { r = 255-r; g = 255-g; b = 255-b; }
        imgData.data[i]=r; imgData.data[i+1]=g; imgData.data[i+2]=b; imgData.data[i+3]=255;
      }
    } else {
      const wc = p.windowCenter, ww = Math.max(p.windowWidth,1);
      const lo = wc - ww/2, hi = wc + ww/2;
      const invert = (p.photometric === 'MONOCHROME1') !== !!f.invert;
      for (let i=0, px=0; px < w*h; px++, i+=4) {
        let val = p.raw[px] * p.rescaleSlope + p.rescaleIntercept;
        let g = ((val - lo) / (hi - lo)) * 255;
        g = Math.max(0, Math.min(255, g));
        if (invert) g = 255 - g;
        imgData.data[i]=g; imgData.data[i+1]=g; imgData.data[i+2]=g; imgData.data[i+3]=255;
      }
    }

    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    off.getContext('2d').putImageData(imgData, 0, 0);

    // Paso 1: rotar (sin espejo) a un canvas intermedio, en la orientacion final.
    const rotatedCanvas = document.createElement('canvas');
    rotatedCanvas.width = outW; rotatedCanvas.height = outH;
    const rctx = rotatedCanvas.getContext('2d');
    rctx.imageSmoothingEnabled = scale < 1;
    rctx.save();
    rctx.translate(outW/2, outH/2);
    rctx.rotate(rotation * Math.PI/180);
    rctx.drawImage(off, -(w*scale)/2, -(h*scale)/2, w*scale, h*scale);
    rctx.restore();

    // Paso 2: aplicar el espejo horizontal/vertical en espacio de PANTALLA (ya
    // rotado) — asi "Horizontal" siempre espeja izquierda/derecha de lo que se
    // ve en pantalla, y "Vertical" arriba/abajo, sin importar la rotacion activa.
    ctx.save();
    ctx.translate(outW/2, outH/2);
    ctx.scale(f.flipH ? -1 : 1, f.flipV ? -1 : 1);
    ctx.drawImage(rotatedCanvas, -outW/2, -outH/2);
    ctx.restore();

    f._baseCacheByScale[scale] = { key, canvas: workCanvas };
    return workCanvas;
  }

  function windowToCanvas(f, targetCanvas, scale){
    const base = renderBaseImage(f, scale);
    targetCanvas.width = base.width;
    targetCanvas.height = base.height;
    const ctx = targetCanvas.getContext('2d');
    ctx.drawImage(base, 0, 0);
    return ctx;
  }
  // Nota: el overlay se calcula y dibuja DESPUES de rotar/espejar (ver draw/
  // buildExportCanvas mas abajo), usando las dimensiones del canvas ya
  // corregido — porque la esquina "arriba-derecha, libre de mediastino" que
  // validamos solo es valida sobre la anatomia ya en su orientacion correcta.

  // Dibuja texto ligeramente mas grueso (trazo del mismo color, sin contorno
  // negro) para mejorar la legibilidad sin cambiar el color ni agregar borde.
  function fillTextThick(ctx, text, x, y, fillColor, lineWidthPx){
    ctx.lineWidth = lineWidthPx;
    ctx.strokeStyle = fillColor;
    ctx.fillStyle = fillColor;
    ctx.strokeText(text, x, y);
    ctx.fillText(text, x, y);
  }

  function drawOverlay(ctx, f, scale){
    const m = f.meta;

    // El tamaño se calcula en base al ANCHO de la imagen (no al alto): asi el bloque
    // de texto siempre ocupa la misma proporcion horizontal de la esquina, sin
    // invadir estructuras centrales en imagenes angostas (ej. columna vertebral).
    const fontSize = ctx.canvas.width * 0.0177;
    const lineHeight = ctx.canvas.width * 0.0202;
    const margin = ctx.canvas.width * 0.00693; // +5% respecto al margen anterior (0.0066)
    const thickW = fontSize * 0.03; // ~3% mas grueso
    ctx.font = fontSize + 'px "IBM Plex Mono", monospace';
    ctx.textBaseline = 'top';
    const YELLOW = 'rgba(255,255,120,0.95)';
    const YELLOW_DATE = 'rgba(255,235,59,0.95)';

    if (m.isFrontal) {
      // Radiografia frontal (AP/PA): bloque fijo arriba a la derecha, validado
      // sobre torax y columna AP.
      const lines = [m.patientName, m.patientId, m.birthDate, (m.institution || '')].filter(Boolean);
      ctx.textAlign = 'right';
      lines.forEach((line, i) => {
        fillTextThick(ctx, line, ctx.canvas.width - margin, margin + i*lineHeight, i===0 ? '#FFFFFF' : YELLOW, thickW);
      });
      const dt = m.studyDateTimeDisplay || '';
      fillTextThick(ctx, dt.trim(), ctx.canvas.width - margin, ctx.canvas.height - margin - fontSize, YELLOW_DATE, thickW);
      return;
    }

    // Radiografia lateral: bloque arriba, del lado hacia el que apunta la
    // convexidad de la columna (calculado automaticamente por pixeles). Si no
    // se pudo determinar con confianza, no se dibuja nada (mas vale omitir el
    // dato que arriesgar a taparlo). La fecha/hora va aparte, en la esquina
    // inferior del mismo lado — igual estructura que en las frontales.
    // Las laterales necesitan un margen bastante mayor que las frontales
    // (el cuerpo ocupa mas del encuadre), asi que se usa un margen propio,
    // mas holgado, para que el texto no invada la zona marcada como libre.
    // El margen de abajo (fecha/hora) ya quedo validado y no se toca mas.
    // El bloque de arriba recibe un 7% adicional de ajuste fino.
    const bottomLateralMargin = (margin + lineHeight * 2.5) * 0.4519; // fijo, no tocar
    const topLateralMargin = (margin + lineHeight * 2.5) * 0.2805; // ultimo ajuste fino, solo arriba
    const side = m.convexitySide;
    if (side !== 'left' && side !== 'right') return;

    const lines = [m.patientName, m.patientId, m.birthDate, (m.institution || '')].filter(Boolean);
    ctx.textAlign = side === 'right' ? 'right' : 'left';
    const xTop = side === 'right' ? ctx.canvas.width - topLateralMargin : topLateralMargin;
    const xBottom = side === 'right' ? ctx.canvas.width - bottomLateralMargin : bottomLateralMargin;
    lines.forEach((line, i) => {
      fillTextThick(ctx, line, xTop, topLateralMargin + i*lineHeight, i===0 ? '#FFFFFF' : YELLOW, thickW);
    });
    const dt = m.studyDateTimeDisplay || '';
    fillTextThick(ctx, dt.trim(), xBottom, ctx.canvas.height - bottomLateralMargin - fontSize, YELLOW_DATE, thickW);
  }

  function draw(f, scale, skipLayout){
    canvas.style.display = 'block';
    emptyEl.style.display = 'none';
    const ctx = windowToCanvas(f, canvas, scale);
    if (window.dvShowPatientOverlay !== false) drawOverlay(ctx, f, scale);
    if (window.dvShowAnnotations !== false) drawAnnotations(ctx, f);
    if (skipLayout) return;
    // fitCanvasToContainer() + updateActiveAspectRatio() recalculan el
    // tamano/proporcion del recuadro del visor -- necesario al cargar una
    // imagen nueva o rotarla, pero de ninguna manera en cada frame de un
    // arrastre (flecha, texto, WL/WW), porque updateActiveAspectRatio llama
    // a syncImageHeight(), que fuerza getBoundingClientRect() -- una medicion
    // sincronica del DOM, costosa si se repite decenas de veces por segundo
    // mientras se arrastra el mouse. Por eso los callers de alta frecuencia
    // (mousemove durante arrastre) pasan skipLayout=true.
    fitCanvasToContainer();
    updateActiveAspectRatio(f);
  }

  // Relacion de aspecto (ancho/alto) de la imagen actualmente mostrada, ya
  // considerando la rotacion aplicada (90/270 intercambia filas y columnas).
  // Se usa para que el recuadro del visor se ajuste al tamano REAL de cada
  // imagen (retrato para columna, paisaje para torax) en vez de forzar
  // siempre una proporcion fija 11:9 pensada solo para torax -- eso era lo
  // que dejaba enormes franjas negras vacias en radiografias de columna
  // (imagenes verticales dentro de un recuadro pensado para horizontal).
  let activeAspectRatio = 11/9; // default cuando no hay imagen cargada
  window.activeAspectRatio = activeAspectRatio;
  function updateActiveAspectRatio(f){
    if (!f || !f.pixel) return;
    const rotation = ((f.rotation||0)%360+360)%360;
    const rotated90 = rotation === 90 || rotation === 270;
    const dispW = rotated90 ? f.pixel.rows : f.pixel.cols;
    const dispH = rotated90 ? f.pixel.cols : f.pixel.rows;
    if (dispW > 0 && dispH > 0) {
      activeAspectRatio = dispW / dispH;
      window.activeAspectRatio = activeAspectRatio; // mantiene sincronizada la copia global que usa syncImageHeight() (otro bloque <script>)
    }
    if (typeof syncImageHeight === 'function') {
      syncImageHeight();
      // BUG corregido: el canvas se dimensiona en fitCanvasToContainer()
      // (llamado ANTES, dentro de draw()) usando las medidas VIEJAS del
      // contenedor -- recien syncImageHeight() ajusta el contenedor al
      // tamano/proporcion real de la imagen actual. Sin este segundo
      // llamado, el canvas quedaba dimensionado contra un contenedor
      // obsoleto (ej. el ancho 11:9 por defecto, o el de la imagen
      // anterior), dejando franjas negras vacias en imagenes verticales
      // (columna) aunque el contenedor ya se hubiera angostado.
      if (typeof fitCanvasToContainer === 'function') fitCanvasToContainer();
    }
  }

  function buildExportCanvas(f, multiplier){
    if (!f.meta.isFrontal && f.meta.convexitySide === undefined) {
      f.meta.convexitySide = detectConvexitySide(f.pixel);
    }
    const exportCanvas = document.createElement('canvas');
    const ctx = windowToCanvas(f, exportCanvas, multiplier);
    drawOverlay(ctx, f, multiplier);
    drawAnnotations(ctx, f);
    return exportCanvas;
  }

  function sanitizeFilenamePart(s){
    // Quita caracteres no permitidos en nombres de archivo de Windows/Mac
    // (\ / : * ? " < > |) para que la descarga nunca falle por el nombre.
    return (s || '').toString().trim().replace(/[\\/:*?"<>|]+/g, '_');
  }

  function buildPatientFilename(f){
    // DICOM guarda el nombre como "Apellidos^Nombres^..." (separado por ^).
    // El campo "Apellidos" puede traer mas de un apellido separado por
    // espacio (ej: "Garcia Lopez"), asi que se toma solo la PRIMERA palabra
    // de ese campo = el primer apellido.
    const raw = (f.meta && f.meta.patientNameRaw) || '';
    const familyField = raw.split('^')[0] || '';
    let surname = familyField.trim().split(/\s+/)[0] || '';
    if (!surname) surname = 'Paciente';
    const id = sanitizeFilenamePart(f.meta && f.meta.patientId) || 'SinID';
    return sanitizeFilenamePart(surname) + ' ' + id;
  }

  // ---- Nombre de archivo UNICO para un paciente con 2+ imagenes cargadas
  // (columna: AP + LAT como minimo) ----
  // Si esta misma persona (mismo apellido+DNI) tiene mas de una imagen
  // cargada en la lista, se le agrega un diferenciador al nombre (la vista
  // AP/LAT si el DICOM la trae, o un numero de lo contrario) para que no se
  // sobreescriban entre si al guardarse juntas en la misma carpeta. Si la
  // persona tiene una sola imagen (torax, el caso mas comun), el nombre
  // queda tal cual "Apellido ID", sin cambios.
  // Se usa tanto para "Descargar todos" como para "Descargar" individual,
  // para que el comportamiento sea el mismo sin importar cual botón se use.
  function buildUniqueFilename(f){
    const base = buildPatientFilename(f);
    const sameBase = state.files.filter(x => x.status === 'ok' && buildPatientFilename(x) === base);
    if (sameBase.length <= 1) return base;
    const view = (f.meta && (f.meta.viewPosition || f.meta.laterality)) || '';
    if (view) return base + ' ' + sanitizeFilenamePart(view);
    // Sin dato de vista en el DICOM: se numera segun el orden en que
    // aparecen cargadas en la lista (1, 2, 3...), estable mientras la lista
    // no cambie de orden.
    const position = sameBase.indexOf(f) + 1;
    return base + ' ' + position;
  }

  // ---- Red de seguridad DEFINITIVA contra perdida de imagenes por nombre
  // repetido ----
  // Caso real detectado: 2 imagenes DISTINTAS de un mismo paciente (ej. AP
  // y LATERAL) pueden terminar con el MISMO nombre calculado si el equipo
  // etiqueta mal el tag de vista (ej. las dos vienen marcadas "AP" en el
  // DICOM, un problema de datos del equipo, no del visor). Sin esta
  // proteccion, la segunda imagen SOBREESCRIBE silenciosamente a la
  // primera al guardarse -- se pierde una imagen real sin ningun aviso.
  // Esta funcion garantiza que, DENTRO DE UNA MISMA EXPORTACION, nunca se
  // reutilice un nombre ya usado: si buildUniqueFilename() devuelve un
  // nombre que ya se uso en esta corrida (sea cual sea el motivo), se le
  // agrega " (2)", " (3)", etc. -- nunca se pierde una imagen por esto,
  // pase lo que pase con los tags del DICOM.
  function reserveUniqueFilename(baseName, usedNames){
    let candidate = baseName;
    let n = 2;
    while (usedNames.has(candidate)) {
      candidate = baseName + ' (' + n + ')';
      n++;
    }
    usedNames.add(candidate);
    return candidate;
  }

  function canvasToBlobAsync(canvasEl, mime, quality){
    return new Promise((resolve) => canvasEl.toBlob(resolve, mime, quality));
  }

  async function downloadCanvasAsJpg(canvasEl, filename){
    const blob = await canvasToBlobAsync(canvasEl, 'image/jpeg', 0.95);
    const savedToFolder = await saveBlobToChosenFolder(blob, filename);
    if (savedToFolder) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  async function downloadCanvasAsPng(canvasEl, filename){
    // PNG: sin perdida (lossless). No acepta parametro de calidad porque no
    // aplica compresion con perdida como JPG; conserva integramente los
    // niveles de gris resultantes del windowing aplicado. Recomendado sobre
    // JPG cuando la imagen se va a usar para analisis por IA o comparaciones
    // finas (evita artefactos de bloque en zonas de bajo contraste, ej.
    // espacio discal o cortical fina).
    const blob = await canvasToBlobAsync(canvasEl, 'image/png');
    const savedToFolder = await saveBlobToChosenFolder(blob, filename);
    if (savedToFolder) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }

  // PDF individual y en bloque comparten esta misma funcion -- antes estaba
  // duplicada en 2 lugares con pequeñas diferencias, lo que podia hacer que
  // se desalinearan con el tiempo.
  async function downloadCanvasAsPdf(canvasEl, filename){
    if (window.__dvPdfFailed || !window.jspdf) {
      throw new Error('El generador de PDF no cargó (problema de conexión).');
    }
    const { jsPDF } = window.jspdf;
    const orientation = canvasEl.width >= canvasEl.height ? 'landscape' : 'portrait';
    const pdf = new jsPDF({ orientation, unit: 'px', format: [canvasEl.width, canvasEl.height] });
    pdf.addImage(canvasEl.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, canvasEl.width, canvasEl.height);
    const savedToFolder = await saveBlobToChosenFolder(pdf.output('blob'), filename);
    if (!savedToFolder) pdf.save(filename);
  }

  // ---- Bloqueo global de exportacion ----
  // ANTES: no habia nada que impidiera dar clic en "Descargar todos" y,
  // mientras corria, dar clic TAMBIEN en la flecha (JPG/PDF) o en el
  // "Descargar" individual -- eso lanzaba una SEGUNDA exportacion completa
  // corriendo al mismo tiempo que la primera, ambas escribiendo en la misma
  // carpeta. Resultado real observado: 46 imagenes cargadas terminaban
  // generando 86-92 archivos en la carpeta (el mismo estudio exportado dos
  // veces, en dos formatos distintos -- se veian como "duplicados" porque
  // el Explorador de Windows en vista de iconos oculta la extension), y la
  // barra de progreso saltaba entre "JPG" y "PNG" porque las dos corridas
  // pisaban el mismo indicador. Ahora, mientras haya una exportacion en
  // curso (individual O en bloque), TODOS los botones de descarga quedan
  // deshabilitados -- fisicamente no se puede volver a hacer clic hasta
  // que la que esta corriendo termine.
  let exportBusy = false;
  const allExportButtons = [exportMainBtn, exportOpenerBtn, exportJpgBtn, exportPdfBtn,
    exportAllMainBtn, exportAllOpenerBtn,
    document.getElementById('dv-export-all-jpg'), document.getElementById('dv-export-all-pdf')]
    .filter(Boolean);
  function setExportBusy(busy){
    exportBusy = busy;
    allExportButtons.forEach(btn => { btn.disabled = busy; });
  }

  // ---- Formato "recordado" del boton principal ----
  // Antes el boton principal SIEMPRE decia "(PNG)" y SIEMPRE descargaba en
  // PNG, sin importar que formato se hubiera elegido la ultima vez desde
  // la flecha -- generaba dudas ("¿en verdad se guardo en JPG?"). Ahora el
  // boton "recuerda" el ultimo formato usado en esta sesion, actualiza su
  // propio texto para reflejarlo con precision, y un clic directo en el
  // vuelve a usar ese mismo formato. Al recargar la pagina vuelve a
  // arrancar en PNG (el comportamiento por defecto que se pidio antes).
  let currentSingleFormat = 'png';
  function updateSplitButtonLabel(mainBtn, prefix, format){
    const label = FORMAT_LABELS[format] || format.toUpperCase();
    mainBtn.textContent = `${prefix} (${label})`;
    mainBtn.title = format === 'png'
      ? 'Descarga directo en PNG (sin compresión con pérdida, recomendado para análisis de IA o telemedicina)'
      : `Descarga directo en ${label}`;
  }

  async function exportSingle(format){
    if (exportBusy) return;
    if (format === 'pdf' && (window.__dvPdfFailed || !window.jspdf)) {
      alert('El generador de PDF no cargó (problema de conexión). Puedes usar "Descargar JPG" mientras tanto.');
      return;
    }
    setExportBusy(true);
    try {
      await ensureFolderChosen();
      const f = state.files[state.activeIndex];
      const mult = parseFloat(resSelect.value);
      const c = buildExportCanvas(f, mult);
      // Antes el PDF individual usaba el nombre original del archivo DICOM
      // (ej. "U_2026_08_01_09_06_06.pdf"), inconsistente con PNG/JPG que
      // usan Apellido+ID. Ahora los 3 formatos usan el mismo nombre unico
      // basado en el paciente, igual que "Descargar todos".
      const filename = buildUniqueFilename(f);
      if (format === 'jpg') await downloadCanvasAsJpg(c, filename + '.jpg');
      else if (format === 'png') await downloadCanvasAsPng(c, filename + '.png');
      else if (format === 'pdf') await downloadCanvasAsPdf(c, filename + '.pdf');
      const label = FORMAT_LABELS[format] || format.toUpperCase();
      showExportProgress(1, 1, label);
      finishExportProgress(1, label);
    } finally {
      setExportBusy(false);
    }
  }

  exportMainBtn.addEventListener('click', () => exportSingle(currentSingleFormat));
  exportJpgBtn.addEventListener('click', () => {
    currentSingleFormat = 'jpg';
    updateSplitButtonLabel(exportMainBtn, 'Descargar', 'jpg');
    exportSingle('jpg');
  });
  exportPdfBtn.addEventListener('click', () => {
    currentSingleFormat = 'pdf';
    updateSplitButtonLabel(exportMainBtn, 'Descargar', 'pdf');
    exportSingle('pdf');
  });

  // ---- Barra de progreso de exportacion (centrada sobre la imagen) ----
  // Se usa tanto para la descarga individual (destello breve confirmando
  // el formato real que se guardo, ya que el boton principal siempre dice
  // "(PNG)" -- esto evita la duda de "¿en verdad se descargo en JPG?"
  // cuando se usa la flecha para elegir otro formato) como para la
  // descarga en bloque (con el progreso real, archivo por archivo).
  const exportProgressEl = document.getElementById('dv-export-progress');
  const exportProgressFillEl = document.getElementById('dv-export-progress-fill');
  const exportProgressLabelEl = document.getElementById('dv-export-progress-label');
  function showExportProgress(done, total, formatLabel){
    if (!exportProgressEl) return;
    exportProgressEl.classList.remove('dv-hidden');
    const pct = total > 0 ? Math.round((done/total)*100) : 0;
    if (exportProgressFillEl) exportProgressFillEl.style.width = pct + '%';
    if (exportProgressLabelEl) exportProgressLabelEl.textContent =
      `Exportando en ${formatLabel} — ${done} de ${total} (${pct}%)`;
  }
  function finishExportProgress(total, formatLabel){
    if (!exportProgressEl) return;
    if (exportProgressFillEl) exportProgressFillEl.style.width = '100%';
    if (exportProgressLabelEl) exportProgressLabelEl.textContent =
      `Listo — ${total} archivo(s) en ${formatLabel} ✓`;
    setTimeout(() => exportProgressEl.classList.add('dv-hidden'), 1400);
    // El selector de carpeta que aparece al descargar (showDirectoryPicker)
    // hace que el navegador salga de pantalla completa por su cuenta, como
    // medida de seguridad -- fuera de nuestro control. Se rearma el
    // respaldo para que, apenas la persona vuelva a hacer clic en
    // cualquier parte (lo normal, para seguir trabajando), vuelva sola a
    // pantalla completa.
    armFullscreenReentryOnNextClick();
  }

  // Descarga masiva (todos los archivos "Legible"), generalizada para los
  // 3 formatos. IMPORTANTE: es un bucle SECUENCIAL de verdad (await uno por
  // uno) -- antes se programaban TODAS las descargas casi de una sola vez
  // con setTimeout(idx*400ms), sin esperar a que cada una realmente
  // terminara (armar el canvas + codificar la imagen + escribir el
  // archivo). Con pocas imagenes no se notaba, pero con 50+ eso significaba
  // tener decenas de imagenes de alta resolucion en memoria al mismo
  // tiempo -- exactamente lo que causaba que la pestaña se pusiera lenta,
  // se colgara, o se cerrara sola. Ahora cada imagen se termina de exportar
  // por completo antes de empezar la siguiente.
  const FORMAT_LABELS = { png: 'PNG', jpg: 'JPG', pdf: 'PDF' };
  async function exportAllAs(kind){
    if (exportBusy) return;
    setExportBusy(true);
    try {
      await ensureFolderChosen();
      const mult = parseFloat(resSelect.value);
      const okFiles = state.files.filter(f => f.status === 'ok');
      const total = okFiles.length;
      if (!total) return;
      const formatLabel = FORMAT_LABELS[kind] || kind.toUpperCase();
      const usedNames = new Set(); // reinicia la proteccion anti-colision en cada exportacion

      showExportProgress(0, total, formatLabel);
      for (let i = 0; i < total; i++) {
        const f = okFiles[i];
        try {
          const c = buildExportCanvas(f, mult);
          const filename = reserveUniqueFilename(buildUniqueFilename(f), usedNames);
          if (kind === 'jpg') {
            await downloadCanvasAsJpg(c, filename + '.jpg');
          } else if (kind === 'png') {
            await downloadCanvasAsPng(c, filename + '.png');
          } else if (kind === 'pdf') {
            await downloadCanvasAsPdf(c, filename + '.pdf');
          }
        } catch (err) {
          console.error('No se pudo exportar', f.name, err);
        }
        showExportProgress(i + 1, total, formatLabel);
        // Pequeña pausa entre imagen e imagen: le da tiempo al navegador de
        // liberar memoria (recolector de basura) y de seguir respondiendo a
        // la interfaz mientras exporta muchas imagenes seguidas.
        await new Promise(resolve => setTimeout(resolve, 60));
      }
      finishExportProgress(total, formatLabel);
    } finally {
      setExportBusy(false);
    }
  }
  let currentBatchFormat = 'png';
  exportAllMainBtn.addEventListener('click', () => exportAllAs(currentBatchFormat));
  document.getElementById('dv-export-all-jpg').addEventListener('click', () => {
    currentBatchFormat = 'jpg';
    updateSplitButtonLabel(exportAllMainBtn, 'Descargar todos', 'jpg');
    exportAllAs('jpg');
  });
  document.getElementById('dv-export-all-pdf').addEventListener('click', () => {
    currentBatchFormat = 'pdf';
    updateSplitButtonLabel(exportAllMainBtn, 'Descargar todos', 'pdf');
    exportAllAs('pdf');
  });
})();
</script>
<script>
(function(){
  function syncImageHeight(){
    const aspectBox = document.querySelector('.dv-viewer-aspect');
    if (!aspectBox) return;

    // Se dejó de atar el tamaño de la imagen a la altura de la columna
    // izquierda (panel de miniaturas/datos) -- eso era justo lo que la
    // venía achicando cada vez mas. Un visor profesional (RadiAnt, etc.)
    // usa CASI TODA la ventana del navegador para la imagen, sin importar
    // cuanto contenido tenga el panel lateral. Ahora es igual: el alto
    // maximo disponible es "desde donde arranca el cuadro hasta casi el
    // final de la ventana", y el ancho el que tenga disponible la columna
    // de la imagen -- lo que sea mas grande respetando la proporcion real.
    aspectBox.style.flex = '';
    aspectBox.style.width = '100%';
    aspectBox.style.height = 'auto';
    aspectBox.style.margin = '0 auto';

    const rect = aspectBox.getBoundingClientRect();
    const availW = rect.width;
    const maxH = Math.max(300, window.innerHeight - rect.top - 24);
    if (!availW) return;

    const ratio = (typeof window.activeAspectRatio === 'number' ? window.activeAspectRatio : (11/9));
    // El cuadro mas grande que respeta la proporcion real de la imagen y
    // cabe tanto en el ancho disponible como en el alto disponible
    // (formula estandar de "contain"): si la imagen es ancha (torax), el
    // ancho suele mandar; si es angosta y alta (columna), el alto manda y
    // el cuadro queda angosto pero TAN ALTO como el maximo disponible --
    // no un cuadro grande con la imagen chica adentro con franjas negras.
    let boxW = Math.min(availW, maxH * ratio);
    let boxH = boxW / ratio;

    aspectBox.style.width = boxW + 'px';
    aspectBox.style.height = boxH + 'px';

    // Con el cuadro ya en su tamano final, se reajusta la imagen adentro.
    if (typeof window.fitCanvasToContainer === 'function') window.fitCanvasToContainer();
  }

  window.addEventListener('load', syncImageHeight);
  window.addEventListener('resize', syncImageHeight);
  // reintento breve por si las fuentes/layout tardan en asentarse
  setTimeout(syncImageHeight, 300);
  setTimeout(syncImageHeight, 800);

  // BUG REAL corregido: esta funcion vivia encerrada dentro de este IIFE y
  // nunca se exponia globalmente. El codigo en draw()/updateActiveAspectRatio
  // (en otro bloque <script> separado) intenta llamarla via
  // "typeof syncImageHeight === 'function'", pero esa comprobacion busca en
  // el ambito GLOBAL -- como la funcion nunca se adjunto a window, esa
  // comprobacion siempre daba false en silencio, y syncImageHeight() jamas
  // se ejecutaba al cambiar de imagen (solo corria una vez al cargar la
  // pagina y en resize). Por eso el recuadro del visor se quedaba con la
  // proporcion de la ULTIMA vez que corrio (o la de fabrica 11:9), sin
  // importar que tan vertical/horizontal fuera la imagen realmente activa.
  window.syncImageHeight = syncImageHeight;
})();
</script>
<script>
(function(){
  // ==================== Control de acceso (candado) ====================
  // Un candado 100% en el navegador no puede ser seguro de verdad (ver
  // conversacion): esta parte solo pinta la pantalla y guarda el codigo;
  // la validacion REAL (existe, no vencio, no fue revocado) la hace el
  // servidor (Cloudflare Worker) en /validate. Sin ese servidor desplegado
  // y sin reemplazar la URL de abajo, el candado no puede confirmar nada.
  const ACCESS_WORKER_URL = 'https://imedicom-access.imedica.workers.dev';
  window.ACCESS_WORKER_URL = ACCESS_WORKER_URL; // usado tambien por "pegar link de Drive"

  const STORAGE_KEY = 'dv_access_session';
  const DEVICE_KEY = 'dv_device_id';
  const REVALIDATE_MS = 5 * 60 * 1000; // revalida cada 5 min mientras esta abierto
  const NOT_CONFIGURED = ACCESS_WORKER_URL.includes('REEMPLAZAR');

  const root = document.getElementById('dv-root');
  const lockScreen = document.getElementById('dv-lock-screen');
  const input = document.getElementById('dv-lock-input');
  const btn = document.getElementById('dv-lock-btn');
  const msg = document.getElementById('dv-lock-msg');

  function getDeviceId(){
    try {
      let id = localStorage.getItem(DEVICE_KEY);
      if (!id) {
        id = (crypto && crypto.randomUUID) ? crypto.randomUUID() :
          'dv-' + Date.now() + '-' + Math.random().toString(16).slice(2);
        localStorage.setItem(DEVICE_KEY, id);
      }
      return id;
    } catch(e) { return 'dv-nolocal-' + Date.now(); }
  }
  const DEVICE_ID = getDeviceId();

  const fsControlsEl = document.getElementById('dv-fullscreen-controls');
  function unlock(){
    root.classList.remove('dv-locked');
    lockScreen.classList.add('dv-hidden');
    if (fsControlsEl) fsControlsEl.classList.add('dv-show');
  }
  function lock(){
    root.classList.add('dv-locked');
    lockScreen.classList.remove('dv-hidden');
    if (fsControlsEl) fsControlsEl.classList.remove('dv-show');
  }
  function showMsg(text, isErr){
    // El texto siempre viene del diccionario REASONS (fijo, no de datos
    // externos ni del usuario), asi que es seguro usar innerHTML aqui
    // solo para poder forzar el salto de linea con "\n" -> <br>.
    msg.innerHTML = String(text).split('\n').map(escapeHtmlMsg).join('<br>');
    msg.className = 'dv-lock-msg ' + (isErr ? 'dv-err' : 'dv-ok');
  }
  function escapeHtmlMsg(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function saveSession(code){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ code, validatedAt: Date.now() })); } catch(e){}
  }
  function readSession(){
    try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
  }
  function clearSession(){
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  }

  const REASONS = {
    not_found: 'Código no encontrado.',
    expired: 'Este código venció.',
    revoked: 'Este código fue desactivado.',
    missing_code: 'Ingresá un código.',
    missing_device: 'No se pudo identificar el dispositivo. Recargá la página.',
    device_limit: 'Este código ya alcanzó su límite\nde dispositivos autorizados.'
  };

  async function attemptCode(code, silent){
    if (NOT_CONFIGURED) {
      lock();
      showMsg('El candado todavía no está configurado (falta desplegar el servidor de validación).', true);
      return;
    }
    if (!silent) { btn.disabled = true; showMsg('Verificando…', false); }
    try {
      const resp = await fetch(ACCESS_WORKER_URL + '/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, deviceId: DEVICE_ID })
      });
      const result = await resp.json();
      if (result.valid) {
        saveSession(code);
        unlock();
        if (!silent) {
          showMsg('Acceso concedido' + (result.expiresAt ? (' — vence ' + new Date(result.expiresAt).toLocaleDateString('es-PE')) : ''), false);
        }
      } else {
        clearSession();
        lock();
        showMsg(REASONS[result.reason] || 'Código inválido.', true);
      }
    } catch(err){
      if (silent) {
        // Problema de red al revalidar en segundo plano: no se corta de
        // golpe una sesion que ya estaba adentro por un corte de conexion
        // pasajero -- se reintenta en el proximo ciclo.
        return;
      }
      showMsg('No se pudo conectar para validar el código. Revisá tu conexión.', true);
    } finally {
      if (!silent) { btn.disabled = false; }
    }
  }

  btn.addEventListener('click', () => {
    const code = input.value.trim();
    if (!code) { showMsg('Ingresá un código.', true); return; }
    requestViewerFullscreen(); // se pide ACA, de forma sincronica con el clic -- los navegadores exigen que el pedido de pantalla completa este pegado al gesto del usuario, no despues de esperar una respuesta del servidor.
    attemptCode(code, false);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btn.click();
  });

  // Si hay una sesion guardada, se revalida contra el servidor al cargar
  // (para respetar revocaciones/vencimientos que hayas hecho desde la
  // ultima vez), y despues periodicamente mientras la pestaña sigue
  // abierta -- si revocas o vence el codigo del lado del servidor, el
  // acceso se corta solo, sin que el usuario tenga que recargar.
  const session = readSession();
  if (session && session.code) {
    input.value = session.code;
    attemptCode(session.code, true);
  }
  setInterval(() => {
    const s = readSession();
    if (s && s.code && !root.classList.contains('dv-locked')) {
      attemptCode(s.code, true);
    }
  }, REVALIDATE_MS);
})();
</script>
