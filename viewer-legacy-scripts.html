<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="window.__dvPdfFailed=true"></script>
<script>
(function(){
  // ---- Lector DICOM propio (sin dependencias externas) ----
  // Soporta: Explicit VR Little Endian y Implicit VR Little Endian, sin compresion.
  const dicomParser = {
    parseDicom: function(byteArray){
      function readUint16(o){ return byteArray[o] | (byteArray[o+1]<<8); }
      function readUint32(o){ return (byteArray[o] | (byteArray[o+1]<<8) | (byteArray[o+2]<<16) | (byteArray[o+3]<<24)) >>> 0; }
      function pad4(n){ return n.toString(16).padStart(4,'0'); }
      function tagStr(g,e){ return 'x' + pad4(g) + pad4(e); }

      const longVRs = new Set(['OB','OW','OF','SQ','UT','UN','OD','OL','UC','UR']);
      const elements = {};
      let offset = 0;
      let hasPreamble = false;

      if (byteArray.length > 132) {
        const magic = String.fromCharCode(byteArray[128],byteArray[129],byteArray[130],byteArray[131]);
        if (magic === 'DICM') { hasPreamble = true; offset = 132; }
      }

      let transferSyntax = null;

      if (hasPreamble) {
        while (offset < byteArray.length) {
          const group = readUint16(offset);
          if (group !== 0x0002) break;
          const element = readUint16(offset+2);
          const vr = String.fromCharCode(byteArray[offset+4], byteArray[offset+5]);
          let length, valueOffset;
          if (longVRs.has(vr)) { length = readUint32(offset+8); valueOffset = offset+12; }
          else { length = readUint16(offset+6); valueOffset = offset+8; }
          elements[tagStr(group,element)] = { dataOffset: valueOffset, length: length, vr: vr };
          offset = valueOffset + length;
        }
        const tsElem = elements['x00020010'];
        if (tsElem) {
          let str = '';
          for (let i=0;i<tsElem.length;i++){ const c = byteArray[tsElem.dataOffset+i]; if (c!==0) str += String.fromCharCode(c); }
          transferSyntax = str.trim();
        }
      }

      let isExplicitVR = true;
      if (transferSyntax === '1.2.840.10008.1.2') isExplicitVR = false;
      if (!hasPreamble) isExplicitVR = false;

      const encapsulated = !!transferSyntax && (
        transferSyntax.indexOf('1.2.840.10008.1.2.4') === 0 ||
        transferSyntax.indexOf('1.2.840.10008.1.2.5') === 0 ||
        transferSyntax.indexOf('1.2.840.10008.1.2.6') === 0
      );

      // Salta el contenido de una secuencia (SQ) de longitud indefinida, terminada
      // por un Sequence Delimitation Item (FFFE,E0DD). Es una construccion normal
      // de DICOM, no tiene relacion con compresion de imagen. Los Items dentro de
      // la secuencia tambien pueden tener longitud indefinida (terminados por
      // Item Delimitation FFFE,E00D), por lo que ambas funciones se recorren
      // mutuamente para soportar cualquier nivel de anidamiento.
      function skipSequenceUndefined(startOffset, explicitVR){
        let o = startOffset;
        while (o < byteArray.length - 8) {
          const g = readUint16(o), e = readUint16(o+2);
          const len = readUint32(o+4);
          o += 8;
          if (g === 0xFFFE && e === 0xE0DD) break; // fin de secuencia
          if (g === 0xFFFE && e === 0xE000) { // Item
            if (len === 0xFFFFFFFF) o = skipItemUndefined(o, explicitVR);
            else o += len;
          } else {
            break; // estructura inesperada, salimos por seguridad
          }
        }
        return o;
      }
      function skipItemUndefined(startOffset, explicitVR){
        let o = startOffset;
        while (o < byteArray.length - 8) {
          const g = readUint16(o), e = readUint16(o+2);
          if (g === 0xFFFE && e === 0xE00D) { o += 8; break; } // fin de item
          let vr, len, vOff;
          if (explicitVR) {
            vr = String.fromCharCode(byteArray[o+4], byteArray[o+5]);
            if (longVRs.has(vr)) { len = readUint32(o+8); vOff = o+12; }
            else { len = readUint16(o+6); vOff = o+8; }
          } else {
            len = readUint32(o+4); vOff = o+8;
          }
          if (len === 0xFFFFFFFF) vOff = skipSequenceUndefined(vOff, explicitVR);
          else vOff += len;
          o = vOff;
        }
        return o;
      }
      // alias usado mas abajo
      function skipUndefinedLength(startOffset){ return skipSequenceUndefined(startOffset, isExplicitVR); }

      while (offset < byteArray.length - 8) {
        const group = readUint16(offset);
        const element = readUint16(offset+2);
        let vr, length, valueOffset;
        if (isExplicitVR) {
          vr = String.fromCharCode(byteArray[offset+4], byteArray[offset+5]);
          if (longVRs.has(vr)) { length = readUint32(offset+8); valueOffset = offset+12; }
          else { length = readUint16(offset+6); valueOffset = offset+8; }
        } else {
          vr = null; length = readUint32(offset+4); valueOffset = offset+8;
        }
        if (length === 0xFFFFFFFF) {
          if (group === 0x7fe0 && element === 0x0010) {
            // Pixel data de longitud indefinida = encapsulado/comprimido (JPEG, etc.)
            elements[tagStr(group,element)] = { dataOffset: valueOffset, length: -1, vr: vr, undefinedLength: true };
            break;
          }
          // Secuencia normal (SQ) de longitud indefinida: se salta y se sigue leyendo
          const contentEnd = skipUndefinedLength(valueOffset);
          elements[tagStr(group,element)] = { dataOffset: valueOffset, length: contentEnd - valueOffset, vr: vr };
          offset = contentEnd;
          continue;
        }
        elements[tagStr(group,element)] = { dataOffset: valueOffset, length: length, vr: vr };
        offset = valueOffset + length;
        if (group === 0x7fe0 && element === 0x0010) break;
      }

      function stringVal(tag){
        const el = elements[tag];
        if (!el || el.length <= 0) return '';
        let str = '';
        for (let i=0;i<el.length;i++){ str += String.fromCharCode(byteArray[el.dataOffset+i]); }
        return str.replace(/\0/g,'').trim();
      }
      function uint16Val(tag){
        const el = elements[tag];
        if (!el) return undefined;
        return byteArray[el.dataOffset] | (byteArray[el.dataOffset+1]<<8);
      }

      return { elements: elements, byteArray: byteArray, string: stringVal, uint16: uint16Val, encapsulated: encapsulated, transferSyntax: transferSyntax };
    }
  };

  const state = { files: [], activeIndex: -1 };

  // ==================== Pantalla completa (sin distractores del navegador) ====================
  // Se intenta activar automaticamente al entrar con el codigo de acceso.
  // PERO: si ya habia una sesion guardada de una vez anterior, el ingreso
  // es automatico (sin que la persona de clic en "Entrar"), y ahi los
  // navegadores BLOQUEAN el pedido de pantalla completa porque no vino
  // pegado a un gesto real del usuario -- por diseño de seguridad, no se
  // puede saltar esta regla. Por eso hay un respaldo: el primer clic que
  // la persona haga en cualquier parte de la pantalla (una vez adentro)
  // tambien dispara el pedido.
  //
  // Controles (esquina superior derecha), fijos, sin cambiar de icono:
  //  - Minimizar: sale de pantalla completa SOLO temporalmente -- pensado
  //    para acomodar la ventana a mitad de pantalla (Windows+flecha) y
  //    poder arrastrar un archivo desde el Explorador. Apenas se cargan
  //    archivos (arrastrados o elegidos con el selector), vuelve sola a
  //    pantalla completa.
  //  - X: sale de pantalla completa de forma normal, sin volver a entrar
  //    sola despues.
  let fsReturnAfterLoad = false;
  window.requestViewerFullscreen = function(){
    const el = document.documentElement;
    if (document.fullscreenElement || !el.requestFullscreen) return;
    el.requestFullscreen().catch(() => {});
  };
  function exitFullscreenSafe(){
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    }
  }
  function reenterFullscreenIfPending(){
    if (fsReturnAfterLoad) {
      fsReturnAfterLoad = false;
      window.requestViewerFullscreen();
    }
  }

  // Respaldo para cualquier caso donde la pantalla completa se corte sin
  // que el codigo lo pida explicitamente -- los dos casos reales
  // detectados son: 1) sesion guardada (login automatico, sin clic en
  // "Entrar"), y 2) el propio selector de carpeta del sistema operativo
  // (showDirectoryPicker, el que aparece al descargar) hace que el
  // navegador SALGA de pantalla completa por su cuenta como medida de
  // seguridad -- eso esta fuera de nuestro control, pero se puede volver a
  // entrar apenas la persona vuelva a interactuar con la pagina. El primer
  // clic real que la persona haga en cualquier parte, mientras el visor
  // este desbloqueado y no este en pantalla completa, dispara el pedido.
  // Se quita el listener apenas se usa una vez, para no interferir con
  // nada mas despues -- pero se puede volver a "armar" llamando de nuevo a
  // armFullscreenReentryOnNextClick() (se hace despues de cada descarga).
  function firstClickFullscreenFallback(e){
    document.removeEventListener('click', firstClickFullscreenFallback);
    // Si el primer clic cayo justo sobre los botones de pantalla completa,
    // ellos ya se encargan solos -- disparar el pedido tambien desde aca
    // generaria dos pedidos simultaneos que se pisan entre si y terminan
    // fallando los dos.
    if (e && e.target && e.target.closest && e.target.closest('#dv-fullscreen-controls')) return;
    const rootEl = document.getElementById('dv-root');
    if (rootEl && !rootEl.classList.contains('dv-locked') && !document.fullscreenElement) {
      window.requestViewerFullscreen();
    }
  }
  function armFullscreenReentryOnNextClick(){
    document.removeEventListener('click', firstClickFullscreenFallback); // evita duplicar el listener si ya estaba armado
    document.addEventListener('click', firstClickFullscreenFallback);
  }
  armFullscreenReentryOnNextClick();

  const fsMinimizeBtn = document.getElementById('dv-fs-minimize');
  const fsExitBtn = document.getElementById('dv-fs-exit');
  if (fsMinimizeBtn) {
    fsMinimizeBtn.addEventListener('click', () => {
      // El icono queda siempre igual (no cambia de forma), pero la accion
      // se adapta al estado actual, para que el boton nunca se quede "sin
      // reaccionar": si ya esta en pantalla completa, la reduce (pensado
      // para arrastrar un archivo); si no lo esta, la activa.
      if (document.fullscreenElement) {
        fsReturnAfterLoad = true;
        exitFullscreenSafe();
      } else {
        window.requestViewerFullscreen();
      }
    });
  }
  if (fsExitBtn) {
    fsExitBtn.addEventListener('click', () => {
      fsReturnAfterLoad = false;
      exitFullscreenSafe();
    });
  }


  const dropEl = document.getElementById('dv-drop');
  const inputEl = document.getElementById('dv-file-input');
  const listEl = document.getElementById('dv-filelist');
  const canvas = document.getElementById('dv-canvas');
  const emptyEl = document.getElementById('dv-empty');
  const metaEl = document.getElementById('dv-meta');
  const wlSlider = document.getElementById('dv-wl');
  const wwSlider = document.getElementById('dv-ww');
  const wlVal = document.getElementById('dv-wl-val');
  const wwVal = document.getElementById('dv-ww-val');
  const exportJpgBtn = document.getElementById('dv-export-jpg');
  const exportMainBtn = document.getElementById('dv-export-main');
  const exportPdfBtn = document.getElementById('dv-export-pdf');
  const exportOpenerBtn = document.getElementById('dv-export-opener');
  const exportAllMainBtn = document.getElementById('dv-export-all-main');
  const exportAllOpenerBtn = document.getElementById('dv-export-all-opener');
  const resSelect = document.getElementById('dv-res');

  // ---- Carpeta de descarga (icono discreto) --------------------------
  // Los navegadores no permiten a una pagina web listar "Disco C/D/E"
  // directamente (aislamiento por seguridad). Lo que si permite Chrome/
  // Edge/Opera via File System Access API es abrir el explorador nativo
  // del equipo (showDirectoryPicker), donde se navega libremente a
  // cualquier disco/carpeta y se elige o crea una. Firefox/Safari no
  // soportan esto: el icono queda deshabilitado y las descargas siguen
  // el comportamiento normal del navegador.
  const chooseFolderBtn = document.getElementById('dv-choose-folder');
  const fsApiSupported = typeof window.showDirectoryPicker === 'function';
  let downloadDirHandle = null;

  if (!fsApiSupported && chooseFolderBtn) {
    chooseFolderBtn.disabled = true;
    chooseFolderBtn.style.opacity = '.35';
    chooseFolderBtn.title = 'No disponible en este navegador (usa Chrome, Edge u Opera)';
  }

  function pad2(n){ return String(n).padStart(2, '0'); }

  // IMPORTANTE: ya NO se crea ninguna subcarpeta automatica (antes se
  // armaba una carpeta por fecha dentro de la elegida). Eso causaba que si
  // en una sesion posterior el usuario volvia a usar el selector de carpeta
  // y por error navegaba DENTRO de una carpeta ya creada por una descarga
  // anterior (en vez de volver a la carpeta base), el sistema anidaba una
  // subcarpeta de fecha dentro de otra, sucesivamente. Ahora todo se
  // guarda siempre PLANO, directo en la carpeta que el usuario eligio con
  // el icono de carpeta -- sin ninguna capa extra.
  async function resolveActiveDirHandle(){
    return downloadDirHandle;
  }

  // Abre el selector de carpeta del sistema operativo y guarda el handle
  // elegido. Devuelve true si el usuario eligio una carpeta, false si
  // cancelo el dialogo o el navegador no soporta esta funcion.
  async function pickDownloadFolder(){
    if (!fsApiSupported) return false;
    try {
      downloadDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      chooseFolderBtn.classList.add('dv-folder-active');
      chooseFolderBtn.title = 'Carpeta: ' + downloadDirHandle.name + ' (clic para cambiar)';
      return true;
    } catch (err) {
      if (err && err.name !== 'AbortError') console.error('Error al elegir carpeta de descarga', err);
      return false;
    }
  }

  if (chooseFolderBtn) {
    chooseFolderBtn.addEventListener('click', pickDownloadFolder);
  }

  // Se llama SIEMPRE antes de cualquier descarga (individual o en bloque).
  // Si el usuario todavia no eligio carpeta en esta sesion, se la pide en
  // este momento -- una sola vez -- en vez de dejar que cada archivo caiga
  // por separado con el cuadro nativo "Guardar como" del navegador
  // preguntando uno por uno. Si el navegador no soporta elegir carpeta
  // (Safari/iPad) o el usuario cancela el dialogo, sigue igual con la
  // descarga normal del navegador (y ahi si va a preguntar por archivo,
  // pero eso ya es una limitacion del navegador, no de la app).
  async function ensureFolderChosen(){
    if (downloadDirHandle) return true;
    if (!fsApiSupported) return false;
    return await pickDownloadFolder();
  }

  // Intenta guardar directamente en la carpeta elegida. Devuelve true si lo
  // logro; false si no hay carpeta elegida o algo fallo (fallback a la
  // descarga normal del navegador).
  async function saveBlobToChosenFolder(blob, filename){
    if (!downloadDirHandle) return false;
    try {
      const dirHandle = (await resolveActiveDirHandle()) || downloadDirHandle;
      const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      return true;
    } catch (err) {
      console.error('No se pudo guardar en la carpeta elegida, se usara descarga estandar', err);
      return false;
    }
  }

  // ---- Soporte para arrastrar CARPETAS completas (no solo archivos sueltos) ----
  // El navegador no entrega el contenido de una carpeta en dataTransfer.files
  // directamente -- hay que recorrerla con la API de entradas de archivos
  // (webkitGetAsEntry / FileSystemDirectoryEntry). Reglas:
  //  - Archivos sueltos arrastrados directo (no dentro de una carpeta): se
  //    aceptan igual que siempre, sin filtrar por extension (compatibilidad
  //    con el comportamiento de antes).
  //  - Archivos que vienen DENTRO de una carpeta: solo se toman los .dcm;
  //    el resto (PDF, JPG, Word, etc. -- los otros archivos del paciente
  //    que no son la imagen) se descartan en silencio, sin mostrarlos como
  //    error en la lista.
  //  - Se puede arrastrar UNA o VARIAS carpetas a la vez (una por paciente),
  //    y tambien mezclar carpetas + archivos sueltos en el mismo arrastre.
  const dropMsgEl = document.getElementById('dv-drop-msg');

  function readEntryAsFile(entry){
    return new Promise((resolve, reject) => entry.file(resolve, reject));
  }
  function readDirEntries(dirReader){
    // readEntries() no siempre devuelve todo de una vez (limite ~100 por
    // llamada en algunos navegadores) -- hay que llamarlo repetidamente
    // hasta que devuelva un lote vacio.
    return new Promise((resolve, reject) => {
      let all = [];
      function next(){
        dirReader.readEntries((batch) => {
          if (!batch.length) { resolve(all); return; }
          all = all.concat(batch);
          next();
        }, reject);
      }
      next();
    });
  }
  async function walkEntry(entry, out, insideFolder){
    if (!entry) return;
    if (entry.isFile) {
      try {
        const file = await readEntryAsFile(entry);
        if (!insideFolder || /\.dcm$/i.test(file.name)) {
          out.files.push(file);
        } else {
          out.skipped++;
        }
      } catch (e) { /* archivo ilegible, se ignora */ }
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const children = await readDirEntries(reader);
      for (const child of children) {
        await walkEntry(child, out, true);
      }
    }
  }
  async function collectDroppedFiles(dataTransfer){
    const items = dataTransfer.items;
    const out = { files: [], skipped: 0 };
    if (items && items.length && items[0].webkitGetAsEntry) {
      const entries = Array.from(items).map(it => it.webkitGetAsEntry()).filter(Boolean);
      for (const entry of entries) {
        await walkEntry(entry, out, false);
      }
      return out;
    }
    // Navegador sin soporte de la API de entradas (ej. Safari viejo):
    // se usa la lista plana tal cual, sin poder filtrar carpetas.
    out.files = Array.from(dataTransfer.files);
    return out;
  }

  dropEl.addEventListener('click', () => inputEl.click());
  dropEl.addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('dv-drag'); });
  dropEl.addEventListener('dragleave', () => dropEl.classList.remove('dv-drag'));
  dropEl.addEventListener('drop', async e => {
    e.preventDefault(); dropEl.classList.remove('dv-drag');
    if (dropMsgEl) dropMsgEl.textContent = 'Leyendo carpetas…';
    const { files, skipped } = await collectDroppedFiles(e.dataTransfer);
    if (dropMsgEl) {
      if (skipped > 0) {
        dropMsgEl.textContent = `Se cargaron ${files.length} archivo(s) .dcm — se omitieron ${skipped} archivo(s) que no eran DICOM.`;
      } else if (files.length) {
        dropMsgEl.textContent = `Se cargaron ${files.length} archivo(s).`;
      } else {
        dropMsgEl.textContent = 'No se encontró ningún archivo .dcm en lo que arrastraste.';
      }
    }
    handleFiles(files);
    reenterFullscreenIfPending();
  });
  inputEl.addEventListener('change', e => { handleFiles(e.target.files); reenterFullscreenIfPending(); });

  // ---- Cargar archivo pegando un link (util en tablets, donde no se
  // puede arrastrar un archivo) -- descarga el contenido del link y lo
  // procesa exactamente igual que un archivo arrastrado o seleccionado.
  // Los links de Google Drive se detectan solos y pasan por el proxy del
  // servidor (necesario porque Drive no permite descargarlos directo
  // desde el navegador de otro sitio). Cualquier otro link necesita ser
  // de descarga DIRECTA y permitir acceso entre sitios (CORS); un link a
  // una pagina web (no al archivo en si) no va a funcionar.
  const linkToggle = document.getElementById('dv-link-toggle');
  const linkRow = document.getElementById('dv-link-row');
  const linkInput = document.getElementById('dv-link-input');
  const linkLoadBtn = document.getElementById('dv-link-load');
  const linkMsg = document.getElementById('dv-link-msg');

  linkToggle.addEventListener('click', () => {
    const show = linkRow.style.display === 'none';
    linkRow.style.display = show ? 'flex' : 'none';
    linkMsg.textContent = '';
    if (show) linkInput.focus();
  });

  function extractDriveFileId(rawUrl){
    try {
      const u = new URL(rawUrl);
      if (!/drive\.google\.com$/.test(u.hostname.replace(/^www\./, ''))) return null;
      let m = u.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (m) return m[1];
      const idParam = u.searchParams.get('id');
      return idParam || null;
    } catch (e) { return null; }
  }

  function getAccessCode(){
    try {
      const raw = localStorage.getItem('dv_access_session');
      const session = raw ? JSON.parse(raw) : null;
      return session && session.code ? session.code : null;
    } catch (e) { return null; }
  }

  async function loadFromLink(){
    const url = linkInput.value.trim();
    if (!url) return;
    linkLoadBtn.disabled = true;
    linkMsg.textContent = 'Descargando…';
    linkMsg.className = 'dv-link-msg';
    try {
      const driveId = extractDriveFileId(url);
      let resp, filename;
      if (driveId) {
        const code = getAccessCode();
        if (!code || !window.ACCESS_WORKER_URL) throw new Error('no_access_code');
        resp = await fetch(window.ACCESS_WORKER_URL + '/drive-fetch?id=' + encodeURIComponent(driveId) + '&code=' + encodeURIComponent(code));
        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({}));
          throw new Error(errData.detail || errData.error || ('http_' + resp.status));
        }
        const disposition = resp.headers.get('content-disposition') || '';
        const dispMatch = disposition.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
        filename = dispMatch ? decodeURIComponent(dispMatch[1]) : 'archivo_drive.dcm';
      } else {
        resp = await fetch(url);
        if (!resp.ok) throw new Error('http_' + resp.status);
        filename = decodeURIComponent(url.split('/').pop().split('?')[0] || '') || 'archivo.dcm';
      }
      const blob = await resp.blob();
      if (!/\.dcm$/i.test(filename)) filename += '.dcm';
      const file = new File([blob], filename, { type: blob.type || 'application/dicom' });
      handleFiles([file]);
      linkMsg.textContent = 'Cargado.';
      linkMsg.className = 'dv-link-msg dv-link-ok';
      linkInput.value = '';
    } catch (err) {
      linkMsg.textContent = (err && err.message && err.message !== 'no_access_code' && !/^http_/.test(err.message))
        ? err.message
        : 'No se pudo cargar ese link (debe ser un link de descarga directa, o un link de Drive compartido públicamente).';
      linkMsg.className = 'dv-link-msg dv-link-err';
    } finally {
      linkLoadBtn.disabled = false;
    }
  }
  linkLoadBtn.addEventListener('click', loadFromLink);
  linkInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadFromLink(); });

  function handleFiles(fileList){
    Array.from(fileList).forEach(file => {
      const entry = { name: file.name, status: 'loading', dataSet: null, pixel: null, meta: null, error: null, rotation: 0, flipH: false, flipV: false, invert: false, annotations: [] };
      state.files.push(entry);
      const idx = state.files.length - 1;
      renderFileList();

      const reader = new FileReader();
      reader.onload = function(ev){
        try {
          const byteArray = new Uint8Array(ev.target.result);
          const dataSet = dicomParser.parseDicom(byteArray);
          entry.dataSet = dataSet;
          entry.meta = extractMeta(dataSet);
          entry.pixel = extractPixel(dataSet);
          entry.pixel.origWindowCenter = entry.pixel.windowCenter;
          entry.pixel.origWindowWidth = entry.pixel.windowWidth;
          // Las radiografias de TORAX deben mostrarse siempre en horizontal
          // (segun lo establecido). Si el archivo trae los pixeles en vertical
          // (alto > ancho), se gira 90 grados automaticamente por defecto.
          // Ademas, confirmado con varios archivos consecutivos de este equipo
          // (Carestream Point-of-Care): la punta del corazon aparece apuntando
          // al lado derecho del paciente (marcador "R") en vez del izquierdo
          // ("I", lo anatomicamente correcto) -> se aplica tambien un espejo
          // horizontal por defecto para corregirlo.
          //
          // TORAX sigue siendo el uso mas frecuente -> esta regla se aplica
          // por defecto (igual que antes), INCLUSO si el equipo no llena el
          // tag BodyPartExamined (pasa con algunos equipos). Solo se excluye
          // explicitamente cuando el tag SI esta presente y confirma columna
          // (SPINE/COLUMNA/VERTEB) -- ahi columna llega vertical de fabrica y
          // NO debe rotarse (verificado con 2 archivos DICOM reales:
          // BodyPartExamined="TSPINE", Rows=2866/Columns=1812 y
          // Rows=2471/Columns=1996, ya verticales, correctos sin rotar).
          if (entry.pixel.rows > entry.pixel.cols && !entry.meta.isSpineBodyPart) {
            entry.rotation = 90;
            entry.flipH = true;
          }
          entry.status = 'ok';
        } catch (err) {
          entry.status = 'error';
          entry.error = err && err.message ? err.message : 'No se pudo leer el archivo';
        }
        renderFileList();
        if (entry.status === 'ok') selectFile(idx);
      };
      reader.onerror = function(){
        entry.status = 'error';
        entry.error = 'Error de lectura del archivo';
        renderFileList();
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function dicomStr(dataSet, tag){
    try { const v = dataSet.string(tag); return v ? v.trim() : ''; } catch(e){ return ''; }
  }

  function formatName(raw){
    if (!raw) return '';
    return raw.split('^').filter(Boolean).join(' ');
  }

  function formatDate(raw){
    if (!raw || raw.length < 8) return raw || '';
    return raw.substring(6,8) + '/' + raw.substring(4,6) + '/' + raw.substring(0,4);
  }

  function extractMeta(dataSet){
    const patientName = formatName(dicomStr(dataSet, 'x00100010'));
    const patientId = dicomStr(dataSet, 'x00100020');
    const birthDate = formatDate(dicomStr(dataSet, 'x00100030'));
    const institution = dicomStr(dataSet, 'x00080080');
    const studyDesc = dicomStr(dataSet, 'x00081030') || dicomStr(dataSet, 'x0008103e');
    const studyDate = formatDate(dicomStr(dataSet, 'x00080020'));
    const studyTime = dicomStr(dataSet, 'x00080030');
    const modality = dicomStr(dataSet, 'x00080060');
    const laterality = dicomStr(dataSet, 'x00200062'); // Image Laterality: 'R' o 'L' si el equipo lo registro
    let viewPosition = dicomStr(dataSet, 'x00185101').toUpperCase(); // AP, PA, LAT, LL, RL...
    let viewSource = 'tag (0018,5101)';
    if (!viewPosition) {
      // Respaldo: algunos equipos dejan el tag estructurado vacio pero si
      // escriben la vista en la descripcion. Se revisa primero la descripcion
      // de la SERIE (especifica de esta imagen); solo si no dice nada se usa
      // la del ESTUDIO completo (que puede mencionar "AP and LAT" juntos,
      // ya que un estudio suele incluir ambas tomas).
      const seriesText = dicomStr(dataSet,'x0008103e').toUpperCase();
      const studyText = dicomStr(dataSet,'x00081030').toUpperCase();
      const latRe = /\bLAT\b|\bLATERAL\b|\bLL\b|\bRL\b/;
      const apRe = /\bAP\b|\bPA\b/;
      if (latRe.test(seriesText)) { viewPosition = 'LAT'; viewSource = 'descripcion de serie'; }
      else if (apRe.test(seriesText)) { viewPosition = 'AP'; viewSource = 'descripcion de serie'; }
      else if (latRe.test(studyText) && !apRe.test(studyText)) { viewPosition = 'LAT'; viewSource = 'descripcion de estudio'; }
      else if (apRe.test(studyText) && !latRe.test(studyText)) { viewPosition = 'AP'; viewSource = 'descripcion de estudio'; }
    }
    const isFrontal = viewPosition === 'AP' || viewPosition === 'PA';
    const timeFmt = studyTime && studyTime.length >= 6 ? studyTime.substring(0,2)+':'+studyTime.substring(2,4)+':'+studyTime.substring(4,6) : studyTime;

    // Parte del cuerpo examinada (tag DICOM 0018,0015). Se usa para decidir
    // si aplica la regla de auto-rotacion pensada para torax (ver mas abajo,
    // donde se carga el archivo) -- columna (SPINE/TSPINE/LSPINE/CSPINE) NO
    // debe rotarse igual que torax: torax normalmente se muestra horizontal,
    // columna normalmente se muestra vertical, son casos opuestos.
    const bodyPartExamined = (dicomStr(dataSet, 'x00180015') || '').toUpperCase();
    const isChestBodyPart = /CHEST|THORAX|TORAX/.test(bodyPartExamined);
    const isSpineBodyPart = /SPINE|COLUMNA|VERTEB/.test(bodyPartExamined);

    // Indice de Exposicion / Deviation Index (Modulo de Dosis de Adquisicion
    // de Rayos X). No todos los equipos los graban -- se muestran solo si
    // el archivo los trae, sin inventar ni calcular un valor propio.
    const exposureIndex = dicomStr(dataSet, 'x00181411');
    const targetExposureIndex = dicomStr(dataSet, 'x00181412');
    const deviationIndex = dicomStr(dataSet, 'x00181413');

    return {
      patientName: patientName || '(sin nombre)',
      patientNameRaw: dicomStr(dataSet, 'x00100010') || '',
      patientId: patientId || '(sin ID)',
      birthDate: birthDate || '(sin fecha)',
      institution: institution,
      institutionEdited: false,
      studyDesc: studyDesc || '(sin descripción)',
      studyDate: studyDate || '',
      studyTime: timeFmt || '',
      studyDateTimeDisplay: ((studyDate||'') + ' ' + (timeFmt||'')).trim(),
      modality: modality || '',
      laterality: laterality || '',
      viewPosition: viewPosition || '',
      viewSource: viewSource,
      isFrontal: isFrontal,
      bodyPartExamined: bodyPartExamined || '',
      isChestBodyPart: isChestBodyPart,
      isSpineBodyPart: isSpineBodyPart,
      exposureIndex: exposureIndex || '',
      targetExposureIndex: targetExposureIndex || '',
      deviationIndex: deviationIndex || ''
    };
  }

  function extractPixel(dataSet){
    const rows = dataSet.uint16('x00280010');
    const cols = dataSet.uint16('x00280011');
    const bitsAllocated = dataSet.uint16('x00280100') || 16;
    const bitsStored = dataSet.uint16('x00280101') || bitsAllocated;
    const pixelRepresentation = dataSet.uint16('x00280103') || 0;
    const samplesPerPixel = dataSet.uint16('x00280002') || 1;
    const photometric = (dicomStr(dataSet, 'x00280004') || '').toUpperCase();
    const planarConfig = dataSet.uint16('x00280006') || 0;
    let windowCenter = parseFloat((dicomStr(dataSet,'x00281050')||'').split('\\')[0]);
    let windowWidth = parseFloat((dicomStr(dataSet,'x00281051')||'').split('\\')[0]);
    const rescaleIntercept = parseFloat(dicomStr(dataSet,'x00281052')) || 0;
    const rescaleSlope = parseFloat(dicomStr(dataSet,'x00281053')) || 1;

    const pixelDataElement = dataSet.elements.x7fe00010;
    if (!pixelDataElement) throw new Error('El archivo no contiene datos de imagen (pixel data)');
    if (dataSet.encapsulated || pixelDataElement.undefinedLength) {
      throw new Error('Imagen comprimida (JPEG/JPEG2000) — no soportada en esta versión del visor. Transfer syntax: ' + (dataSet.transferSyntax || 'desconocido'));
    }

    const byteArray = dataSet.byteArray;
    const offset = pixelDataElement.dataOffset;
    let raw;
    if (bitsAllocated === 16) {
      raw = (pixelRepresentation === 1)
        ? new Int16Array(byteArray.buffer, byteArray.byteOffset + offset, rows*cols*samplesPerPixel)
        : new Uint16Array(byteArray.buffer, byteArray.byteOffset + offset, rows*cols*samplesPerPixel);
    } else {
      raw = new Uint8Array(byteArray.buffer, byteArray.byteOffset + offset, rows*cols*samplesPerPixel);
    }

    // Calcula percentiles reales de los pixeles (histograma), para detectar si
    // la ventana (WindowCenter/Width) que declara el archivo realmente coincide
    // con los datos, o si es un valor generico de fabrica que no corresponde
    // (caso real detectado: equipo que deja WC/WW en el rango teorico completo
    // del bit depth, aunque los datos reales usan solo una fraccion de ese rango).
    function computePercentiles(arr, loP, hiP){
      let mn=Infinity, mx=-Infinity;
      for (let i=0;i<arr.length;i++){ const v=arr[i]; if(v<mn)mn=v; if(v>mx)mx=v; }
      if (mx===mn) return {lo:mn, hi:mx, median:mn, p15:mn, p85:mn};
      const bins = 4096;
      const hist = new Uint32Array(bins);
      const scale = (bins-1)/(mx-mn);
      for (let i=0;i<arr.length;i++){
        let idx = Math.round((arr[i]-mn)*scale);
        hist[idx]++;
      }
      const total = arr.length;
      function findPercentile(p){
        const targetCount = total*p;
        let cum=0;
        for (let b=0;b<bins;b++){ cum+=hist[b]; if (cum>=targetCount) return mn + b/scale; }
        return mx;
      }
      const loVal = findPercentile(loP);
      const hiVal = findPercentile(hiP);
      const medVal = findPercentile(0.5);
      const p15Val = findPercentile(0.15);
      const p85Val = findPercentile(0.85);
      return {lo:loVal, hi:hiVal, median:medVal, p15:p15Val, p85:p85Val};
    }

    if (samplesPerPixel === 1) {
      // Percentiles 5%-95% (no 0.5%-99.5%): un rango tan amplio dejaba TODA
      // la imagen comprimida en tonos grises claros, sin negros ni blancos
      // reales (verificado con un caso real: apenas 3.7% de pixeles bajaban
      // de 60/255). Con 5%-95% se logra contraste real (negros ~12, blancos
      // ~230), aceptando que el 5% mas extremo de cada lado se recorte a
      // negro/blanco puro — normal en radiografia, no es perdida de info util.
      const pct = computePercentiles(raw, 0.05, 0.95);
      const rLo = pct.lo*rescaleSlope + rescaleIntercept;
      const rHi = pct.hi*rescaleSlope + rescaleIntercept;
      const rMed = pct.median*rescaleSlope + rescaleIntercept;
      const dataSpan = rHi - rLo;

      // Deteccion DIRECTA del WC/WW "de fabrica" (sin calibrar): el equipo
      // (confirmado con Carestream real) a veces deja el WC/WW en el rango
      // TEORICO COMPLETO del bit depth del archivo -- es decir, exactamente
      // WC = 2^(bitsStored-1) y WW = 2^bitsStored - 1 (ej. 2048/4095 para
      // 12 bits). Este valor no tiene relacion real con los pixeles de esa
      // imagen en particular -- es un placeholder. Se detecta de forma
      // exacta (no por aproximacion de rango) y SIEMPRE se recalcula con
      // los datos reales cuando se detecta, sin importar cuan angosto o
      // ancho salga el histograma real -- el metodo anterior (comparar
      // dataSpan contra 35% del WW) fallaba en torax porque el dataSpan
      // real de una radiografia de torax cae, por casualidad, muy cerca de
      // ese 35% -- a veces arriba, a veces abajo -- disparando la
      // correccion en unos pacientes si y en otros no, de forma inconsistente
      // (confirmado con 5 casos reales del mismo equipo, todos con WC/WW de
      // fabrica identico, pero solo algunos cruzaban el umbral anterior).
      const factoryWC = Math.pow(2, bitsStored - 1);
      const factoryWW = Math.pow(2, bitsStored) - 1;
      const isFactoryDefaultWindow = !isNaN(windowCenter) && !isNaN(windowWidth) &&
        Math.abs(windowCenter - factoryWC) < 1 && Math.abs(windowWidth - factoryWW) < 1;

      if (isNaN(windowCenter) || isNaN(windowWidth) || isFactoryDefaultWindow) {
        // Se centra en la MEDIANA real (no en el promedio de los extremos):
        // asi el tono "tipico" de la imagen cae en gris medio real, en vez
        // de quedar sesgado hacia el blanco cuando el histograma es asimetrico
        // (verificado con un caso real donde la mediana estaba muy por debajo
        // del promedio de los percentiles extremos, dejando la imagen muy clara).
        const halfSpan = Math.max(rMed-rLo, rHi-rMed) * 1.1;
        windowWidth = (halfSpan*2) || 1;
        windowCenter = rMed;
      } else if (dataSpan > 0 && dataSpan < windowWidth*0.35) {
        // Respaldo para equipos/casos donde el "de fabrica" no coincide
        // exactamente con la formula del bit depth, pero el archivo igual
        // trae una ventana mucho mas ancha de lo que realmente usan los
        // pixeles. Umbral calibrado con columna lumbosacra (ver historial).
        const halfSpan = Math.max(rMed-rLo, rHi-rMed) * 1.1;
        windowWidth = halfSpan*2;
        windowCenter = rMed;
      }
    } else if (isNaN(windowCenter) || isNaN(windowWidth)) {
      let min=Infinity, max=-Infinity;
      for (let i=0;i<raw.length;i++){ if(raw[i]<min)min=raw[i]; if(raw[i]>max)max=raw[i]; }
      windowCenter = (max+min)/2; windowWidth = (max-min) || 1;
    }

    const pixelSpacingRaw = dicomStr(dataSet, 'x00280030') || dicomStr(dataSet, 'x00181164') || '';
    const pixelSpacingParts = pixelSpacingRaw.split('\\').map(parseFloat);
    // mm por pixel, promediando fila/columna (en radiografia suelen ser
    // isotropicos -- ej. 0.14x0.14). Si el tag no esta presente, queda NaN y
    // las herramientas de medicion muestran solo pixeles, sin mm.
    const mmPerPixel = (pixelSpacingParts.length === 2 && !isNaN(pixelSpacingParts[0]))
      ? (pixelSpacingParts[0] + pixelSpacingParts[1]) / 2
      : NaN;

    return {
      rows, cols, raw, samplesPerPixel, photometric, planarConfig,
      windowCenter, windowWidth, rescaleIntercept, rescaleSlope, bitsAllocated,
      mmPerPixel,
      // Rango del slider adaptado a esta imagen en particular (en vez de un
      // rango fijo enorme tipo 0-4000): asi cada paso del control representa
      // un cambio pequeno y preciso, en vez de saltos grandes de golpe.
      wlRangeMin: windowCenter - windowWidth * 1.2,
      wlRangeMax: windowCenter + windowWidth * 1.2,
      wwRangeMax: Math.max(windowWidth * 3, 10)
    };
  }

  // Calcula, para imagenes en vista lateral, hacia que lado (izquierda/derecha)
  // apunta la convexidad de la columna, analizando el centro de masa oseo por
  // franjas horizontales y viendo hacia que lado se desvia respecto a la linea
  // recta que une la parte superior con la inferior (la "cuerda" de la curva).
  function detectConvexitySide(p){
    if (p.samplesPerPixel !== 1) return null; // solo aplica a imagenes monocromas
    const w = p.cols, h = p.rows;
    const wc = p.windowCenter, ww = Math.max(p.windowWidth,1);
    const lo = wc - ww/2, hi = wc + ww/2;
    const invert = p.photometric === 'MONOCHROME1';

    function grayAt(x,y){
      let val = p.raw[y*w+x]*p.rescaleSlope + p.rescaleIntercept;
      let g = ((val-lo)/(hi-lo))*255;
      g = Math.max(0, Math.min(255, g));
      return invert ? 255-g : g;
    }

    const bandCount = 14;
    const centers = [];
    const bandHalf = Math.max(1, Math.floor(h*0.01));
    for (let i=0;i<bandCount;i++){
      const yFrac = 0.10 + 0.80*(i/(bandCount-1));
      const yc = Math.floor(h*yFrac);
      let sumW=0, sumWX=0;
      for (let y=Math.max(0,yc-bandHalf); y<Math.min(h,yc+bandHalf); y++){
        for (let x=0;x<w;x++){
          const v = grayAt(x,y);
          const wgt = v-60;
          if (wgt>0){ sumW+=wgt; sumWX+=wgt*x; }
        }
      }
      if (sumW>0) centers.push({ yFrac: yFrac, x: sumWX/sumW });
    }
    if (centers.length < 4) return null;

    // Referencia: posicion X de la franja MAS ALTA (no una cuerda entre extremos,
    // que mezcla la deriva general hombro/pelvis con la curva real y da resultados
    // incorrectos — verificado contra un caso real).
    const refX = centers[0].x;
    let sumDelta = 0;
    for (let i=1;i<centers.length;i++){
      sumDelta += (centers[i].x - refX);
    }
    const avgDelta = sumDelta/(centers.length-1);
    // umbral minimo para evitar decidir un lado por ruido en columnas casi rectas
    if (Math.abs(avgDelta) < w*0.01) return null;
    return avgDelta > 0 ? 'right' : 'left';
  }

  function renderFileList(){
    listEl.innerHTML = '';
    state.files.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'dv-file-item' + (i === state.activeIndex ? ' active' : '');
      const statusText = f.status === 'loading' ? 'Cargando...' : (f.status === 'ok' ? 'Legible ✓' : ('Error: ' + f.error));
      const statusClass = f.status === 'error' ? 'err' : (f.status === 'ok' ? 'ok' : '');

      const infoDiv = document.createElement('div');
      infoDiv.innerHTML = f.name + '<span class="dv-status ' + statusClass + '">' + statusText + '</span>';
      if (f.status === 'ok') infoDiv.addEventListener('click', () => selectFile(i));
      infoDiv.style.flex = '1';
      infoDiv.style.minWidth = '0';

      const removeBtn = document.createElement('button');
      removeBtn.className = 'dv-file-remove';
      removeBtn.title = 'Quitar de la lista';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', (e) => { e.stopPropagation(); removeFile(i); });

      div.appendChild(infoDiv);
      div.appendChild(removeBtn);
      listEl.appendChild(div);
      if (i === state.activeIndex) {
        // Mantiene visible la imagen activa dentro de la lista al navegar
        // con las flechas del teclado (por si hay muchas imagenes cargadas
        // y la activa queda fuera del area visible del panel).
        requestAnimationFrame(() => div.scrollIntoView({ block: 'nearest' }));
      }
    });
    exportAllOpenerBtn.disabled = !state.files.some(f => f.status === 'ok');
    exportAllMainBtn.disabled = exportAllOpenerBtn.disabled;
  }

  function resetViewerToEmpty(){
    canvas.style.display = 'none';
    emptyEl.style.display = 'block';
    metaEl.innerHTML = '';
    exportOpenerBtn.disabled = true;
    exportMainBtn.disabled = true;
  }

  function removeFile(i){
    state.files.splice(i, 1);
    if (state.activeIndex === i) {
      state.activeIndex = -1;
      resetViewerToEmpty();
    } else if (state.activeIndex > i) {
      state.activeIndex -= 1;
    }
    renderFileList();
  }

  function clearAllFiles(){
    state.files = [];
    state.activeIndex = -1;
    resetViewerToEmpty();
    renderFileList();
  }
  document.getElementById('dv-clear-all').addEventListener('click', clearAllFiles);

  function selectFile(i){
    state.activeIndex = i;
    renderFileList();
    if (typeof pendingPoints !== 'undefined') pendingPoints = []; // evita arrastrar puntos de Angulo/Cobb entre imagenes distintas
    const f = state.files[i];
    if (!f.pixel) return;
    wlSlider.min = Math.floor(f.pixel.wlRangeMin);
    wlSlider.max = Math.ceil(f.pixel.wlRangeMax);
    wlSlider.step = 1;
    wwSlider.min = 1;
    wwSlider.max = Math.ceil(f.pixel.wwRangeMax);
    wwSlider.step = 1;
    wlSlider.value = f.pixel.windowCenter;
    wwSlider.value = f.pixel.windowWidth;
    if (typeof window.__dvResetWindowProfileState === 'function') window.__dvResetWindowProfileState();
    if (!f.meta.isFrontal && f.meta.convexitySide === undefined) {
      f.meta.convexitySide = detectConvexitySide(f.pixel); // 'left' | 'right' | null
    }
    if (typeof syncProjectionFromMeta === 'function') syncProjectionFromMeta(f);
    updateMetaPanel(f);
    if (typeof updateLiveReadout === 'function') updateLiveReadout(f.pixel);
    document.getElementById('dv-invert').classList.toggle('dv-tool-active', !!f.invert);
    zoomLevel = 1;
    viewerWrap.classList.remove('dv-zoomed');
    if (typeof setInteractionActive === 'function') setInteractionActive(false);
    const zi = document.getElementById('dv-zoom-indicator');
    if (zi) zi.style.display = 'none';
    draw(f, 1);
    exportOpenerBtn.disabled = false;
    exportMainBtn.disabled = false;
  }

  wlSlider.addEventListener('input', () => { if (state.activeIndex>=0){ const p=state.files[state.activeIndex].pixel; p.windowCenter = parseFloat(wlSlider.value); wlVal.textContent = Math.round(p.windowCenter); draw(state.files[state.activeIndex],1);} });
  wwSlider.addEventListener('input', () => { if (state.activeIndex>=0){ const p=state.files[state.activeIndex].pixel; p.windowWidth = parseFloat(wwSlider.value); wwVal.textContent = Math.round(p.windowWidth); draw(state.files[state.activeIndex],1);} });

  // ---- Reset de Nivel (WL) y Ancho de ventana (WW) ----
  const wlwwResetBtn = document.getElementById('dv-wlww-reset');

  wlwwResetBtn.addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    const p = f.pixel;
    if (!p || p.origWindowCenter === undefined) return;
    p.windowCenter = p.origWindowCenter;
    p.windowWidth = p.origWindowWidth;
    wlSlider.value = p.windowCenter;
    wwSlider.value = p.windowWidth;
    wlVal.textContent = Math.round(p.windowCenter);
    wwVal.textContent = Math.round(p.windowWidth);
    if (typeof updateLiveReadout === 'function') updateLiveReadout(p);
    draw(f, 1);
  });

  // ---- Perfiles de contraste: Óseo / Partes blandas, por region+proyeccion ----
  // Aviso importante: a diferencia de TC (donde WC/WW se define en Unidades
  // Hounsfield absolutas y "ventana ósea" / "ventana de partes blandas" son
  // presets estandarizados), en radiografia simple no existe una escala
  // absoluta equivalente. Estos perfiles son multiplicadores relativos
  // al WC/WW original que trae el propio DICOM (o el auto-calculado si el
  // equipo no lo trae), pensados como PUNTO DE PARTIDA: el usuario debe
  // seguir afinando con los sliders WL/WW segun cada imagen.
  //
  // Frontal vs. Lateral necesitan factores DISTINTOS: en lateral hay mucho
  // mas volumen de tejido que atravesar (todo el diametro antero-posterior
  // del paciente), por lo que la relacion senal/contraste util para hueso
  // cambia respecto a la frontal.
  //
  // Estado real de calibracion (honesto, no inventar precision que no hay):
  //   CLS Frontal / Óseo -> calibrado con 1 caso real (ver detalle abajo).
  //   CLS Lateral / Óseo -> SIN calibrar todavia con un caso real. Se deja
  //     como el valor conservador que se probo antes de tener el dato de
  //     Frontal (WW mas angosto), solo como punto de partida provisional.
  //   Soft (Frontal y Lateral) -> mismo factor generico para ambas, tampoco
  //     calibrado por separado todavia.
  const REGION_PROFILES = {
    CLS: {
      frontal: {
        // Calibrado con 2 casos reales (misma region/proyeccion, distinta
        // exposicion cada vez):
        //   Caso 1: WL 6853->7827, WW 3197->5999 (ancho orig. ~4567)
        //           -> centerFactor=1.142, widthFactor=1.313
        //   Caso 2: WL 6853->8056, WW 4568->5923 (orig. ~6001/~3479, tras
        //           deshacer el factor del caso 1 que ya estaba aplicado)
        //           -> centerFactor=1.342, widthFactor=1.702
        // Los dos casos difieren bastante entre si (~18% en centro, ~30%
        // en ancho) a pesar de ser la misma region/proyeccion -- prueba de
        // que el WC/WW que trae cada DICOM ya varia por exposicion/equipo,
        // y un multiplicador fijo nunca va a calzar perfecto en el 100% de
        // los casos. Se usa el PROMEDIO de ambos como mejor punto de
        // partida disponible hasta ahora.
        bone: { center: 1.242, width: 1.508 },
        soft: { center: 0.85, width: 1.6 }
      },
      lateral: {
        // Calibrado con 1 caso real: WL 7085->8751, WW 4430->5421 (sobre un
        // ancho original estimado en 6328, deshaciendo el factor viejo
        // 1.0/0.7 que estaba de placeholder). A diferencia de frontal, aca
        // el ancho necesario es MENOR al original (0.857, angostar un
        // poco), no mayor -- consistente con la logica de que en lateral
        // hay mas volumen de tejido que atravesar. Con un solo caso, este
        // valor tiene mas incertidumbre que el de frontal (que ya tiene 2).
        bone: { center: 1.235, width: 0.857 },
        soft: { center: 0.85, width: 1.6 }
      }
    }
  };

  // La proyeccion (frontal/lateral) ya no se elige a mano desde un panel:
  // se toma directo de la deteccion automatica del DICOM (m.isFrontal,
  // tomado del tag ViewPosition AP/PA) cada vez que se activa una imagen.
  let currentProjection = 'frontal';

  function setProjection(proj){
    currentProjection = proj;
  }

  function syncProjectionFromMeta(f){
    if (f && f.meta && typeof f.meta.isFrontal === 'boolean') {
      setProjection(f.meta.isFrontal ? 'frontal' : 'lateral');
    }
  }

  function applyWindowProfile(centerFactor, widthFactor){
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    const p = f.pixel;
    if (!p || p.origWindowCenter === undefined) return;
    p.windowCenter = p.origWindowCenter * centerFactor;
    p.windowWidth = Math.max(1, p.origWindowWidth * widthFactor);
    wlSlider.value = p.windowCenter;
    wwSlider.value = p.windowWidth;
    wlVal.textContent = Math.round(p.windowCenter);
    wwVal.textContent = Math.round(p.windowWidth);
    if (typeof updateLiveReadout === 'function') updateLiveReadout(p);
    draw(f, 1);
  }

  // Revierte WL/WW a los valores ORIGINALES del DICOM (los que traia el
  // archivo antes de aplicar cualquier perfil Oseo/Soft), usado al apagar
  // el perfil activo con un segundo clic sobre el mismo boton.
  function revertToOriginalWindow(){
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    const p = f.pixel;
    if (!p || p.origWindowCenter === undefined) return;
    p.windowCenter = p.origWindowCenter;
    p.windowWidth = p.origWindowWidth;
    wlSlider.value = p.windowCenter;
    wwSlider.value = p.windowWidth;
    wlVal.textContent = Math.round(p.windowCenter);
    wwVal.textContent = Math.round(p.windowWidth);
    if (typeof updateLiveReadout === 'function') updateLiveReadout(p);
    draw(f, 1);
  }

  function getActiveProfileSet(){
    const region = REGION_PROFILES.CLS;
    return region[currentProjection] || region.frontal;
  }

  // Oseo/Soft funcionan como interruptor: un clic activa el perfil (queda
  // resaltado), un segundo clic sobre el MISMO boton lo apaga y devuelve
  // la imagen a su Nivel/Ancho original (no al de fabrica del monitor,
  // sino al que traia el archivo DICOM antes de tocar nada). Elegir el
  // otro perfil mientras uno ya esta activo simplemente cambia de uno a
  // otro (no hace falta apagar primero).
  let activeWindowProfile = null; // null | 'bone' | 'soft'
  const boneProfileBtn = document.getElementById('dv-profile-bone');
  const softProfileBtn = document.getElementById('dv-profile-soft');

  function setActiveWindowProfile(profile){
    activeWindowProfile = profile;
    boneProfileBtn.classList.toggle('dv-tool-active', profile === 'bone');
    softProfileBtn.classList.toggle('dv-tool-active', profile === 'soft');
  }
  window.__dvResetWindowProfileState = () => setActiveWindowProfile(null);

  boneProfileBtn.addEventListener('click', () => {
    if (activeWindowProfile === 'bone') {
      setActiveWindowProfile(null);
      revertToOriginalWindow();
      return;
    }
    setActiveWindowProfile('bone');
    const prof = getActiveProfileSet().bone;
    applyWindowProfile(prof.center, prof.width);
  });

  softProfileBtn.addEventListener('click', () => {
    // WW mas amplio (menor contraste, mas gradacion de grises) y centro
    // levemente desplazado: ayuda a visualizar psoas, tejido paravertebral
    // y contornos de baja densidad que quedan "quemados" en el perfil oseo.
    // Mismo factor para Frontal/Lateral por ahora (no calibrado por
    // separado todavia -- ver tabla REGION_PROFILES mas arriba).
    if (activeWindowProfile === 'soft') {
      setActiveWindowProfile(null);
      revertToOriginalWindow();
      return;
    }
    setActiveWindowProfile('soft');
    const prof = getActiveProfileSet().soft;
    applyWindowProfile(prof.center, prof.width);
  });

  document.getElementById('dv-rotate-left').addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    f.rotation = ((f.rotation||0) + 90) % 360;
    draw(f, 1);
  });
  document.getElementById('dv-rotate-right').addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    f.rotation = ((f.rotation||0) - 90 + 360) % 360;
    draw(f, 1);
  });
  document.getElementById('dv-flip-h').addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    f.flipH = !f.flipH;
    draw(f, 1);
  });
  document.getElementById('dv-flip-v').addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    f.flipV = !f.flipV;
    draw(f, 1);
  });
  document.getElementById('dv-rotate-180').addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    f.rotation = ((f.rotation||0) + 180) % 360;
    draw(f, 1);
  });
  document.getElementById('dv-clear-transforms').addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    f.rotation = 0; f.flipH = false; f.flipV = false;
    draw(f, 1);
  });
  const invertBtn = document.getElementById('dv-invert');
  invertBtn.addEventListener('click', () => {
    if (state.activeIndex < 0) return;
    const f = state.files[state.activeIndex];
    f.invert = !f.invert;
    invertBtn.classList.toggle('dv-tool-active', f.invert);
    draw(f, 1);
  });

  // ---- Zoom: el tamaño de ajuste ("100%") se CALCULA matematicamente segun
  // el tamaño real del contenedor y la resolucion nativa de la imagen — no se
  // mide del DOM (eso daba resultados inconsistentes con canvas). El zoom
  // escala ese tamaño calculado, siempre con las mismas proporciones.
  const viewerWrap = document.getElementById('dv-viewer-wrap');
  let zoomLevel = 1;

  // ---- Modo interactivo (zoom con rueda) + ventaneo con clic sostenido ----
  // Antes la rueda del mouse siempre hacia zoom apenas se pasaba por encima
  // de la imagen, lo cual era facil de disparar sin querer. Ahora hace falta
  // un CLIC IZQUIERDO (sin arrastrar, sin herramienta activa) sobre la
  // imagen para "armar" el modo interactivo: recien ahi la rueda hace zoom.
  // Otro clic (sin arrastrar) lo apaga; otro lo vuelve a encender.
  //
  // El ventaneo (Nivel/Ancho) con zoom aplicado es un gesto APARTE, clasico:
  // presionar el clic izquierdo Y MANTENERLO mientras se arrastra. Un clic
  // SIN arrastre siempre es el interruptor de arriba; un clic CON arrastre
  // (mientras hay zoom) siempre ventanea, sin apagar/encender el modo
  // interactivo. Antes se ventaneaba con solo mover el mouse (sin sostener
  // el clic) una vez "armado", pero eso se activaba solo con tener el boton
  // presionado en cualquier momento despues del zoom, sin un clic fresco --
  // ahora requiere presionar y arrastrar cada vez.
  let interactionActive = false;
  let pendingToggleStart = null; // {x,y} del mousedown, para distinguir clic de arrastre
  let leftWindowDrag = null; // ventaneo con clic izquierdo sostenido (solo con zoom aplicado)

  const interactionIndicator = document.createElement('div');
  interactionIndicator.id = 'dv-interaction-indicator';
  interactionIndicator.style.cssText = 'position:absolute;top:8px;right:8px;z-index:25;color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:10.5px;pointer-events:none;display:none;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:3px;';
  interactionIndicator.textContent = '🖱 Zoom/Ventaneo activo';
  viewerWrap.appendChild(interactionIndicator);

  function setInteractionActive(on){
    interactionActive = on;
    interactionIndicator.style.display = on ? 'block' : 'none';
  }

  // Indicador flotante de zoom (reemplaza el texto que estaba en el panel de
  // Herramientas, ya innecesario porque el zoom ahora se controla 100% con
  // la rueda del mouse). Solo se muestra cuando el zoom no esta al 100%.
  const zoomIndicator = document.createElement('div');
  zoomIndicator.id = 'dv-zoom-indicator';
  zoomIndicator.style.cssText = 'position:absolute;top:8px;left:8px;z-index:25;color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:11px;pointer-events:none;display:none;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:3px;';
  viewerWrap.appendChild(zoomIndicator);

  function fitCanvasToContainer(){
    const containerW = viewerWrap.clientWidth;
    const containerH = viewerWrap.clientHeight;
    const nativeW = canvas.width, nativeH = canvas.height;
    if (!containerW || !containerH || !nativeW || !nativeH) return;
    const fitScale = Math.min(containerW/nativeW, containerH/nativeH);
    const baseW = nativeW*fitScale, baseH = nativeH*fitScale;
    canvas.style.width = (baseW*zoomLevel) + 'px';
    canvas.style.height = (baseH*zoomLevel) + 'px';
  }
  window.fitCanvasToContainer = fitCanvasToContainer;

  function applyZoom(){
    zoomIndicator.textContent = Math.round(zoomLevel*100) + '%';
    zoomIndicator.style.display = zoomLevel !== 1 ? 'block' : 'none';
    viewerWrap.classList.toggle('dv-zoomed', zoomLevel !== 1);
    fitCanvasToContainer();
  }

  // Banner de aviso de privacidad: colapsado por defecto (una sola linea)
  // para dar mas espacio vertical a la imagen; se expande con un clic sin
  // perder el texto completo de la advertencia.
  document.getElementById('dv-warn-toggle').addEventListener('click', function(){
    this.classList.toggle('dv-warn-expanded');
    const chevron = this.querySelector('.dv-warn-chevron');
    if (chevron) chevron.textContent = this.classList.contains('dv-warn-expanded') ? '▴' : '▾';
  });

  // Zoom con la rueda del mouse, ANCLADO al punto donde esta el cursor (no
  // fijo en una esquina): se ajusta el scroll del contenedor para que el
  // punto de la imagen que esta bajo el cursor se mantenga en el mismo
  // lugar de la pantalla mientras se acerca/aleja, igual que Photoshop/Figma.
  // Minimo de zoom: 100% (1:1, tamano normal de presentacion) -- antes
  // llegaba a 25%, dejando la imagen demasiado chica para distinguir nada
  // dentro del recuadro negro.
  // Zoom con la rueda del mouse, ANCLADO al punto donde esta el cursor (no
  // fijo en una esquina): se ajusta el scroll del contenedor para que el
  // punto de la imagen que esta bajo el cursor se mantenga en el mismo
  // lugar de la pantalla mientras se acerca/aleja, igual que Photoshop/Figma.
  // Minimo de zoom: 100% (1:1, tamano normal de presentacion) -- antes
  // llegaba a 25%, dejando la imagen demasiado chica para distinguir nada
  // dentro del recuadro negro.
  //
  // Los eventos "wheel" de un mismo gesto de rueda pueden llegar varias
  // veces por frame (rueda rapida / trackpad). Antes cada uno procesaba su
  // zoom+scroll de forma sincronica e inmediata, lo que forzaba varias
  // lecturas/escrituras de layout (getBoundingClientRect, clientWidth) en
  // rafaga dentro del mismo frame -- el navegador terminaba mostrando
  // valores intermedios/desincronizados y la imagen "tambaleaba" un
  // instante antes de asentarse. Ahora se acumulan los deltas y se aplica
  // UN solo zoom+scroll por frame (requestAnimationFrame), leyendo/
  // escribiendo el layout una sola vez.
  let wheelZoomAccum = 0;
  let wheelCursorPoint = null;
  let wheelRAFScheduled = false;
  viewerWrap.addEventListener('wheel', (e) => {
    if (state.activeIndex < 0) return;
    if (!interactionActive) return; // requiere clic izquierdo antes para "armar" el zoom
    e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1; // rueda hacia arriba = acercar
    wheelZoomAccum += dir * 0.1;
    wheelCursorPoint = { x: e.clientX, y: e.clientY };
    if (wheelRAFScheduled) return;
    wheelRAFScheduled = true;
    requestAnimationFrame(() => {
      wheelRAFScheduled = false;
      if (!wheelCursorPoint || state.activeIndex < 0) { wheelZoomAccum = 0; return; }
      const oldZoom = zoomLevel;
      const newZoom = Math.max(1, Math.min(6, +(zoomLevel + wheelZoomAccum).toFixed(2)));
      wheelZoomAccum = 0;
      if (newZoom === oldZoom) return;
      // Punto bajo el cursor, en coordenadas de contenido (independiente del
      // scroll actual), ANTES de cambiar el zoom:
      const rect = viewerWrap.getBoundingClientRect();
      const cursorX = wheelCursorPoint.x - rect.left, cursorY = wheelCursorPoint.y - rect.top;
      const contentX = viewerWrap.scrollLeft + cursorX;
      const contentY = viewerWrap.scrollTop + cursorY;
      const ratio = newZoom / oldZoom;
      zoomLevel = newZoom;
      applyZoom();
      // Reescala ese punto segun el nuevo zoom y ajusta el scroll para que
      // quede otra vez exactamente bajo el cursor.
      viewerWrap.scrollLeft = contentX*ratio - cursorX;
      viewerWrap.scrollTop = contentY*ratio - cursorY;
    });
  }, { passive: false });


  // Clic derecho SOSTENIDO + arrastre:
  //  - Si HAY zoom aplicado (>100%): navega/hace pan por la imagen (como ya
  //    funcionaba).
  //  - Si NO hay zoom (100%, vista ajustada): en vez de pan (que no tiene
  //    sentido sin zoom, no hay nada que recorrer), ajusta Nivel/Ancho de
  //    ventana directamente sobre la imagen: movimiento horizontal = Ancho
  //    (WW), movimiento vertical = Nivel (WL). Reemplaza el uso tactil de los
  //    sliders laterales (que quedan ocultos, pero siguen funcionando via
  //    JS por si se quieren reactivar).
  // Clic derecho RAPIDO (sin arrastre) = sigue borrando la anotacion bajo el
  // cursor, como ya funcionaba antes.
  let rightDrag = null; // pan cuando hay zoom: { startX, startY, startScrollLeft, startScrollTop, moved }
  let windowDrag = null; // ajuste WL/WW cuando no hay zoom: { startX, startY, startCenter, startWidth, moved }

  const wlwwLiveReadout = document.createElement('div');
  wlwwLiveReadout.id = 'dv-wlww-live';
  wlwwLiveReadout.style.cssText = 'position:absolute;left:8px;bottom:8px;z-index:25;color:var(--accent);font-family:"IBM Plex Mono",monospace;font-size:11px;pointer-events:none;display:none;line-height:1.5;';
  viewerWrap.appendChild(wlwwLiveReadout);

  function updateLiveReadout(p){
    wlwwLiveReadout.innerHTML =
      '<div>WL: ' + Math.round(p.windowCenter) + '</div>' +
      '<div>WW: ' + Math.round(p.windowWidth) + '</div>';
    wlwwLiveReadout.style.display = 'block';
  }

  viewerWrap.addEventListener('mousedown', (e) => {
    if (e.button !== 2) return;
    e.preventDefault();
    // WL/WW por clic derecho sostenido: siempre disponible sin zoom (100%).
    // Con zoom activo, el clic derecho normal sigue haciendo PAN (util para
    // navegar la imagen ampliada) -- pero si se mantiene Alt presionado,
    // el clic derecho ajusta WL/WW en vez de hacer pan, aunque haya zoom.
    // (Se usa Alt y no Shift: Shift+clic-derecho fuerza el menu contextual
    // NATIVO del navegador en varios navegadores -Firefox en particular-
    // ignorando el preventDefault() de la pagina, lo cual rompia el gesto.)
    const wantsWindowing = (zoomLevel === 1 || e.altKey);
    if (wantsWindowing && state.activeIndex >= 0 && state.files[state.activeIndex].pixel) {
      const f = state.files[state.activeIndex];
      windowDrag = {
        startX: e.clientX, startY: e.clientY,
        startCenter: f.pixel.windowCenter, startWidth: f.pixel.windowWidth,
        moved: false
      };
      updateLiveReadout(f.pixel);
      return;
    }
    rightDrag = {
      startX: e.clientX, startY: e.clientY,
      startScrollLeft: viewerWrap.scrollLeft, startScrollTop: viewerWrap.scrollTop,
      moved: false
    };
  });
  window.addEventListener('mousemove', (e) => {
    if (windowDrag) {
      const dx = e.clientX - windowDrag.startX, dy = e.clientY - windowDrag.startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) windowDrag.moved = true;
      if (windowDrag.moved && state.activeIndex >= 0) {
        const f = state.files[state.activeIndex];
        const p = f.pixel;
        if (p) {
          // sensibilidad proporcional al ancho original de la imagen, para
          // que el gesto se sienta parecido sin importar la escala de datos
          const sensitivity = Math.max(p.origWindowWidth || p.windowWidth, 10) / 300;
          p.windowWidth = Math.max(1, windowDrag.startWidth + dx * sensitivity);
          p.windowCenter = windowDrag.startCenter - dy * sensitivity;
          wlSlider.value = Math.round(p.windowCenter);
          wwSlider.value = Math.round(p.windowWidth);
          wlVal.textContent = Math.round(p.windowCenter);
          wwVal.textContent = Math.round(p.windowWidth);
          updateLiveReadout(p);
          draw(f, 1, true);
        }
      }
      return;
    }
    if (!rightDrag) return;
    const dx = e.clientX - rightDrag.startX, dy = e.clientY - rightDrag.startY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) rightDrag.moved = true;
    if (rightDrag.moved) {
      viewerWrap.scrollLeft = rightDrag.startScrollLeft - dx;
      viewerWrap.scrollTop = rightDrag.startScrollTop - dy;
    }
  });
  window.addEventListener('mouseup', (e) => {
    if (e.button !== 2) return;
    if (windowDrag) {
      if (windowDrag.moved) suppressNextContextDelete = true;
      windowDrag = null;
    }
    if (rightDrag) {
      if (rightDrag.moved) suppressNextContextDelete = true;
      rightDrag = null;
    }
  });
  let suppressNextContextDelete = false;

  // ---- Soporte tactil (iPad/touch) ----------------------------------------
  // Traduce gestos de dedo a los mismos eventos de mouse que ya maneja el
  // codigo de arriba, para no duplicar logica ni romper el mouse/trackpad
  // (que en iPad con Magic Keyboard/trackpad ya funciona nativo como mouse):
  //   1 dedo  -> equivalente a clic IZQUIERDO (dibujar, mover anotaciones)
  //   2 dedos -> equivalente a clic DERECHO (pan / ajustar brillo-contraste;
  //              toque rapido de 2 dedos sin arrastre = borrar anotacion)
  //
  // PELLIZCO (pinch) con 2 dedos = zoom, usando el mismo zoomLevel/applyZoom
  // de los botones +/-/1:1. Con 2 dedos hay ambiguedad al inicio (¿el usuario
  // quiere pan/windowing o pellizcar para hacer zoom?), asi que se decide en
  // caliente: si la DISTANCIA entre los 2 dedos cambia mas que el movimiento
  // del punto medio, se interpreta como pellizco (se cancela el pan/windowing
  // que se habia iniciado); si no, sigue siendo pan/windowing como antes.
  (function initTouchSupport(){
    let touchButton = null; // 0 = un dedo, 2 = dos dedos, null = sin toque activo
    let lastPoint = null;
    let moved = false;

    let pinchMode = false;      // true una vez que se decide que es pellizco
    let pinchStartDist = null;  // distancia inicial entre los 2 dedos
    let pinchStartZoom = null;  // zoomLevel al iniciar el pellizco

    function midpoint(touches){
      if (touches.length === 1) return { x: touches[0].clientX, y: touches[0].clientY };
      return {
        x: (touches[0].clientX + touches[1].clientX) / 2,
        y: (touches[0].clientY + touches[1].clientY) / 2
      };
    }

    function distance(touches){
      if (touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx*dx + dy*dy);
    }

    function fireMouse(type, point, button){
      canvas.dispatchEvent(new MouseEvent(type, {
        bubbles: true, cancelable: true, view: window,
        clientX: point.x, clientY: point.y,
        button: button, buttons: button === 2 ? 2 : 1
      }));
    }

    // cancela un drag de pan/windowing que ya se habia iniciado (le manda un
    // mouseup) para pasar limpiamente al modo pellizco
    function cancelMouseDrag(){
      if (touchButton !== null) fireMouse('mouseup', lastPoint, touchButton);
    }

    viewerWrap.addEventListener('touchstart', (e) => {
      if (e.touches.length < 1 || e.touches.length > 2) return;
      e.preventDefault();
      moved = false;
      pinchMode = false;
      lastPoint = midpoint(e.touches);
      if (e.touches.length === 2) {
        pinchStartDist = distance(e.touches);
        pinchStartZoom = zoomLevel;
      }
      touchButton = e.touches.length === 2 ? 2 : 0;
      fireMouse('mousedown', lastPoint, touchButton);
    }, { passive: false });

    viewerWrap.addEventListener('touchmove', (e) => {
      if (touchButton === null) return;
      e.preventDefault();

      if (e.touches.length === 2 && !pinchMode) {
        const dist = distance(e.touches);
        const distChange = Math.abs(dist - pinchStartDist);
        const p = midpoint(e.touches);
        const panChange = Math.max(Math.abs(p.x - lastPoint.x), Math.abs(p.y - lastPoint.y));
        // si los dedos se separan/juntan claramente mas de lo que se mueve
        // el punto medio, es un pellizco, no un pan/windowing
        if (distChange > 10 && distChange > panChange) {
          pinchMode = true;
          cancelMouseDrag(); // cierra limpiamente el drag de mouse simulado
        }
      }

      if (pinchMode) {
        const dist = distance(e.touches.length === 2 ? e.touches : [e.touches[0], e.touches[0]]);
        if (dist > 0 && pinchStartDist) {
          const scale = dist / pinchStartDist;
          zoomLevel = Math.max(1, Math.min(6, +(pinchStartZoom * scale).toFixed(2)));
          applyZoom();
        }
        lastPoint = midpoint(e.touches);
        return;
      }

      const p = midpoint(e.touches.length ? e.touches : [{ clientX: lastPoint.x, clientY: lastPoint.y }]);
      if (Math.abs(p.x - lastPoint.x) > 2 || Math.abs(p.y - lastPoint.y) > 2) moved = true;
      lastPoint = p;
      fireMouse('mousemove', p, touchButton);
    }, { passive: false });

    function endTouch(e){
      if (touchButton === null) return;
      e.preventDefault();
      if (!pinchMode) {
        fireMouse('mouseup', lastPoint, touchButton);
        if (touchButton === 2 && !moved) {
          // toque rapido de 2 dedos = equivalente a clic derecho rapido: borra
          // la anotacion bajo el punto (mismo comportamiento que ya existe)
          canvas.dispatchEvent(new MouseEvent('contextmenu', {
            bubbles: true, cancelable: true, view: window,
            clientX: lastPoint.x, clientY: lastPoint.y
          }));
        }
      }
      touchButton = null;
      lastPoint = null;
      moved = false;
      pinchMode = false;
      pinchStartDist = null;
      pinchStartZoom = null;
    }
    viewerWrap.addEventListener('touchend', endTouch, { passive: false });
    viewerWrap.addEventListener('touchcancel', endTouch, { passive: false });
  })();

  // ---- Herramientas de anotacion: flecha y texto (con opcion de enmarcado) ----
  let currentTool = 'none'; // 'none' | 'arrow' | 'text' | 'length' | 'angle' | 'cobb'
  let dragStart = null;
  const arrowBtn = document.getElementById('dv-tool-arrow');
  const textBtn = document.getElementById('dv-tool-text');
  const lengthBtn = document.getElementById('dv-tool-length');
  const angleBtn = document.getElementById('dv-tool-angle');
  const cobbBtn = document.getElementById('dv-tool-cobb');
  // Puntos acumulados para herramientas de clic multiple (Angulo=3, Cobb=4).
  // Se reinicia al cambiar de herramienta o al completar una medicion.
  let pendingPoints = [];

  function setTool(tool){
    currentTool = (currentTool === tool) ? 'none' : tool;
    pendingPoints = [];
    arrowBtn.classList.toggle('dv-tool-active', currentTool === 'arrow');
    textBtn.classList.toggle('dv-tool-active', currentTool === 'text');
    lengthBtn.classList.toggle('dv-tool-active', currentTool === 'length');
    angleBtn.classList.toggle('dv-tool-active', currentTool === 'angle');
    cobbBtn.classList.toggle('dv-tool-active', currentTool === 'cobb');
    activeMarker = null;
    markerBtns.forEach(b => b.classList.remove('dv-tool-active'));
    canvas.style.cursor = currentTool === 'none' ? 'default' : 'crosshair';
  }
  arrowBtn.addEventListener('click', () => setTool('arrow'));

  // ---- Navegar entre imagenes cargadas con las flechas ↑ / ↓ del teclado ----
  // ↓ pasa a la siguiente imagen de la lista, ↑ a la anterior. Se detiene en
  // los extremos (no da la vuelta): en la ultima imagen, ↓ no hace nada; en
  // la primera, ↑ no hace nada. Salta las imagenes que no cargaron bien
  // (status distinto de 'ok'), ya que esas no se pueden mostrar. Se
  // desactiva mientras se esta escribiendo en un campo de texto (por
  // ejemplo, una anotacion o el buscador), para no interferir con eso.
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;
    if (!state.files.length) return;
    const okIndexes = state.files.map((f, i) => f.status === 'ok' ? i : null).filter(i => i !== null);
    if (!okIndexes.length) return;
    e.preventDefault();
    const posInOk = okIndexes.indexOf(state.activeIndex);
    let targetPos;
    if (e.key === 'ArrowDown') {
      targetPos = posInOk === -1 ? 0 : Math.min(posInOk + 1, okIndexes.length - 1);
    } else {
      targetPos = posInOk === -1 ? 0 : Math.max(posInOk - 1, 0);
    }
    const targetIndex = okIndexes[targetPos];
    if (targetIndex !== state.activeIndex) selectFile(targetIndex);
  });
